function mix(a,b,t){return a+(b-a)*t}

 c.fillStyle='#644a45';c.fillRect(0,0,W,30);c.fillStyle='#c09c70';c.fillRect(0,30,W,5);c.fillStyle='#e3ccb0';c.fillRect(0,35,W,11);line(0,48,W,48,'#718273',3);

 line(254,96,1346,96,'#a88357',5);[263,1337].forEach(x=>ellipse(x,96,8,8,'#d4b47c'));}
