function leaves(t){
 const lift=smooth(1.72,3.05,t);
 // Ground leaves remain dense after the airborne disturbance has developed.
 for(let i=0;i<365;i++){
  const a=seed(i*11+7)*TAU,b=seed(i*11+8),c=seed(i*11+9),r=119*Math.sqrt(b);
  const p=[Math.cos(a)*r,1.1+c*2.1,Math.sin(a)*r],q=project(p);
  faces.push({leaf:true,d:depth(p)+.04,x:q[0],y:q[1],size:1.05+seed(i*11+10)*2.15,angle:a*2,fold:.35+c*.65,alpha:.88,color:['#dcb62d','#edba27','#b7a634','#d87825','#b93720','#e1ca42','#8e9d38'][Math.floor(seed(i*11+11)*7)]});
 }
 for(let i=0;i<465;i++){
  const a=seed(i*13+5101),b=seed(i*13+5102),c=seed(i*13+5103),d=seed(i*13+5104);
  const angle=a*TAU+t*(.3+b*.48)+lift*(.8+c*2.1);
  const high=10+178*Math.pow(c,.87),h=2.5+lift*high;
  const envelope=Math.sqrt(Math.max(.05,1-Math.pow((high-69)/145,2)));
  const r=(24+102*Math.sqrt(b))*(1-lift*(1-envelope));
  const p=[Math.cos(angle)*r,h+lift*Math.sin(angle*2+c*TAU)*7,Math.sin(angle)*r],q=project(p);
  faces.push({leaf:true,d:depth(p),x:q[0],y:q[1],size:1.1+d*2.1,angle:a*TAU+t*(1.3+3.1*c),fold:.17+.83*Math.abs(Math.sin(a*23+t*(1.8+b))),alpha:lift*(.7+.3*d),color:['#e2bb21','#f5c632','#b5b23c','#e48623','#c73c24','#e6cf42','#98a943','#dc5620'][Math.floor(seed(i*13+5105)*8)]});
 }
}
function material(fill,p){
 if(typeof fill==='string')return fill;
 let minY=Infinity,maxY=-Infinity;for(const q of p){minY=Math.min(minY,q[1]);maxY=Math.max(maxY,q[1])}
 const g=ctx.createLinearGradient(0,minY,0,maxY+.01);g.addColorStop(0,fill.top);if(fill.middle)g.addColorStop(.58,fill.middle);g.addColorStop(1,fill.bottom);return g;
}
function paintScene(){
 faces.sort((a,b)=>a.d-b.d);
 for(const f of faces){
  if(f.leaf){if(f.alpha<=0)continue;ctx.save();ctx.globalAlpha=f.alpha;ctx.translate(f.x,f.y);ctx.rotate(f.angle);ctx.scale(1,f.fold);ctx.fillStyle=f.color;
   path([[-f.size,0],[-f.size*.48,-f.size*.2],[-f.size*.58,-f.size*.51],[-f.size*.08,-f.size*.35],[f.size*.2,-f.size*.6],[f.size*.42,-f.size*.2],[f.size,0],[f.size*.35,f.size*.24],[f.size*.12,f.size*.52],[-f.size*.18,f.size*.3],[-f.size*.6,f.size*.35]]);ctx.fill();ctx.strokeStyle='#f9dda988';ctx.lineWidth=.25;ctx.beginPath();ctx.moveTo(-f.size*1.2,0);ctx.lineTo(f.size*.6,0);ctx.stroke();ctx.restore();
  }else{
   const p=f.points.map(project);path(p);ctx.fillStyle=material(f.fill,p);if(f.glow){ctx.save();ctx.shadowColor='#fff2a1';ctx.shadowBlur=f.glow;ctx.fill();ctx.restore()}else ctx.fill();
   if(f.stroke){ctx.strokeStyle=f.stroke;ctx.lineWidth=f.line;ctx.stroke()}
  }

}
function localIllumination(){

}

 ctx.save();ctx.translate(552+drift-shift*11,581+shift*11);ctx.rotate(-.55+shift*.48);const strip=ctx.createLinearGradient(-27,0,27,0);strip.addColorStop(0,'#ffffff00');strip.addColorStop(.13,'#ffffffd4');strip.addColorStop(.76,'#fffffffa');strip.addColorStop(1,'#ffffff00');ctx.fillStyle=strip;ctx.shadowColor='#fff';ctx.shadowBlur=5;rounded(-27,-2.8,54,5.6,2.8);ctx.fill();ctx.restore();
 ctx.save();ctx.filter='blur(2px)';let low=ctx.createLinearGradient(404,746,618,746);low.addColorStop(0,'#ffffff00');low.addColorStop(.35,'#ffffff20');low.addColorStop(.75,'#ffffff0c');low.addColorStop(1,'#ffffff00');ctx.strokeStyle=low;ctx.lineWidth=5;ctx.beginPath();ctx.ellipse(x,y+1,r-5,r-3,0,.55,2.45);ctx.stroke();ctx.restore();
 ctx.strokeStyle='#e7eff02b';ctx.lineWidth=1.3;ctx.beginPath();ctx.arc(x,y,r-1,.08,Math.PI*.94);ctx.stroke();ctx.restore();
 ctx.strokeStyle='#c4cdcd33';ctx.lineWidth=.85;ctx.beginPath();ctx.arc(x,y,r-.45,0,TAU);ctx.stroke();
 for(const p of[[424+drift,506,3],[599,525,1.3]]){const gl=ctx.createRadialGradient(p[0],p[1],0,p[0],p[1],p[2]*3);gl.addColorStop(0,'#c1c0ff8c');gl.addColorStop(.18,'#8f87ff44');gl.addColorStop(1,'#8f87ff00');ctx.fillStyle=gl;ctx.fillRect(p[0]-12,p[1]-12,24,24)}
}

function draw(t){
 t=clamp(t,0,DURATION);
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.filter='none';ctx.shadowBlur=0;ctx.shadowOffsetX=0;ctx.shadowOffsetY=0;ctx.clearRect(0,0,W,H);ctx.lineJoin='round';ctx.lineCap='round';

// Exactly one paused timeline; every frame is analytically recomputed on seek.
const timeline=gsap.timeline({paused:true});
