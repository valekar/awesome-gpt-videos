<!DOCTYPE html>
<html lang="en">
<head>

<title>Negroni — a 30 second recipe</title>
<style>

</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1080" data-duration="30">
<canvas id="art" class="clip" data-start="0" data-duration="30" width="1080" height="1080" aria-label="A silent illustrated Negroni recipe: ice, one ounce gin, one ounce Campari, one ounce sweet vermouth, stir, and orange peel."></canvas>
</div>
<script src="gsap.min.js"></script>
<script>
/*
Iteration 2: editable, procedural reconstruction; not rendered or visually validated.
Reference guidance: supplied 15-second still and supplied timed reconstruction.
Inferred timing: title 0–3; ice 3–6; gin 6–11; Campari 11–16;
vermouth 16–21; stir 21–25; peel 25–27.5; final hold 27.5–30.
Each liquid pour ends 3.5 seconds after its stage starts.
Asset ledger:
- Bangers.ttf: supplied, licensed local font; comic approximation, original unknown.
- Caveat.ttf: supplied, licensed local font; handwriting approximation, original unknown.
- gsap.min.js: local harness dependency.
- All paths, texture, bottles, glass, cubes and garnish: procedural Canvas artwork.
No reference frame is used as output artwork. No audio or network calls.
*/
(function(){
'use strict';
const canvas=document.getElementById('art');
const c=canvas.getContext('2d');
const P={paper:'#faf9f4',ink:'#282326',muted:'#686363',pink:'#ed7d89',red:'#b74055',palePink:'#f1c9ce',orange:'#efad42'};
const START=[3,6,11,16,21,25];
const END=[5.75,10.55,15.55,20.55,24.85,27.25];
const LABELS=['ICE','GIN','CAMPARI','VERMOUTH','STIR','PEEL'];
const RECIPES=[
 {big:'FILL',name:'ICE',note:'big cubes · rocks glass'},
 {big:'1 OZ',name:'GIN',note:'London dry · 30 ml'},
 {big:'1 OZ',name:'CAMPARI',note:'the bitter one · 30 ml'},
 {big:'1 OZ',name:'SWEET VERMOUTH',note:'sweet red · 30 ml'},
 {big:'20 SEC',name:'STIR',note:'until nice and cold'},
 {big:'1',name:'ORANGE PEEL',note:'express the oils, drop it in'}
];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const smooth=p=>{p=clamp(p);return p*p*(3-2*p)};
const phase=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=p=>1-Math.pow(1-clamp(p),3);
function mix(a,b,p){const A=a.match(/\w\w/g).map(x=>parseInt(x,16)),B=b.match(/\w\w/g).map(x=>parseInt(x,16));return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],p))).join(',')+')'}
function line(x1,y1,x2,y2,color=P.ink,width=2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.stroke()}
function ellipse(x,y,rx,ry,fill,stroke=P.ink,width=2){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}

function text(str,x,y,size=24,color=P.ink,weight=400,align='left',maxWidth,font='Caveat'){c.save();c.font=weight+' '+size+'px '+font;c.fillStyle=color;c.textAlign=align;c.textBaseline='alphabetic';if(maxWidth)c.fillText(str,x,y,maxWidth);else c.fillText(str,x,y);c.restore()}
function comic(str,x,y,size,width,alpha=1,reveal=1,center=false){
 c.save();c.globalAlpha*=alpha;c.font='400 '+size+'px Bangers';c.textBaseline='alphabetic';
 const total=c.measureText(str).width,sx=width/total;
 c.translate(x-(center?width/2:0),y);c.scale(sx,1);
 c.beginPath();c.rect(-8,-size*1.25,(total+20)*clamp(reveal),size*1.6);c.clip();
 let cursor=0;
 for(let i=0;i<str.length;i++){
  const ch=str[i],w=c.measureText(ch).width;
  c.save();c.translate(cursor+w/2,Math.sin(i*2.3)*1.3);c.rotate(Math.sin(i*3.7)*.018);
  c.textAlign='center';c.lineJoin='round';c.lineWidth=size*.064;c.strokeStyle=P.ink;c.strokeText(ch,.6,1.25);
  c.fillStyle=P.pink;c.fillText(ch,0,0);
  c.lineWidth=.8;c.strokeStyle='rgba(40,35,38,.65)';c.strokeText(ch,-.7,-.35);c.restore();cursor+=w;
 }

}
function heading(str,x,y,size,width){text(str,x,y,size,P.ink,400,'left',width,'Bangers')}
// Static, seeded paper texture. Never evolves with playback or seek order.
const paper=document.createElement('canvas');paper.width=1080;paper.height=1080;
const pc=paper.getContext('2d');pc.fillStyle=P.paper;pc.fillRect(0,0,1080,1080);
let seed=880547;
function seeded(){seed=(Math.imul(seed,1664525)+1013904223)>>>0;return seed/4294967296}
for(let i=0;i<14500;i++){
 const x=seeded()*1080,y=seeded()*1080,r=.22+seeded()*.62;
 pc.globalAlpha=.018+seeded()*.038;pc.fillStyle=i%4===0?'#cfae9e':'#9f9688';
 pc.beginPath();pc.ellipse(x,y,r,r*(.55+seeded()*.8),seeded()*Math.PI,0,Math.PI*2);pc.fill();
}
pc.globalAlpha=1;
function header(t){

 const y=lerp(506,153,settle),size=lerp(131,86,settle),width=lerp(654,380,settle);
 comic('NEGRONI',540,y,size,width,1,phase(t,.12,1.85),true);
 const a=smooth(phase(t,1.45,2.1))*(1-settle);
 if(a>0){c.save();c.globalAlpha=a;text('a 30 second recipe',540,y+49,30,'#817a76',400,'center');c.restore()}

}
const GLASS='M210 458 C217 553 224 687 234 782 Q351 815 472 782 C482 684 491 552 496 458 C419 478 286 479 210 458 Z';
const INTERIOR='M215 460 C222 555 230 687 239 777 Q352 807 468 777 C477 683 486 553 491 460 Z';
const volumeAt=t=>phase(t,7.05,9.5)+phase(t,12.05,14.5)+phase(t,17.05,19.5);
function liquidColor(t){const cam=phase(t,12.05,14.5),ver=phase(t,17.05,19.5);return ver>0?mix('dc5368','aa3046',ver):mix('d2eaf0','dc5368',cam)}

function spoon(t){
 if(t<21.05||t>=25)return;

 const dy=-470*(1-st.entry)-470*st.exit,topX=x+26+10*Math.sin(st.angle)*st.weight;
 c.save();c.translate(0,dy);
 line(topX+2,347,x+1,718,'rgba(255,255,255,.8)',7);
 line(topX,347,x,718,'#777b78',4);line(topX-2,350,x-2,709,'#c9ccc7',1.3);
 ellipse(topX,343,8,6,'#b9beb8','#535653',1.8);
 c.save();c.translate(x,719);c.rotate(-.1);ellipse(0,0,8,18,'#a9b2ad','#535653',1.5);c.restore();c.restore();
}
function cube(x,y,size,angle,alpha,tinted){
 c.save();c.globalAlpha*=alpha;c.translate(x,y);c.rotate(angle);
 const a=size/2;
 const path='M'+(-a+10)+' '+(-a+1)+' Q'+(-a+4)+' '+(-a-1)+' '+(-a+1)+' '+(-a+8)+' L'+(-a-2)+' '+(a-12)+' Q'+(-a-3)+' '+(a-2)+' '+(-a+8)+' '+a+' L'+(a-12)+' '+(a+2)+' Q'+(a-1)+' '+(a+1)+' '+a+' '+(a-10)+' L'+(a+2)+' '+(-a+12)+' Q'+(a+2)+' '+(-a-1)+' '+(a-10)+' '+(-a-2)+' Z';
 sketch(path,tinted?'rgba(239,157,169,.71)':'rgba(248,253,253,.48)',P.ink,2.25);
 sketch('M'+(-a+9)+' '+(-a+12)+' Q0 '+(-a+17)+' '+(a-11)+' '+(-a+9)+' L'+(a-12)+' '+(a-12),null,tinted?'rgba(141,69,83,.48)':'rgba(111,137,141,.52)',1.5);
 sketch('M'+(-a+8)+' '+(-a+13)+' L'+(-a+7)+' '+(a-11)+' Q0 '+(a-5)+' '+(a-12)+' '+(a-12),null,tinted?'rgba(255,226,225,.76)':'rgba(255,255,255,.9)',2.4);
 line(a-12,-a+13,a-13,a-14,tinted?'rgba(139,73,84,.42)':'rgba(123,149,152,.42)',1.2);
 c.restore();
}
function ice(t,volume,surface){
 const st=stirState(t),lift=Math.max(0,volume*68-88);
 const cubes=[{x:295,y:741,s:76,r:.30,a:3.4},{x:350,y:689,s:76,r:.58,a:4.08},{x:404,y:735,s:75,r:-.23,a:4.76}];
 cubes.forEach((b,i)=>{
  const p=phase(t,b.a,b.a+.57);if(p<=0)return;
  const fall=easeOut(p),bounce=p<.76?0:Math.sin((p-.76)/.24*Math.PI)*8;
  const movement=st.weight*st.entry*(1-st.exit);
  const x=b.x+Math.sin(st.angle+i*2.1)*10*movement;
  const y=lerp(253-i*29,b.y-lift,fall)-bounce+Math.cos(st.angle+i*2)*6*movement;
  const rotation=b.r+(1-fall)*.8+Math.sin(st.angle+i)*.08*movement;
  const alpha=smooth(phase(t,b.a,b.a+.1));
  cube(x,y,b.s,rotation,alpha,false);
  if(volume>1.001){
   c.save();c.beginPath();c.rect(180,surface,350,300);c.clip();
   cube(x,y,b.s,rotation,alpha*phase(volume,1,1.6),true);c.restore();
  }
 });
}
function glass(t){
 const volume=volumeAt(t),surface=758-volume*68;
 sketch(GLASS,'rgba(205,233,239,.63)',null);
 c.save();c.clip(new Path2D(INTERIOR));
 c.fillStyle='rgba(175,214,226,.30)';c.fillRect(205,752,300,55);
 if(volume>.001){
  const color=liquidColor(t);c.save();c.globalAlpha=.88;c.fillStyle=color;c.fillRect(205,surface,300,175);ellipse(353,surface,143,17,color,null);c.restore();
  ellipse(353,surface,143,17,'rgba(255,255,255,.07)','rgba(96,38,52,.72)',1.7);
  sketch('M229 '+surface+' L239 748 Q352 770 465 748 L478 '+surface,null,'rgba(101,39,54,.75)',1.6);
 }
 const stir=stirState(t);
 if(t>21.5&&t<24.7){c.save();c.globalAlpha=stir.weight*.55;for(let k=0;k<3;k++)ellipse(353,surface+4+k*4,58+k*30,6+k*3,null,'#f4bac0',1.3);c.restore()}
 spoon(t);ice(t,volume,surface);c.restore();
 if(t<5.4){c.save();c.beginPath();c.rect(150,150,430,308);c.clip();ice(t,volume,surface);c.restore()}
 if(t>=21.05&&t<25){c.save();c.beginPath();c.rect(200,-200,330,658);c.clip();spoon(t);c.restore()}
 sketch('M210 458 C217 553 224 687 234 782 Q351 815 472 782 C482 684 491 552 496 458',null,P.ink,2.5);
 ellipse(353,458,143,22,'rgba(232,247,248,.18)',P.ink,2.25);
 c.save();c.globalAlpha=.25;ellipse(353.8,458.6,143,22,null,P.ink,.9);c.restore();
 sketch('M235 510 C241 562 246 627 253 691',null,'rgba(255,255,255,.83)',5);
 sketch('M252 526 C259 551 266 580 271 602',null,'rgba(255,255,255,.52)',2.8);
 sketch('M239 782 Q353 804 471 781',null,'#63838c',1.4);
 for(let n=1;n<=3;n++){
  const a=smooth(phase(volume,n-.09,n));if(a<=0)continue;
  const y=758-n*68;c.save();c.globalAlpha=a;
  line(492,y,519,y-1,P.red,2.8);text(n+' oz',526,y+7,29,P.red,400);c.restore();
 }
}
function bottleShape(type){
 const p=[{body:'#d9eef0',edge:'#354c52',label:'#fbfaf4',name:'GIN',small:'LONDON DRY'},{body:'#ce1737',edge:P.ink,label:'#fff8e8',name:'CAMPARI',small:'bitter'},{body:'#642d37',edge:P.ink,label:'#f1e1be',name:'SWEET',small:'VERMOUTH'}][type];
 sketch('M-12 -125 L12 -125 L12 -67 Q12 -58 24 -49 Q36 -43 36 -26 L34 105 Q0 112 -34 105 L-36 -26 Q-36 -43 -24 -49 Q-12 -58 -12 -67 Z',p.body,p.edge,2.2);
 sketch('M-13 -126 Q0 -131 13 -126 L13 -119 Q0 -116 -13 -120 Z',p.body,p.edge,1.7);
 sketch('M-25 -20 L25 -20 L25 64 L-25 64 Z',p.label,p.edge,1.5);
 text(p.name,0,14,type===2?17:19,p.edge,400,'center',45,'Bangers');
 if(p.small)text(p.small,0,34,type===2?13:15,p.edge,400,'center',45,type===0?'sans-serif':'Caveat');
 line(-24,-35,-23,86,'rgba(255,255,255,.58)',3);line(-6,-111,-6,-65,'rgba(255,255,255,.7)',2);
 line(-23,78,23,78,'rgba(255,255,255,.25)',1);
}
function bottle(t,start,type){
 const local=t-start;if(local<0||local>=4.9)return;

 if(local<.7){const p=easeOut(local/.7);x=lerp(1125,174,p);y=lerp(235,335,p);angle=0;alpha=smooth(local/.16)}
 else if(local<1.05){const p=smooth((local-.7)/.35);x=174;y=335;angle=1.48*p}
 else if(local<3.5){x=174;y=335;angle=1.48}
 else if(local<3.8){const p=smooth((local-3.5)/.3);x=174;y=lerp(335,325,p);angle=1.48}
 else if(local<4.7){const p=smooth((local-3.8)/.9);x=lerp(174,-205,p);y=325;angle=1.48}
 else{const p=smooth((local-4.7)/.2);x=-205;y=325;angle=1.48*(1-p);alpha=1-p}

  const mouth={x:x+143.75*Math.sin(angle),y:y-143.75*Math.cos(angle)};
  const impactX=342+2*Math.sin(t*9),impactY=758-volumeAt(t)*68+8;

  sketch(path,null,type===0?'#759ba1':type===1?'#a52640':'#642737',7);
  sketch(path,null,type===0?'#d7f1f4':type===1?'#e65e73':'#a64a58',4.4);
  ellipse(impactX,impactY,13+3*Math.sin(t*11),3,null,type===0?'#8eb7bd':'#edb3bd',1.6);

function peel(t){
 if(t<25.15)return;
 const entry=easeOut(phase(t,25.15,25.75)),drop=smooth(phase(t,26.15,26.9));
 const y=lerp(329,449,drop),x=lerp(265,321,entry),expression=Math.sin(Math.PI*phase(t,25.65,26.4));

 if(expression>0){c.save();c.globalAlpha*=expression;for(let j=0;j<5;j++){const px=343+j*20;line(px,432+(j%2)*5,px+(j-2)*3,449+(j%2)*5,'#e9b450',1.9)}c.restore()}
 c.translate(x,y);c.rotate(lerp(-.2,.025,drop));c.beginPath();
 for(let i=0;i<=150;i++){const u=i/150,px=132*u+15*Math.sin(u*Math.PI*6),py=-17*Math.cos(u*Math.PI*6);if(i===0)c.moveTo(px,py);else c.lineTo(px,py)}
 c.lineCap='round';c.lineJoin='round';c.strokeStyle='#795331';c.lineWidth=10;c.stroke();c.strokeStyle=P.orange;c.lineWidth=7;c.stroke();
 c.save();c.translate(-.5,-1);c.globalAlpha*=.7;c.strokeStyle='#ffe3a0';c.lineWidth=1.5;c.stroke();c.restore();c.restore();
}
function stageIndex(t){if(t>=27.5)return 6;let n=0;for(let i=0;i<START.length;i++)if(t>=START[i])n=i;return n}

function progress(t){

 });

 c.save();c.globalAlpha=enter*fade;
 [[188,566,170,558],[190,626,169,631],[201,691,184,702],[516,548,533,536],[526,616,547,613],[516,681,533,693],[298,414,294,394],[470,408,478,391]].forEach((m,i)=>line(m[0],m[1],lerp(m[0],m[2],enter),lerp(m[1],m[3],enter),i%3===0?'#e9b850':P.pink,3));

function draw(time){
