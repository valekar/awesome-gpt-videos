 if(raw.every(p=>p.z<.16))continue;
 const points=clipNear(raw);if(points.length<3)continue;
 let minX=Infinity,minY=Infinity,maxX=-Infinity,maxY=-Infinity,depth=0;
 const screen=points.map(p=>{const x=W*.5+p.x*focal/p.z,y=H*.49-p.y*focal/p.z;minX=Math.min(minX,x);maxX=Math.max(maxX,x);minY=Math.min(minY,y);maxY=Math.max(maxY,y);depth+=p.z;return {x,y}});
 if(maxX<0||minX>W||maxY<0||minY>H)continue;
 queue.push({p:screen,z:depth/points.length,c:face.c,o:face.outline});
 }
 queue.sort((a,b)=>b.z-a.z);
 ctx.lineJoin='round';
 for(const item of queue){
 ctx.beginPath();ctx.moveTo(item.p[0].x,item.p[0].y);for(let i=1;i<item.p.length;i++)ctx.lineTo(item.p[i].x,item.p[i].y);ctx.closePath();ctx.fillStyle=item.c;ctx.fill();
 if(item.o&&item.z<100){ctx.strokeStyle=item.o;ctx.lineWidth=clamp(22/item.z,.35,1.7);ctx.stroke()}
 }
 // A gentle lens vignette is painted anew every frame.
 const vignette=ctx.createRadialGradient(W*.5,H*.46,H*.23,W*.5,H*.5,W*.67);vignette.addColorStop(0,'#102e2e00');vignette.addColorStop(1,'#102e2e4a');ctx.fillStyle=vignette;ctx.fillRect(0,0,W,H);
 intro.style.opacity=navigation?'0':String(1-smooth((t-3.8)/2.2));
}
function beginNavigation(){if(!navigation)navigation={...tourCamera(time.t)};intro.style.opacity='0';return navigation}
function markFloor(n){document.querySelectorAll('[data-floor]').forEach(el=>el.setAttribute('aria-pressed',Number(el.dataset.floor)===n?'true':'false'))}
function visitFloor(n){
 const h=SETTINGS.baseHalfWidth-n*SETTINGS.taper,y=.6+n*SETTINGS.floorHeight;
 navigation=look(V(2.5,y+1.85,h*.68),V(0,y+2,-.7));markFloor(n);render(time.t);
}
function move(key,fast=false){
 const c=beginNavigation(),step=fast?1.15:.54,s=Math.sin(c.yaw),co=Math.cos(c.yaw);let dx=0,dz=0,dy=0;
 if(key==='w'||key==='arrowup'){dx=s*step;dz=co*step}
 if(key==='s'||key==='arrowdown'){dx=-s*step;dz=-co*step}
 if(key==='d'){dx=co*step;dz=-s*step}
 if(key==='a'){dx=-co*step;dz=s*step}
 if(key==='q')dy=-step;if(key==='e')dy=step;
 if(key==='arrowleft')c.yaw-=.085;if(key==='arrowright')c.yaw+=.085;
 let nx=c.x+dx,nz=c.z+dz;
 // Keep the viewer outside structural columns; the camera can rise freely.
 for(const p of columns)if(c.y>p.bottom&&c.y<p.top+.4){let x=nx-p.x,z=nz-p.z,d=Math.hypot(x,z),r=p.r+.25;if(d<r){if(d<.001){x=1;z=0;d=1}nx=p.x+x/d*r;nz=p.z+z/d*r}}
 c.x=clamp(nx,-65,65);c.z=clamp(nz,-65,65);c.y=clamp(c.y+dy,.95,34);markFloor(-1);render(time.t);
}
canvas.addEventListener('keydown',e=>{
 const k=e.key.toLowerCase();
 if('12345'.includes(k)&&k.length===1){e.preventDefault();visitFloor(Number(k)-1);return}
 if(['w','a','s','d','q','e','arrowup','arrowdown','arrowleft','arrowright'].includes(k)){e.preventDefault();move(k,e.shiftKey)}
 if(k==='r'){navigation=null;markFloor(-1);render(time.t)}
});
let drag=null;
canvas.addEventListener('pointerdown',e=>{canvas.focus({preventScroll:true});const c=beginNavigation();drag={id:e.pointerId,x:e.clientX,y:e.clientY,yaw:c.yaw,pitch:c.pitch};canvas.setPointerCapture(e.pointerId);render(time.t)});
canvas.addEventListener('pointermove',e=>{if(!drag||drag.id!==e.pointerId)return;const rect=canvas.getBoundingClientRect();navigation.yaw=drag.yaw-(e.clientX-drag.x)/rect.width*3.3;navigation.pitch=clamp(drag.pitch+(e.clientY-drag.y)/rect.height*2.2,-1.24,1.24);render(time.t)});
function endDrag(e){if(drag&&drag.id===e.pointerId)drag=null}
canvas.addEventListener('pointerup',endDrag);canvas.addEventListener('pointercancel',endDrag);canvas.addEventListener('lostpointercapture',()=>{drag=null});
document.querySelectorAll('[data-floor]').forEach(button=>button.addEventListener('click',()=>{visitFloor(Number(button.dataset.floor));canvas.focus({preventScroll:true})}));
document.querySelectorAll('[data-move]').forEach(button=>button.addEventListener('click',()=>{move(button.dataset.move);canvas.focus({preventScroll:true})}));
document.getElementById('tour').addEventListener('click',()=>{navigation=null;markFloor(-1);render(time.t);canvas.focus({preventScroll:true})});
// One paused, seek-safe timeline owns the entire guided camera animation.
const timeline=gsap.timeline({paused:true});
timeline.to(time,{t:SETTINGS.duration,duration:SETTINGS.duration,ease:'none',onUpdate:()=>render(time.t)},0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
render(0);
})();
</script>
