<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Pure Feeling</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#15111c}#root{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="20">
<canvas id="art" class="clip" data-start="0" data-duration="20" width="1920" height="1080" aria-label="A psychedelic motion design showreel of kinetic typography, optical tunnels, sculptural ribbons and kaleidoscopic flowers."></canvas>
</div>
<script src="gsap.min.js"></script>
<script>
/* EDITABLE ART DIRECTION
   Five four-second movements; circular wipes connect their geometry.
   All artwork is procedural. Change these colors, words or scene functions.
   Every frame is a pure function of timeline time, including reverse seeks. */
const canvas=document.getElementById('art');
const ctx=canvas.getContext('2d');
const W=1920,H=1080,CX=960,CY=540,TAU=Math.PI*2;
const P={ink:'#15111c',pink:'#ff57ae',lime:'#d9ff43',blue:'#333cff',violet:'#8240ed',cream:'#fff4df',orange:'#ff753e'};
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,p)=>a+(b-a)*p;
const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
const out=v=>1-Math.pow(1-clamp(v),4);
const mod=(a,b)=>((a%b)+b)%b;
function background(color){ctx.fillStyle=color;ctx.fillRect(0,0,W,H)}
function circle(x,y,r,color){if(r<=0)return;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=color;ctx.fill()}
function star(x,y,r,points,rotation,color,inner=.33){
 ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.beginPath();
 for(let i=0;i<points*2;i++){const a=i*Math.PI/points;const d=i%2?r*inner:r;const px=Math.cos(a)*d,py=Math.sin(a)*d;i?ctx.lineTo(px,py):ctx.moveTo(px,py)}
 ctx.closePath();ctx.fillStyle=color;ctx.fill();ctx.restore();
}
function text(word,x,y,size,fill,stroke=null,width=0,maxWidth=1680){
 ctx.save();ctx.textAlign='center';ctx.textBaseline='middle';ctx.font=`900 ${size}px sans-serif`;
 const measured=ctx.measureText(word).width;
 if(measured>maxWidth)ctx.font=`900 ${size*maxWidth/measured}px sans-serif`;
 ctx.lineJoin='round';if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.strokeText(word,x,y)}ctx.fillStyle=fill;ctx.fillText(word,x,y);ctx.restore();
}
function scallopPath(radius,phase,waves=12,amount=.07){
 ctx.beginPath();for(let i=0;i<=192;i++){const a=i/192*TAU;const r=radius*(1+amount*Math.sin(waves*a+phase));const x=Math.cos(a)*r,y=Math.sin(a)*r;i?ctx.lineTo(x,y):ctx.moveTo(x,y)}ctx.closePath();
}
function halftone(t,color){
 ctx.save();ctx.fillStyle=color;
 for(let row=0;row<12;row++)for(let col=0;col<7;col++){
  const x=90+col*27,y=90+row*27;const r=2+1.5*Math.sin(row*.5+col*.6+t);
  ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill();ctx.beginPath();ctx.arc(W-x,H-y,r,0,TAU);ctx.fill();
 }ctx.restore();
}

/* 00–04: poster typography and a breathing, scalloped aperture. */
function ignition(t){
 background(P.pink);
 ctx.save();ctx.translate(CX+65*Math.sin(t*.85),CY);ctx.rotate(t*.11);
 for(let i=17;i>=0;i--){
  const radius=70+i*70+22*Math.sin(t*2.5-i*.4);
  scallopPath(radius,t*2.1-i*.23,10,.055);
  ctx.fillStyle=[P.pink,P.orange,P.pink,P.lime][i%4];ctx.fill();
 }
 ctx.restore();
 // Black circular outlines hold the poster together as its surface breathes.
 ctx.save();ctx.translate(CX,CY);ctx.rotate(-t*.13);ctx.strokeStyle=P.ink;ctx.lineWidth=4;
 for(let i=0;i<4;i++){ctx.beginPath();ctx.ellipse(0,0,540+i*75,335+i*65,t*.15+i*.4,0,TAU);ctx.stroke()}ctx.restore();
 const words=['MAKE','IT','MOVE'];
 words.forEach((word,i)=>{
  const enter=out((t-i*.16)/.65);
  const y=[266,534,806][i]+(1-enter)*125;
  const drift=Math.sin(t*2.1+i*1.7)*(i===1?30:17);
  ctx.save();ctx.translate(CX+drift,y);ctx.rotate(Math.sin(t*1.1+i)*.025);
  ctx.scale(.91+.09*enter,.78+.22*enter);ctx.globalAlpha=enter;
  text(word,10,12,i===1?260:282,P.cream);
  text(word,0,0,i===1?260:282,P.ink);ctx.restore();
 });
 star(255,238,102,12,t*.75,P.ink,.35);
 star(1660,824,122,12,-t*.65,P.blue,.36);
 circle(1648,252,47,P.cream);circle(1648,252,23,P.ink);
 halftone(t,'rgba(21,17,28,.32)');
}

/* 04–08: a continuous plunge through an optical tunnel. */
function tunnel(t){
 background(P.ink);
 const cx=CX+115*Math.sin(t*.9),cy=CY+85*Math.sin(t*1.16);
 ctx.save();ctx.translate(cx,cy);ctx.rotate(t*.24);ctx.scale(1.15,.92);
 const travel=mod(t*.83,1);
 for(let i=27;i>=0;i--){
  const r=19*Math.exp((i+travel)/4.35);
  const phase=t*2.5-i*.17;
  ctx.beginPath();
  for(let j=0;j<=180;j++){
   const a=j/180*TAU;const d=r*(1+.085*Math.sin(a*8+phase)+.035*Math.cos(a*3-phase));
   const x=Math.cos(a)*d,y=Math.sin(a)*d;j?ctx.lineTo(x,y):ctx.moveTo(x,y);
  }
  for(let j=180;j>=0;j--){
   const a=j/180*TAU;const d=r*.835*(1+.085*Math.sin(a*8+phase)+.035*Math.cos(a*3-phase));ctx.lineTo(Math.cos(a)*d,Math.sin(a)*d);
  }
  ctx.closePath();ctx.fillStyle=[P.lime,P.violet,P.cream,P.pink][i%4];ctx.fill('evenodd');
  // Stitched radial accents expose the tunnel's changing twist.
  if(i%2===0){ctx.strokeStyle=P.ink;ctx.lineWidth=Math.max(1,r*.007);
   for(let j=0;j<16;j++){const a=j/16*TAU+.06*Math.sin(t+i*.2);ctx.beginPath();ctx.moveTo(Math.cos(a)*r*.84,Math.sin(a)*r*.84);ctx.lineTo(Math.cos(a)*r,Math.sin(a)*r);ctx.stroke()}
  }
 }
 star(0,0,37+5*Math.sin(t*4),8,-t*1.4,P.cream,.25);ctx.restore();
}

/* 08–12: a striped torus, projected and depth sorted in Canvas 2D. */
function rotate3(x,y,z,ax,ay,az){
 let a=y*Math.cos(ax)-z*Math.sin(ax),b=y*Math.sin(ax)+z*Math.cos(ax);y=a;z=b;
 a=x*Math.cos(ay)+z*Math.sin(ay);b=-x*Math.sin(ay)+z*Math.cos(ay);x=a;z=b;
 a=x*Math.cos(az)-y*Math.sin(az);b=x*Math.sin(az)+y*Math.cos(az);return[a,b,z];
}
function shade(hex,light){
 const n=parseInt(hex.slice(1),16);return `rgb(${Math.round((n>>16)*light)},${Math.round(((n>>8)&255)*light)},${Math.round((n&255)*light)})`;
}
function sculpture(t){
 background(P.cream);
 ctx.save();ctx.translate(CX,CY);ctx.rotate(-.28+t*.09);ctx.strokeStyle=P.ink;ctx.lineWidth=2;
 for(let i=0;i<3;i++){ctx.beginPath();ctx.ellipse(0,0,680+i*38,238+i*54,i*.32,0,TAU);ctx.stroke()}ctx.restore();
 ctx.save();ctx.globalAlpha=.12;ctx.fillStyle=P.ink;ctx.beginPath();ctx.ellipse(CX,922,360+30*Math.sin(t),45,0,0,TAU);ctx.fill();ctx.restore();
 const orbit=t*.8;
 circle(CX+Math.cos(orbit)*690,CY+Math.sin(orbit)*278,38,P.blue);
 circle(CX+Math.cos(orbit+Math.PI)*650,CY+Math.sin(orbit+Math.PI)*310,54,P.pink);
 star(270,815,80,8,t*.4,P.ink,.27);
 const nu=80,nv=24,vertices=[],faces=[];
 const ax=.65+Math.sin(t*.7)*.35,ay=t*.55-.55,az=-.3+t*.22;
 for(let i=0;i<=nu;i++){
  const u=i/nu*TAU;const row=[];
  for(let j=0;j<=nv;j++){
   const v=j/nv*TAU;
   const major=282+20*Math.cos(u*3-t*1.5);
   const minor=110+16*Math.sin(u*2+t*1.4);
   const twist=v+u*.7+t*.4;
   let x=(major+minor*Math.cos(twist))*Math.cos(u);
   let y=(major+minor*Math.cos(twist))*Math.sin(u);
   let z=minor*Math.sin(twist)+55*Math.sin(u*3+t);
   [x,y,z]=rotate3(x,y,z,ax,ay,az);
   const perspective=1450/(1450+z),scale=1.25+.045*Math.sin(t*2);
   row.push({x:CX+x*perspective*scale,y:CY-12+y*perspective*scale,z});
  }vertices.push(row);
 }
 const bands=[P.ink,P.lime,P.lime,P.pink,P.pink,P.cream,P.blue,P.blue,P.orange,P.orange,P.cream,P.ink];
 for(let i=0;i<nu;i++)for(let j=0;j<nv;j++){
  const a=vertices[i][j],b=vertices[i+1][j],c=vertices[i+1][j+1],d=vertices[i][j+1];
  const light=.67+.33*(.5+.5*Math.cos(j/nv*TAU+i/nu*TAU*.7+t*.4-.7));
  faces.push({p:[a,b,c,d],z:(a.z+b.z+c.z+d.z)/4,color:shade(bands[j%bands.length],light)});
 }
 faces.sort((a,b)=>b.z-a.z);
 for(const face of faces){ctx.beginPath();face.p.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=face.color;ctx.strokeStyle=face.color;ctx.lineWidth=.7;ctx.fill();ctx.stroke()}
 // A spare foreground orbit gives the sculpture another depth plane.
 ctx.save();ctx.translate(CX,CY);ctx.rotate(.28);ctx.strokeStyle=P.ink;ctx.lineWidth=3;ctx.beginPath();ctx.ellipse(0,0,710,355,0,.1,Math.PI*.93);ctx.stroke();ctx.restore();
}

/* 12–16: a warped checkerboard and oversized, elastic letterforms. */
function checkerPoint(x,y,t){
 const dx=x-CX,dy=y-CY,r=Math.hypot(dx,dy);
 const wave=1+.105*Math.sin(r*.009-t*2.6);
 return{x:CX+dx*wave+47*Math.sin(dy*.009+t*1.8),y:CY+dy*wave+40*Math.cos(dx*.008-t*2)};
}
function opArt(t){
 background(P.violet);ctx.save();ctx.translate(CX,CY);ctx.rotate(.055*Math.sin(t*.9));ctx.translate(-CX,-CY);
 const step=142;
 for(let row=-3;row<12;row++)for(let col=-3;col<18;col++){
  const x=col*step-70,y=row*step-70;
  const points=[checkerPoint(x,y,t),checkerPoint(x+step,y,t),checkerPoint(x+step,y+step,t),checkerPoint(x,y+step,t)];
  ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p.x,p.y):ctx.moveTo(p.x,p.y));ctx.closePath();ctx.fillStyle=(row+col)%2===0?P.cream:P.violet;ctx.fill();ctx.strokeStyle=ctx.fillStyle;ctx.lineWidth=1;ctx.stroke();
 }ctx.restore();
 const enter=out(t/.7);
 ctx.save();ctx.translate(CX,CY);ctx.rotate(-.055+Math.sin(t*1.2)*.025);
 const breathing=1+.025*Math.sin(t*3);ctx.scale(breathing,breathing);
 ctx.globalAlpha=enter;
 text('LOSE',-24*Math.sin(t*1.7),-151-(1-enter)*140,350,P.lime,P.ink,23,1520);
 text('CONTROL',24*Math.sin(t*1.7),168+(1-enter)*140,258,P.lime,P.ink,23,1630);
 ctx.restore();
 star(240,190,87,10,t*.8,P.ink,.25);
 star(1690,885,108,10,-t*.8,P.orange,.25);
 circle(1680,195,52,P.ink);circle(1680,195,25,P.lime);
}

/* 16–20: a kaleidoscopic bloom opens into the final typographic lockup. */
function bloom(t){
 background(P.ink);
 ctx.save();ctx.translate(CX,CY);ctx.rotate(t*.16);
 for(let layer=5;layer>=0;layer--){
  const count=16,reach=220+layer*102+36*Math.sin(t*2-layer*.55);
  for(let i=0;i<count;i++){
   const a=i/count*TAU+(layer%2?.10:-.10)+Math.sin(t*1.4+layer)*.07;
   ctx.save();ctx.rotate(a);ctx.beginPath();
   ctx.moveTo(52,0);
   ctx.bezierCurveTo(reach*.32,-95-layer*9,reach*.92,-178-layer*14,reach,0);
   ctx.bezierCurveTo(reach*.89,145+layer*13,reach*.27,77+layer*9,52,0);
   ctx.fillStyle=[P.pink,P.blue,P.lime,P.orange,P.violet,P.cream][mod(i+layer,6)];ctx.fill();
   ctx.strokeStyle=P.ink;ctx.lineWidth=4;ctx.stroke();
   ctx.beginPath();ctx.moveTo(82,0);ctx.bezierCurveTo(reach*.45,-34,reach*.75,28,reach*.9,0);ctx.strokeStyle='rgba(21,17,28,.55)';ctx.lineWidth=3;ctx.stroke();ctx.restore();
  }
 }
 for(let i=4;i>=0;i--){circle(0,0,58+i*28+6*Math.sin(t*3+i),i%2?P.ink:P.lime)}
 star(0,0,44,8,-t*1.5,P.ink,.25);ctx.restore();
 const opening=smooth((t-1.65)/1.05);
 if(opening>0){
  const r=opening*1250;
  ctx.save();ctx.beginPath();ctx.arc(CX,CY,r,0,TAU);ctx.clip();background(P.lime);
  // The same flower geometry survives as a few bold edge arcs.
  ctx.save();ctx.translate(CX,CY);ctx.rotate(t*.12);
  for(let i=0;i<8;i++){ctx.save();ctx.rotate(i/8*TAU);ctx.beginPath();ctx.ellipse(1040+22*Math.sin(t*2+i),0,250,420,0,0,TAU);ctx.fillStyle=i%2?P.blue:P.pink;ctx.fill();ctx.restore()}ctx.restore();
  const reveal=out((t-2.12)/.62);
  ctx.save();ctx.translate(CX,CY);ctx.scale(.82+.18*reveal,.82+.18*reveal);ctx.globalAlpha=reveal;
  text('FEEL',0,-147+(1-reveal)*65,325,P.ink,null,0,1500);
  text('EVERYTHING',0,150+(1-reveal)*85,203,P.ink,null,0,1650);
  ctx.restore();
  star(255,200,70,8,t*.65,P.ink,.24);star(1670,870,82,8,-t*.65,P.ink,.24);
  ctx.restore();
 }
}

const scenes=[ignition,tunnel,sculpture,opArt,bloom];
function draw(time){
 const t=clamp(time,0,20),index=Math.min(4,Math.floor(t/4)),local=t-index*4;
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);
 const transition=.55;
 if(index>0&&local<transition){
  scenes[index-1](4+local);
  const p=smooth(local/transition);
  const x=[0,1090,790,1080,890][index],y=[0,480,590,500,550][index];
  const maxRadius=Math.hypot(Math.max(x,W-x),Math.max(y,H-y))+50;
  const radius=p*maxRadius;
  ctx.save();ctx.beginPath();ctx.arc(x,y,radius,0,TAU);ctx.clip();scenes[index](local);ctx.restore();
  if(radius>0&&p<.99){ctx.beginPath();ctx.arc(x,y,radius,0,TAU);ctx.strokeStyle=index%2?P.lime:P.cream;ctx.lineWidth=14*(1-p)+2;ctx.stroke()}
 }else{scenes[index](local)}
}
const playhead={t:0};
const timeline=gsap.timeline({paused:true});
timeline.to(playhead,{t:20,duration:20,ease:'none',onUpdate:()=>draw(playhead.t)},0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
draw(0);
</script>
</body>
</html>
