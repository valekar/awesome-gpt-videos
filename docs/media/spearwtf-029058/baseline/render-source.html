<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>CHAIN — 30-second pitch</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#101210}#root{position:relative;width:100%;height:100%;overflow:hidden;background:#101210;color:#f1eee6;font-family:Arial,Helvetica,sans-serif}.clip{position:absolute;inset:0;width:100%;height:100%}svg{display:block;width:100%;height:100%}.scene{opacity:0}.heavy{font-family:Arial,Helvetica,sans-serif;font-weight:900;letter-spacing:-8px}.label{font-family:Arial,Helvetica,sans-serif;font-size:32px;font-weight:700;letter-spacing:5px}.body{font-family:Arial,Helvetica,sans-serif;font-size:45px;font-weight:400;letter-spacing:-1px}.lime{fill:#c4fc58}.paper{fill:#f1eee6}.ink{fill:#101210}.line{fill:none;stroke:#f1eee6;stroke-width:3}.link{fill:none;stroke:#c4fc58;stroke-width:52}.thin{fill:none;stroke:#c4fc58;stroke-width:3}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="30">
<div class="clip" data-start="0" data-duration="30">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="A pitch for Chain, an on-chain entertainment platform">
<defs>
<pattern id="grid" width="100" height="100" patternUnits="userSpaceOnUse"><path d="M100 0H0V100" fill="none" stroke="#f1eee6" stroke-opacity=".065"/></pattern>
<clipPath id="stage"><rect width="1920" height="1080"/></clipPath>
</defs>
<g clip-path="url(#stage)">
<rect width="1920" height="1080" fill="#101210"/>
<g id="ambient"><rect x="-200" y="-200" width="2400" height="1500" fill="url(#grid)"/></g>
<g id="intro" class="scene">
<g id="introLinks" opacity=".35" transform="translate(1320 510) rotate(-35)"><rect x="-325" y="-300" width="370" height="600" rx="185" class="link"/><rect x="-20" y="-100" width="370" height="600" rx="185" class="link"/></g>
<text id="introA" x="130" y="350" font-size="170" class="heavy paper">EVERY</text>
<text id="introB" x="130" y="525" font-size="170" class="heavy paper">OUTCOME.</text>
<text id="introC" x="130" y="700" font-size="170" class="heavy lime">ON-CHAIN.</text>
<path id="introRule" d="M140 810H1760" stroke="#c4fc58" stroke-width="6"/>
</g>
<g id="brand" class="scene">
<rect id="brandPanel" x="0" y="0" width="1920" height="1080" fill="#c4fc58"/>
<g id="brandMark" transform="translate(960 270) rotate(-35)"><rect x="-115" y="-115" width="140" height="230" rx="70" fill="none" stroke="#101210" stroke-width="28"/><rect x="-5" y="-35" width="140" height="230" rx="70" fill="none" stroke="#101210" stroke-width="28"/></g>
<text id="brandName" x="960" y="700" text-anchor="middle" font-size="350" class="heavy ink">CHAIN</text>
<text id="brandDesc" x="960" y="840" text-anchor="middle" font-size="53" font-weight="700" letter-spacing="3" class="ink">ON-CHAIN ENTERTAINMENT</text>
</g>
<g id="proof" class="scene">
<text x="135" y="190" class="label lime">PROVABLY FAIR</text>
<text id="proofA" x="125" y="410" font-size="151" class="heavy paper">DON’T GUESS.</text>
<text id="proofB" x="125" y="575" font-size="151" class="heavy lime">VERIFY.</text>
<text id="proofCopy" x="140" y="730" class="body paper"><tspan x="140">Every outcome verifiable</tspan><tspan x="140" dy="62">on-chain.</tspan></text>
<g id="proofSeal" transform="translate(1500 770)"><circle r="156" class="thin"/><circle r="125" fill="#c4fc58"/><path id="check" d="M-63 0L-15 49L70-53" fill="none" stroke="#101210" stroke-width="20" stroke-linecap="square" stroke-linejoin="miter"/></g>
<path id="proofRail" d="M142 920H1760" stroke="#f1eee6" stroke-opacity=".2" stroke-width="2"/>
</g>
<g id="transparency" class="scene">
<text x="135" y="180" class="label lime">FULLY TRANSPARENT</text>
<text id="transA" x="125" y="380" font-size="146" class="heavy paper">WAGERS.</text>
<text id="transB" x="125" y="535" font-size="146" class="heavy paper">PAYOUTS.</text>
<text id="transC" x="125" y="690" font-size="146" class="heavy lime">PUBLIC.</text>
<text id="transCopy" x="140" y="865" class="body paper">Recorded on the blockchain.</text>
<g id="blocks" transform="translate(1240 320)">
<path id="blockLine" d="M160 0V560" stroke="#c4fc58" stroke-width="5"/>
<g id="block1"><rect x="0" y="0" width="320" height="155" rx="20" fill="#1c2119" stroke="#c4fc58" stroke-width="3"/><path d="M55 55H215M55 95H265" stroke="#c4fc58" stroke-width="12"/></g>
<g id="block2"><rect x="45" y="205" width="320" height="155" rx="20" fill="#1c2119" stroke="#c4fc58" stroke-width="3"/><path d="M100 260H260M100 300H310" stroke="#c4fc58" stroke-width="12"/></g>
<g id="block3"><rect x="0" y="410" width="320" height="155" rx="20" fill="#1c2119" stroke="#c4fc58" stroke-width="3"/><path d="M55 465H215M55 505H265" stroke="#c4fc58" stroke-width="12"/></g>
</g>
</g>
<g id="wallet" class="scene">
<text x="135" y="180" class="label lime">SELF-CUSTODY PLAY</text>
<text id="walletA" x="125" y="390" font-size="157" class="heavy paper">YOUR WALLET.</text>
<text id="walletB" x="125" y="555" font-size="157" class="heavy lime">YOUR CONTROL.</text>
<text id="walletCopy" x="140" y="735" class="body paper">Play straight from your wallet.</text>
<g id="walletArt" transform="translate(1340 735)"><rect x="-60" y="-100" width="410" height="240" rx="35" fill="#c4fc58"/><path d="M-60-42H350" stroke="#101210" stroke-width="5"/><rect x="210" y="-15" width="160" height="100" rx="20" fill="#101210" stroke="#c4fc58" stroke-width="5"/><circle cx="255" cy="35" r="12" fill="#c4fc58"/></g>
</g>
<g id="ending" class="scene">
<rect id="endPanel" width="1920" height="1080" fill="#c4fc58"/>
<text id="endTop" x="960" y="235" text-anchor="middle" class="label ink">EXPLORE THE DEVNET</text>
<text id="endName" x="960" y="570" text-anchor="middle" font-size="330" class="heavy ink">CHAIN</text>
<g id="endAddress"><rect x="540" y="650" width="840" height="145" rx="73" fill="#101210"/><text x="960" y="747" text-anchor="middle" font-size="76" font-weight="700" letter-spacing="-3" class="lime">chain.wtf ↗</text></g>
<text id="endHandle" x="960" y="910" text-anchor="middle" font-size="39" font-weight="700" class="ink">@chaindotwtf</text>
</g>
</g>
</svg>
</div>
</div>
<script src="gsap.min.js"></script>
<script>
(function(){
'use strict';
const tl=gsap.timeline({paused:true});
const reveal=(selector,start,duration=0.6,offset=90)=>tl.fromTo(selector,{opacity:0,y:offset},{opacity:1,y:0,duration:duration,ease:'power3.out',immediateRender:false},start);
const scene=(selector,start,end)=>{tl.set(selector,{opacity:1},start);if(end<30)tl.set(selector,{opacity:0},end);};
tl.to('#ambient',{x:100,y:65,duration:30,ease:'none'},0);
scene('#intro',0,4.5);
reveal('#introA',0.05,0.7,130);reveal('#introB',0.3,0.7,130);reveal('#introC',0.7,0.75,130);
tl.fromTo('#introLinks',{rotation:-18,scale:0.75,opacity:0},{rotation:0,scale:1,opacity:0.35,duration:2.4,ease:'power3.out',svgOrigin:'1320 510',immediateRender:false},0);
tl.fromTo('#introRule',{scaleX:0},{scaleX:1,transformOrigin:'left center',duration:1.1,ease:'power3.inOut',immediateRender:false},1.55);
tl.to(['#introA','#introB','#introC'],{y:-45,opacity:0,duration:0.3,stagger:0.05,ease:'power2.in'},4.05);
scene('#brand',4.5,8.5);
tl.fromTo('#brandPanel',{x:1920},{x:0,duration:0.5,ease:'power4.out',immediateRender:false},4.5);
reveal('#brandName',4.8,0.75,170);reveal('#brandDesc',5.3,0.6,40);
tl.fromTo('#brandMark',{scale:0,rotation:-40},{scale:1,rotation:0,duration:0.85,ease:'back.out(1.2)',svgOrigin:'960 270',immediateRender:false},5.1);
tl.to('#brandName',{scale:1.025,svgOrigin:'960 560',duration:2.3,ease:'none'},5.8);
scene('#proof',8.5,14);
reveal('#proofA',8.65,0.65,100);reveal('#proofB',9.05,0.65,100);reveal('#proofCopy',9.8,0.6,35);
tl.fromTo('#proofSeal',{scale:0.15,opacity:0},{scale:1,opacity:1,duration:0.85,ease:'back.out(1.3)',svgOrigin:'1500 770',immediateRender:false},10.3);
tl.fromTo('#check',{strokeDasharray:210,strokeDashoffset:210},{strokeDashoffset:0,duration:0.65,ease:'power2.out',immediateRender:false},10.9);
tl.to('#proofSeal',{rotation:12,svgOrigin:'1500 770',duration:2.3,ease:'sine.inOut'},11.6);
scene('#transparency',14,20);
reveal('#transA',14.15,0.55,100);reveal('#transB',14.5,0.55,100);reveal('#transC',14.9,0.65,100);reveal('#transCopy',15.65,0.6,30);
tl.fromTo('#blockLine',{scaleY:0},{scaleY:1,transformOrigin:'top center',duration:1.2,ease:'power2.inOut',immediateRender:false},15.4);
reveal('#block1',15.4,0.65,45);reveal('#block2',15.9,0.65,45);reveal('#block3',16.4,0.65,45);
tl.to('#blocks',{y:-18,duration:2.5,ease:'sine.inOut'},17.3);
scene('#wallet',20,25);
reveal('#walletA',20.15,0.65,100);reveal('#walletB',20.55,0.65,100);reveal('#walletCopy',21.3,0.6,30);
tl.fromTo('#walletArt',{x:180,rotation:10,opacity:0},{x:0,rotation:0,opacity:1,duration:0.9,ease:'power3.out',svgOrigin:'1485 750',immediateRender:false},21.65);
tl.to('#walletArt',{y:-15,duration:1.8,ease:'sine.inOut'},23);
scene('#ending',25,30);
tl.fromTo('#endPanel',{y:1080},{y:0,duration:0.55,ease:'power4.out',immediateRender:false},25);
reveal('#endTop',25.45,0.6,35);reveal('#endName',25.55,0.8,140);reveal('#endAddress',26.15,0.7,60);reveal('#endHandle',26.7,0.6,25);
tl.to('#endName',{scale:1.018,svgOrigin:'960 440',duration:2.6,ease:'none'},27.4);
window.__timelines=window.__timelines||{};
window.__timelines['main']=tl;
})();
</script>
</body>
</html>
