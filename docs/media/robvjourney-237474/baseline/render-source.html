<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Nohandslabs — Let the system work</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080a0b}#root{position:relative;width:100%;height:100%;overflow:hidden;background:#080a0b}canvas{display:block;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="15">
<canvas id="film" class="clip" data-start="0" data-duration="15" width="1920" height="1080" aria-label="Nohandslabs motion graphic: AI-operated companies, with a target of 95 percent AI and 5 percent human work."></canvas>
</div>
<script src="gsap.min.js"></script>
<script>
/* Editable creative configuration. All drawings are original procedural artwork.
   Official factual source: https://nohandslabs.com/
   The 95/5 split is a stated target, not measured performance.
   Scene boundaries: 0 / 3 / 6 / 10 / 12.3 / 15 seconds. */
const CONFIG={ink:'#080a0b',paper:'#f2f1e8',acid:'#dfff00',muted:'#888e86',duration:15};
const canvas=document.getElementById('film');
const c=canvas.getContext('2d');
const W=1920,H=1080,TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,p)=>a+(b-a)*p;
const progress=(t,a,b)=>clamp((t-a)/(b-a));
const ease=p=>1-Math.pow(1-clamp(p),4);
const smooth=p=>{p=clamp(p);return p*p*(3-2*p)};
let seed=716493;
function seeded(){seed^=seed<<13;seed^=seed>>>17;seed^=seed<<5;return(seed>>>0)/4294967296}
const specks=Array.from({length:180},()=>({x:seeded()*W,y:seeded()*H,r:.5+seeded()*1.4,phase:seeded()*TAU}));
const chips=[];
for(let z=0;z<4;z++)for(let y=0;y<4;y++)for(let x=0;x<4;x++)chips.push({x:(x-1.5)*110,y:(y-1.5)*110,z:(z-1.5)*110,dx:(seeded()-.5)*1200,dy:(seeded()-.5)*1000,dz:(seeded()-.5)*800,phase:seeded()*TAU});
const grain=document.createElement('canvas');grain.width=160;grain.height=90;
const gc=grain.getContext('2d'),pixels=gc.createImageData(160,90);
for(let i=0;i<pixels.data.length;i+=4){const n=Math.floor(seeded()*255);pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=n;pixels.data[i+3]=255}gc.putImageData(pixels,0,0);
const grainPattern=c.createPattern(grain,'repeat');
function font(size,weight=800,mono=false){c.font=`${weight} ${size}px ${mono?'monospace':'Arial, Helvetica, sans-serif'}`}
function text(s,x,y,size,color=CONFIG.paper,weight=800,align='left',mono=false){c.save();font(size,weight,mono);c.fillStyle=color;c.textAlign=align;c.textBaseline='alphabetic';c.fillText(s,x,y);c.restore()}
function line(x1,y1,x2,y2,color,width=1){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function rect(x,y,w,h,color){c.fillStyle=color;c.fillRect(x,y,w,h)}
function round(x,y,w,h,r,fill,stroke){c.beginPath();c.roundRect(x,y,w,h,r);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=2;c.stroke()}}
function reveal(s,x,y,size,t,delay,color=CONFIG.paper,weight=900){const p=ease(progress(t,delay,delay+.66));c.save();c.beginPath();c.rect(x-12,y-size-16,1680,size+38);c.clip();c.translate(0,(1-p)*(size+34));text(s,x,y,size,color,weight);c.restore()}
function backdrop(t,grid=true){rect(0,0,W,H,CONFIG.ink);const g=c.createRadialGradient(1350,480,0,1350,480,1000);g.addColorStop(0,'rgba(114,145,28,.09)');g.addColorStop(1,'rgba(0,0,0,0)');c.fillStyle=g;c.fillRect(0,0,W,H);if(grid){c.save();c.globalAlpha=.32;for(let x=80;x<W;x+=110)line(x,0,x,H,'#252a25');for(let y=100;y<H;y+=110)line(0,y,W,y,'#252a25');c.restore()}c.save();for(const s of specks){c.globalAlpha=.12+.13*(.5+.5*Math.sin(t*.7+s.phase));rect(s.x,s.y,s.r,s.r,CONFIG.paper)}c.restore()}
function rotate(v,ax,ay){let x=v.x*Math.cos(ay)+v.z*Math.sin(ay),z=-v.x*Math.sin(ay)+v.z*Math.cos(ay);return{x,y:v.y*Math.cos(ax)-z*Math.sin(ax),z:v.y*Math.sin(ax)+z*Math.cos(ax)}}
function project(v,cx,cy,scale=1){const p=850/(900+v.z);return{x:cx+v.x*p*scale,y:cy+v.y*p*scale,z:v.z}}
function cubeCloud(t,cx,cy,assembly=1,scale=1,opacity=1){const ax=-.43+Math.sin(t*.3)*.09,ay=.58+t*.24;const arr=chips.map((v,i)=>{const spread=1-assembly;const pos={x:v.x+v.dx*spread,y:v.y+v.dy*spread,z:v.z+v.dz*spread};return{v:pos,depth:rotate(pos,ax,ay).z,i}}).sort((a,b)=>b.depth-a.depth);c.save();c.globalAlpha=opacity;for(const item of arr){const v=item.v;const size=29;const verts=[];for(let j=0;j<8;j++)verts.push(project(rotate({x:v.x+((j&1)?size:-size),y:v.y+((j&2)?size:-size),z:v.z+((j&4)?size:-size)},ax,ay),cx,cy,scale));const faces=[[0,1,3,2],[1,5,7,3],[2,3,7,6]];for(let j=0;j<faces.length;j++){c.beginPath();faces[j].forEach((id,k)=>k?c.lineTo(verts[id].x,verts[id].y):c.moveTo(verts[id].x,verts[id].y));c.closePath();c.fillStyle=j===0?(item.i%9===0?CONFIG.acid:'#182014'):j===1?'#0d120c':'#28321b';c.fill();c.strokeStyle=item.i%9===0?'#e4ff69':'#698333';c.lineWidth=1.5;c.stroke()}const edges=[[0,4],[4,5],[4,6],[5,7],[6,7],[0,2],[0,1],[1,3],[2,3],[2,6],[1,5],[3,7]];c.beginPath();for(const [a,b]of edges){c.moveTo(verts[a].x,verts[a].y);c.lineTo(verts[b].x,verts[b].y)}c.strokeStyle='rgba(195,231,95,.25)';c.lineWidth=.8;c.stroke()}c.restore()}
function orbital(cx,cy,r,t,alpha=1){c.save();c.globalAlpha=alpha;c.translate(cx,cy);c.rotate(-.3);c.scale(1,.37);for(let i=0;i<3;i++){c.beginPath();c.arc(0,0,r+i*30,t*.3+i*.7,t*.3+i*.7+Math.PI*1.65);c.strokeStyle=i===0?CONFIG.acid:'#303b23';c.lineWidth=i===0?3:1;c.stroke()}c.restore()}
function sceneOne(t){backdrop(t);c.save();c.globalAlpha=.18;orbital(1455,560,410,t);c.restore();cubeCloud(t,1460,540,ease(progress(t,.1,1.65)),1.25);reveal('LET THE',108,335,130,t,.04);reveal('SYSTEM',96,566,225,t,.19,CONFIG.acid);reveal('WORK.',101,795,225,t,.38);const p=ease(progress(t,.7,1.45));rect(110,860,680*p,7,CONFIG.acid);c.save();c.globalAlpha=p;text('Autonomy starts here.',110,950,42,CONFIG.paper,400);c.restore();if(t>2.65){const p=progress(t,2.65,3);c.save();c.globalAlpha=p*.45;rect(0,0,W,H,CONFIG.acid);c.restore();rect(W*(1-ease(p)),0,W*ease(p),H,CONFIG.acid)}}
const nodes=[{label:'INTAKE',x:110},{label:'CREATE',x:454},{label:'DELIVER',x:798},{label:'SUPPORT',x:1142},{label:'BILL',x:1486}];
function icon(kind,x,y,p){c.save();c.translate(x,y);c.strokeStyle=CONFIG.acid;c.lineWidth=4;c.fillStyle=CONFIG.acid;if(kind===0){c.strokeRect(-25,-22,50,44);line(-35,-38,0,-4,CONFIG.acid,4);line(0,-4,35,-38,CONFIG.acid,4)}if(kind===1){c.rotate(p*.5);c.strokeRect(-24,-24,48,48);c.rotate(Math.PI/4);c.strokeRect(-24,-24,48,48)}if(kind===2){line(-32,0,30,0,CONFIG.acid,4);line(8,-22,30,0,CONFIG.acid,4);line(8,22,30,0,CONFIG.acid,4)}if(kind===3){c.beginPath();c.arc(0,-3,28,Math.PI,TAU);c.stroke();c.strokeRect(-30,-3,10,24);c.strokeRect(20,-3,10,24);line(28,20,8,31,CONFIG.acid,4)}if(kind===4){c.strokeRect(-22,-30,44,60);line(-9,-11,12,-11,CONFIG.acid,4);line(-9,2,12,2,CONFIG.acid,4);line(-9,15,6,15,CONFIG.acid,4)}c.restore()}
function sceneTwo(t){backdrop(t+3);reveal('AGENTS',104,300,190,t,0,CONFIG.paper);reveal('IN MOTION.',104,470,155,t,.12,CONFIG.acid);orbital(1480,280,240,t,.5);cubeCloud(t+3,1480,280,1,.51,.8);const lineP=ease(progress(t,.3,1.8));line(250,767,250+1414*lineP,767,'#48542c',3);for(let i=0;i<4;i++){const p=((t*.65+i*.24)%1);const x=250+1414*p;c.save();c.globalAlpha=lineP;rect(x-18,763,36,8,CONFIG.acid);c.restore()}nodes.forEach((n,i)=>{const p=ease(progress(t,.2+i*.14,.8+i*.14));const y=650+(1-p)*120;c.save();c.globalAlpha=p;round(n.x,y,300,235,10,'#10150e','#3c482c');rect(n.x,y,300,4,CONFIG.acid);icon(i,n.x+150,y+80,t);text(n.label,n.x+150,y+174,39,CONFIG.paper,700,'center');const glow=.25+.4*(.5+.5*Math.sin(t*4-i*.8));c.globalAlpha=p*glow;round(n.x-5,y-5,310,245,12,null,CONFIG.acid);c.restore()});if(t>2.7){const p=ease(progress(t,2.7,3));rect(0,H*(1-p),W,H*p,CONFIG.acid)}}
function sceneThree(t){backdrop(t+6,false);const intro=ease(progress(t,0,.55));c.save();c.translate((1-intro)*-90,0);c.globalAlpha=intro;text('BUILD TARGET',115,203,48,CONFIG.acid,600);const n=Math.round(95*ease(progress(t,.08,1.25)));text(n+'%',97,562,320,CONFIG.paper,900);text('AI',119,663,85,CONFIG.acid,900);line(120,720,920,720,'#343d2d',2);text('5% HUMAN',111,855,94,CONFIG.paper,800);text('Strategy. Taste. Final say.',120,932,41,CONFIG.muted,400);c.restore();const cx=1430,cy=524,r=298;const angle=-Math.PI/2;const p=ease(progress(t,.15,1.5));c.save();c.translate(cx,cy);c.rotate((1-intro)*-.45);for(let i=0;i<80;i++){const a=TAU*i/80;line(Math.cos(a)*345,Math.sin(a)*345,Math.cos(a)*357,Math.sin(a)*357,'#303a29',2)}c.beginPath();c.arc(0,0,r,0,TAU);c.strokeStyle='#202719';c.lineWidth=66;c.stroke();c.beginPath();c.arc(0,0,r,angle,angle+TAU*.95*p);c.strokeStyle=CONFIG.acid;c.lineWidth=66;c.stroke();if(p>.98){const q=ease(progress(t,1.15,1.8));c.save();c.translate(9*q,-8*q);c.beginPath();c.arc(0,0,r,angle+TAU*.95+.018,angle+TAU-.018);c.strokeStyle=CONFIG.paper;c.lineWidth=66;c.stroke();c.restore()}c.beginPath();c.arc(0,0,235,0,TAU);c.strokeStyle='#303a29';c.lineWidth=1;c.stroke();text('THE',0,-12,57,CONFIG.paper,800,'center');text('TARGET',0,63,69,CONFIG.paper,800,'center');const a=angle+TAU*.95*p;const px=Math.cos(a)*r,py=Math.sin(a)*r;c.shadowColor=CONFIG.acid;c.shadowBlur=30;c.beginPath();c.arc(px,py,6,0,TAU);c.fillStyle=CONFIG.paper;c.fill();c.restore();if(t>3.65){const p=ease(progress(t,3.65,4));c.save();c.translate(W/2,H/2);c.rotate(-.14);rect(-1200,-p*900,2400,p*1800,CONFIG.acid);c.restore()}}
function sceneFour(t){rect(0,0,W,H,CONFIG.acid);const p1=ease(progress(t,.03,.45)),p2=ease(progress(t,.48,.9)),p3=ease(progress(t,.95,1.4));const words=[['DESIGN IT.',p1,330],['LAUNCH IT.',p2,553],['RELEASE IT.',p3,776]];words.forEach(([s,p,y],i)=>{c.save();c.beginPath();c.rect(80,y-190,1760,205);c.clip();c.translate((1-p)*(i%2?500:-500),(1-p)*80);c.globalAlpha=p;text(s,W/2,y,177,CONFIG.ink,900,'center');c.restore()});for(let i=0;i<8;i++){const a=i*TAU/8;const r=280+ease(progress(t,1.15,2.2))*1000;c.save();c.translate(W/2+Math.cos(a)*r,H/2+Math.sin(a)*r);c.rotate(a+t*.3);c.strokeStyle=CONFIG.ink;c.lineWidth=3;c.strokeRect(-32,-32,64,64);c.restore()}if(t>1.92){const p=ease(progress(t,1.92,2.3));rect(0,0,W*p,H,CONFIG.ink)}}
function sceneFive(t){backdrop(t+12.3,false);const p=ease(progress(t,.05,.7));c.save();c.globalAlpha=.14*p;orbital(W/2,540,690,t+7,1);orbital(W/2,540,810,-t,1);c.restore();const y=480+(1-p)*75;c.save();c.globalAlpha=p;text('nohandslabs',W/2,y,174,CONFIG.paper,800,'center');font(174,800);const half=c.measureText('nohandslabs').width/2;rect(W/2+half+24,y-25,24,24,CONFIG.acid);c.restore();const q=ease(progress(t,.2,.85));c.save();c.globalAlpha=q;text('Companies that build themselves.',W/2,624+(1-q)*35,60,CONFIG.paper,400,'center');c.restore();const r=ease(progress(t,.5,1.05));c.save();c.globalAlpha=r;const bw=656,bx=(W-bw)/2,by=762+(1-r)*35;round(bx,by,bw,114,57,CONFIG.acid,null);text('nohandslabs.com',W/2-24,by+75,48,CONFIG.ink,700,'center');line(bx+bw-100,by+57,bx+bw-61,by+57,CONFIG.ink,4);line(bx+bw-77,by+41,bx+bw-61,by+57,CONFIG.ink,4);line(bx+bw-77,by+73,bx+bw-61,by+57,CONFIG.ink,4);c.restore();const width=1100*r;rect((W-width)/2,690,width,2,'#303929')}
function draw(t){c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.shadowBlur=0;c.clearRect(0,0,W,H);if(t<3)sceneOne(t);else if(t<6)sceneTwo(t-3);else if(t<10)sceneThree(t-6);else if(t<12.3)sceneFour(t-10);else sceneFive(t-12.3);c.save();c.globalAlpha=.035;c.fillStyle=grainPattern;c.fillRect(0,0,W,H);c.restore();const v=c.createRadialGradient(W/2,H/2,360,W/2,H/2,1200);v.addColorStop(0,'rgba(0,0,0,0)');v.addColorStop(1,'rgba(0,0,0,.22)');c.fillStyle=v;c.fillRect(0,0,W,H)}
const playhead={t:0};
const timeline=gsap.timeline({paused:true});
timeline.to(playhead,{t:CONFIG.duration,duration:CONFIG.duration,ease:'none',onUpdate:()=>draw(playhead.t)},0);
draw(0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
</script>
</body>
</html>
