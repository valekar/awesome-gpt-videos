<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Make It Move</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#111110}#root{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="15">
<canvas id="art" class="clip" data-start="0" data-duration="15" width="1920" height="1080" role="img" aria-label="Make It Move: a kinetic typography, sculptural geometry, fluid ribbon and particle motion graphics showreel."></canvas>
</div>
<script src="gsap.min.js"></script>
<script>
(() => {
'use strict';
const W=1920,H=1080,PI=Math.PI,TAU=PI*2;
const C={paper:'#f2eee5',ink:'#111110',orange:'#ff4c16',blue:'#183ee8'};
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');
const typeLayer=document.createElement('canvas');typeLayer.width=W;typeLayer.height=H;
const tx=typeLayer.getContext('2d');
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,t)=>a+(b-a)*t;
const smooth=(a,b,t)=>{const p=clamp((t-a)/(b-a));return p*p*(3-2*p)};
const out=t=>1-Math.pow(1-clamp(t),4);
const back=t=>{t=clamp(t)-1;return 1+2.35*t*t*t+1.35*t*t};
const mod=(a,b)=>((a%b)+b)%b;
function bg(g,color){g.fillStyle=color;g.fillRect(0,0,W,H)}
function circle(g,x,y,r,color){g.beginPath();g.arc(x,y,Math.max(.001,r),0,TAU);g.fillStyle=color;g.fill()}
function text(g,s,x,y,size,color,maxWidth,align='left'){
 g.save();g.font='900 '+size+'px Arial, Helvetica, sans-serif';g.textBaseline='alphabetic';g.textAlign=align;g.fillStyle=color;
 const width=g.measureText(s).width,scale=maxWidth?Math.min(1,maxWidth/width):1;
 g.translate(x,y);g.scale(scale,1);g.fillText(s,0,0);g.restore();
}
function outline(g,s,x,y,size,color,maxWidth){
 g.save();g.font='900 '+size+'px Arial, Helvetica, sans-serif';g.textBaseline='alphabetic';const sc=Math.min(1,maxWidth/g.measureText(s).width);g.translate(x,y);g.scale(sc,1);g.strokeStyle=color;g.lineWidth=2;g.strokeText(s,0,0);g.restore();
}
function revealText(g,s,x,y,size,color,maxWidth,p){
 g.save();g.beginPath();g.rect(x-12,y-size-20,maxWidth+30,size+40);g.clip();g.translate(0,(1-out(p))*(size+40));text(g,s,x,y,size,color,maxWidth);g.restore();
}
function star(g,x,y,r,rotation,color,arms=8){
 g.save();g.translate(x,y);g.rotate(rotation);g.fillStyle=color;
 for(let i=0;i<arms;i++){g.save();g.rotate(i*TAU/arms);g.fillRect(-r*.145,-r,r*.29,r*2);g.restore()}
 g.restore();
}
function glow(g,x,y,r,color){const gr=g.createRadialGradient(x,y,0,x,y,r);gr.addColorStop(0,color);gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(x-r,y-r,r*2,r*2)}
function opening(g,u){
 bg(g,C.paper);
 const zoom=1+.018*smooth(1.25,2.9,u);g.save();g.translate(W/2,H/2);g.scale(zoom,zoom);g.translate(-W/2,-H/2);
 revealText(g,'MAKE',112,430,370,C.ink,1260,(u-.04)/.68);
 revealText(g,'WAVES',112,832,370,C.ink,1700,(u-.26)/.73);
 const p=back((u-.4)/.9),x=mix(2130,1530,out((u-.4)/.95)),y=330;
 g.save();g.translate(x,y);g.rotate(-.25*(1-out(u/1.4)));circle(g,0,0,196*Math.max(.01,p),C.ink);star(g,0,0,137*Math.max(.01,p),u*.48,C.orange,6);g.restore();
 const line=out((u-.8)/1.1);g.fillStyle=C.orange;g.fillRect(123,915,1670*line,13);
 g.restore();
}
function rotate(p,ax,ay,az){
 let x=p[0],y=p[1],z=p[2];let c=Math.cos(ax),s=Math.sin(ax);[y,z]=[y*c-z*s,y*s+z*c];c=Math.cos(ay);s=Math.sin(ay);[x,z]=[x*c+z*s,-x*s+z*c];c=Math.cos(az);s=Math.sin(az);return [x*c-y*s,x*s+y*c,z];
}
function project(p,cx=960,cy=540,f=1120){const s=f/(f+p[2]);return [cx+p[0]*s,cy+p[1]*s,s]}
function sculpture(g,u){
 bg(g,C.ink);glow(g,1030,510,650,'rgba(255,66,15,.13)');
 const settle=out(u/.95),cx=mix(1530,960,settle),cy=mix(330,540,settle);
 g.save();g.globalAlpha=.18;outline(g,'FORM',106,733,495,C.paper,1710);g.restore();
 g.save();g.translate(cx,cy);g.rotate(-.35+u*.09);g.strokeStyle='rgba(242,238,229,.22)';g.lineWidth=1.3;
 for(let k=0;k<3;k++){g.beginPath();g.ellipse(0,0,540+k*37,180+k*32,0,0,TAU);g.stroke()}g.restore();
 const ax=.52+u*.49,ay=-.63+u*.56,az=-.36+u*.15;
 const major=274+18*Math.sin(u*1.4),minor=109;
 const NU=100,NV=26,verts=[];
 for(let a=0;a<=NU;a++){
  verts[a]=[];const q=a/NU*TAU;
  for(let b=0;b<=NV;b++){
   const v=b/NV*TAU,twist=v+.3*Math.sin(q*3+u*1.6);
   const rr=major+minor*Math.cos(twist);
   const p=rotate([rr*Math.cos(q),rr*Math.sin(q),minor*Math.sin(twist)],ax,ay,az);
   const n=rotate([Math.cos(twist)*Math.cos(q),Math.cos(twist)*Math.sin(q),Math.sin(twist)],ax,ay,az);
   verts[a][b]={p,n,s:project(p,cx,cy,1080)};
  }
 }
 const faces=[];
 for(let a=0;a<NU;a++)for(let b=0;b<NV;b++){
  const v=[verts[a][b],verts[a+1][b],verts[a+1][b+1],verts[a][b+1]];
  faces.push({v,z:v.reduce((s,p)=>s+p.p[2],0)/4,a,b});
 }
 faces.sort((a,b)=>b.z-a.z);
 for(const f of faces){
  const n=f.v[0].n,d=Math.max(0,-n[0]*.35-n[1]*.6-n[2]*.7),spec=Math.pow(Math.max(0,-n[0]*.12-n[1]*.43-n[2]*.89),22);
  const stripe=f.b===3||f.b===4;
  const r=Math.round(128+106*d+21*spec),gr=Math.round(21+64*d+151*spec),bl=Math.round(5+15*d+128*spec);
  const color=stripe?'rgb('+Math.round(147+90*d)+','+Math.round(135+95*d)+','+Math.round(114+91*d)+')':'rgb('+r+','+gr+','+bl+')';
  g.beginPath();g.moveTo(f.v[0].s[0],f.v[0].s[1]);for(let j=1;j<4;j++)g.lineTo(f.v[j].s[0],f.v[j].s[1]);g.closePath();g.fillStyle=color;g.fill();g.strokeStyle=color;g.lineWidth=.65;g.stroke();
 }
 const dot=rotate([Math.cos(u*2.3)*540,Math.sin(u*2.3)*540,0],.8,.2,-.35),dp=project(dot,cx,cy);circle(g,dp[0],dp[1],11,C.paper);
}
function fluid(g,u){
 bg(g,C.blue);
 const camera=.045*Math.sin(u*.8);g.save();g.translate(960,540);g.rotate(camera);g.translate(-960,-540);
 revealText(g,'FLOW',105,770,520,C.paper,1710,u/.78);
 const wave=(x,j)=>520+(j-2)*129+225*Math.sin(x*.0031-u*1.7+j*.31)+84*Math.sin(x*.0058+u*1.1+j*.42);
 for(let j=4;j>=0;j--){
  const points=[],N=150;
  for(let k=0;k<=N;k++){
   const x=-220+k/N*2380,thick=56+23*Math.sin(x*.0023+u+j*.45),y=wave(x,j);
   points.push({x,y,w:thick});
  }
  g.beginPath();g.moveTo(points[0].x,points[0].y-points[0].w);
  for(const p of points)g.lineTo(p.x,p.y-p.w);
  for(let k=N;k>=0;k--)g.lineTo(points[k].x,points[k].y+points[k].w);
  g.closePath();
  const gr=g.createLinearGradient(0,100+j*50,1700,980-j*35);
  gr.addColorStop(0,'#8c1a08');gr.addColorStop(.2,C.orange);gr.addColorStop(.47,'#ff9a61');gr.addColorStop(.59,'#ff5420');gr.addColorStop(.85,'#b6280a');gr.addColorStop(1,C.orange);
  g.fillStyle=gr;g.fill();
  g.beginPath();for(let k=0;k<=N;k++){const p=points[k];if(!k)g.moveTo(p.x,p.y-p.w+3);else g.lineTo(p.x,p.y-p.w+3)}g.strokeStyle='rgba(255,226,183,.61)';g.lineWidth=2.2;g.stroke();
  g.beginPath();for(let k=0;k<=N;k++){const p=points[k];if(!k)g.moveTo(p.x,p.y+p.w-4);else g.lineTo(p.x,p.y+p.w-4)}g.strokeStyle='rgba(65,12,4,.3)';g.lineWidth=4;g.stroke();
 }
 for(let i=0;i<105;i++){
  const j=i%5,x=mod(i*113+u*370,2360)-220,y=wave(x,j)+(Math.sin(i*23.7)*.73)*(45+20*Math.sin(x*.0023+u));
  g.globalAlpha=.2+.45*(.5+.5*Math.sin(i*8.1));circle(g,x,y,1.2+(i%3)*.65,C.paper);
 }
 g.globalAlpha=1;g.restore();
}
function breakFrame(g,u){
 bg(tx,C.orange);
 const enter=out(u/.8);
 revealText(tx,'BREAK',100,487,425,C.ink,1720,u/.65);
 revealText(tx,'THE FRAME',109,810,260,C.ink,1700,(u-.15)/.7);
 const agitation=Math.sin(clamp(u/2.25)*PI),amp=agitation*135;
 bg(g,C.orange);
 const strips=24,sh=H/strips;
 for(let i=0;i<strips;i++){
  const offset=amp*Math.sin(i*.85+u*5.7)*(.4+.6*Math.sin(i*1.2+u*2));
  g.drawImage(typeLayer,0,i*sh,W,sh,offset,i*sh,W,sh+.5);
 }
 const travel=smooth(.55,1.25,u)-smooth(1.45,2.25,u);
 if(travel>0){
  g.save();g.translate(960,540);g.rotate(-.22);g.beginPath();g.rect(-1400,-65,2800,130);g.clip();g.fillStyle=C.paper;g.fillRect(-1400,-65,2800,130);
  text(g,'BREAK THE FRAME',mix(1420,-1420,smooth(.55,2.25,u)),47,129,C.ink,2350,'center');g.restore();
 }
 const r=54*back((u-.15)/.8);g.save();g.translate(1730,145);g.rotate(u*.9);g.strokeStyle=C.ink;g.lineWidth=12;g.strokeRect(-r,-r,r*2,r*2);g.restore();
 const cut=smooth(1.9,2.65,u);if(cut>0){g.fillStyle=C.ink;g.fillRect(0,0,W,88*cut);g.fillRect(0,H-88*cut,W,88*cut)}
}
function particles(g,u){
 bg(g,C.ink);glow(g,960,540,710,'rgba(255,76,22,.09)');
 const open=smooth(.3,1.6,u),fold=smooth(2.1,2.95,u),parts=[];
 const count=860;
 for(let i=0;i<count;i++){
  const yy=1-2*(i+.5)/count,rr=Math.sqrt(1-yy*yy),phi=i*2.399963229728653;
  const sph=rotate([rr*Math.cos(phi)*325,yy*325,rr*Math.sin(phi)*325],u*.24,u*.54,-.16);
  const ang=phi+u*.11,z=mod(i*47.13-u*690,2450)-650,radius=350+(i%13)*39;
  let x=mix(sph[0],Math.cos(ang)*radius,open),y=mix(sph[1],Math.sin(ang)*radius,open),zz=mix(sph[2],z,open);
  x*=1-.86*fold;y*=1-.86*fold;zz=mix(zz,0,fold);
  const camX=Math.sin(u*.8)*60*open,camY=Math.cos(u*.7)*40*open;
  const p=project([x-camX,y-camY,zz],960,540,900);
  const tail=project([x-camX,y-camY,zz+mix(0,48,open)],960,540,900);
  const fade=smooth(-650,-400,zz)*(1-smooth(1350,1800,zz));
  parts.push({p,tail,z:zz,alpha:mix(.9,fade,open),size:(1.4+(i%5)*.37)*p[2],i});
 }
 parts.sort((a,b)=>b.z-a.z);
 for(const p of parts){
  const color=p.i%7<2?C.paper:C.orange;
  g.globalAlpha=p.alpha*.82;g.strokeStyle=color;g.lineWidth=Math.max(.6,p.size*.64);g.beginPath();g.moveTo(p.tail[0],p.tail[1]);g.lineTo(p.p[0],p.p[1]);g.stroke();
  circle(g,p.p[0],p.p[1],Math.max(.3,p.size),color);
  if(p.i%53===0){g.globalAlpha=p.alpha*.13;circle(g,p.p[0],p.p[1],p.size*4.5,color)}
 }
 g.globalAlpha=1;
 const ring=smooth(.05,.8,u)*(1-smooth(.8,1.8,u));
 g.save();g.strokeStyle=C.orange;g.lineWidth=2;g.globalAlpha=.5*ring;g.beginPath();g.ellipse(960,540,410,410,0,0,TAU);g.stroke();g.restore();
}
function finale(g,u){
 bg(g,C.paper);
 revealText(g,'MAKE',111,460,390,C.ink,1280,(u-.08)/.65);
 revealText(g,'IT MOVE.',111,858,350,C.ink,1690,(u-.24)/.78);
 const p=back((u-.25)/.85),rotation=mix(-1.5,.14,out((u-.25)/1.3));
 g.save();g.translate(1560,306);g.rotate(rotation);circle(g,0,0,174*Math.max(.001,p),C.orange);star(g,0,0,117*Math.max(.001,p),0,C.ink,6);g.restore();
 const underline=out((u-.7)/.9);g.fillStyle=C.orange;g.fillRect(122,920,1673*underline,13);
}
const scenes=[opening,sculpture,fluid,breakFrame,particles,finale];
const starts=[0,2.55,5.05,7.55,10.05,12.65];
const centers=[[960,540],[1530,330],[960,540],[1080,550],[960,540],[960,540]];
function paintScene(i,t){ctx.save();scenes[i](ctx,Math.max(0,t-starts[i]));ctx.restore()}
function draw(t){
 t=clamp(t,0,15);ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);
 let i=0;for(let j=1;j<starts.length;j++)if(t>=starts[j])i=j;
 const local=t-starts[i],transition=.48;
 if(i>0&&local<transition){
  paintScene(i-1,t);const p=local/transition,r=2400*(p*p*(3-2*p));ctx.save();ctx.beginPath();ctx.arc(centers[i][0],centers[i][1],Math.max(.001,r),0,TAU);ctx.clip();paintScene(i,t);ctx.restore();
 }else paintScene(i,t);
}
const clock={t:0};
const timeline=gsap.timeline({paused:true});
timeline.to(clock,{t:15,duration:15,ease:'none',onUpdate:()=>draw(clock.t)},0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
draw(0);
})();
</script>
</body>
</html>
