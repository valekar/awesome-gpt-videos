const ORANGE='#ef5b30',CYAN='#49cec8',WHITE='#eeefea',GRAY='#a5abad';
const bg=document.getElementById('background').getContext('2d');
const ink=document.getElementById('editorial').getContext('2d');

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,p)=>a+(b-a)*p;
const smooth=v=>{v=clamp(v);return v*v*(3-2*v)};
const ramp=(t,a,b)=>smooth((t-a)/(b-a));
const appear=(t,a,d=.4)=>ramp(t,a,a+d);

const CREST=[-.90,-.75],BASIN=[.50,.35],EXTENT=1.8;

function point(x,z,lift=0){return [x,heightAt(x,z)+lift,z]}
function route(u,lift=.025){

}
function routeAmount(f){return 1-Math.pow(1-clamp(f),2.25)}

 {t:2.15,...opening,yaw:.68,sx:205,cx:360,rear:[-1.8,-1.8,492],front:[1.8,1.8,951],peak:541,brightness:.76},
 {t:2.85,...opening,yaw:.60,sx:207,cx:360,rear:[-1.8,-1.8,453],front:[1.8,1.8,878],peak:498,brightness:.235},
 {t:9.5,...opening,yaw:.50,sx:207,cx:360,rear:[-1.8,-1.8,453],front:[1.8,1.8,878],peak:498,brightness:.235},
 {t:10.3,...introduction,peak:435,brightness:.27},
 {t:11,...introduction},
 {t:16.5,...introduction,yaw:.43,sx:225,cx:370},
 {t:17.1,...downhill},{t:20,...downhill},
 {t:30,...downhill,yaw:.05,sx:202,cx:369,peak:425,front:[0,1.8,806]},
 {t:33,...downhill,yaw:.03,sx:202,cx:373,peak:425,front:[0,1.8,806]},

function solve3(matrix,values){
 const a=matrix.map((row,i)=>[...row,values[i]]);

  let pivot=c;for(let r=c+1;r<3;r++)if(Math.abs(a[r][c])>Math.abs(a[pivot][c]))pivot=r;

  const d=a[c][c];if(Math.abs(d)<1e-9)throw new Error('Degenerate terrain pose.');
  for(let k=c;k<4;k++)a[c][k]/=d;
  for(let r=0;r<3;r++)if(r!==c){const f=a[r][c];for(let k=c;k<4;k++)a[r][k]-=f*a[c][k]}

}
function fitPose(description){

 for(let iteration=0;iteration<10;iteration++){
  const length=Math.hypot(c.depthScale,c.heightScale),ce=c.heightScale/length,se=c.depthScale/length;
  const matrix=anchors.map(a=>{
   const forward=Math.sin(c.yaw)*a[0]+Math.cos(c.yaw)*a[1],h=heightAt(a[0],a[1]);
   const q=1/(1-c.perspective*(ce*forward+se*h));

}
const poseKeys=poseDescriptions.map(fitPose);
function poseAt(t){
 let a=poseKeys[0],b=a;
 for(let i=1;i<poseKeys.length;i++){b=poseKeys[i];if(t<=b.t)break;a=b}
 const p=a===b?0:smooth((t-a.t)/(b.t-a.t));
 const c={};for(const key of ['yaw','sx','cx','cy','depthScale','heightScale','perspective','brightness'])c[key]=mix(a[key],b[key],p);

}
function project(p,c){
 const ca=Math.cos(c.yaw),sa=Math.sin(c.yaw),lateral=ca*p[0]-sa*p[2],forward=sa*p[0]+ca*p[2];

 return [c.cx+c.sx*lateral*q,c.cy+(c.depthScale*forward-c.heightScale*p[1])*q];
}

const vertexSource=`
attribute vec3 aPosition;
attribute vec3 aNormal;
uniform float uYaw;
uniform float uScaleX;
uniform float uDepthScale;
uniform float uHeightScale;
uniform float uPerspective;
uniform vec2 uOrigin;
uniform float uRadius;
uniform vec3 uCenter;
uniform vec3 uEnd;
uniform float uMode;
varying vec3 vPosition;
varying vec3 vNormal;
void main(){
 vec3 p=aPosition;
 vec3 n=aNormal;
 if(uMode>.5&&uMode<1.5){p=p*uRadius+uCenter;}
 else if(uMode>1.5){
  vec3 delta=uEnd-uCenter;
  float length=max(length(delta),.0001);
  vec3 axis=delta/length;
  vec3 reference=abs(axis.y)>.95?vec3(1.,0.,0.):vec3(0.,1.,0.);
  vec3 side=normalize(cross(reference,axis));
  vec3 other=normalize(cross(axis,side));
  p=uCenter+axis*(aPosition.y*length)+uRadius*(side*aPosition.x+other*aPosition.z);
  n=normalize(side*aNormal.x+axis*aNormal.y+other*aNormal.z);
 }

 float c=cos(uYaw),s=sin(uYaw);

 float length=sqrt(uDepthScale*uDepthScale+uHeightScale*uHeightScale);
 float ce=uHeightScale/length,se=uDepthScale/length;
 float depth=ce*forward+se*p.y;
 float q=1./(1.-uPerspective*depth);
 vec2 screen=uOrigin+vec2(uScaleX*lateral,uDepthScale*forward-uHeightScale*p.y)*q;
 float w=1./q;
 gl_Position=vec4((screen.x/360.-1.)*w,(1.-screen.y/640.)*w,-depth*.085*w,w);
}`;
const fragmentSource=`
precision highp float;
varying vec3 vPosition;
varying vec3 vNormal;
uniform float uMode;
uniform vec3 uColor;
uniform float uBrightness;
uniform float uOpacity;
void main(){
 vec3 n=normalize(vNormal);
 vec3 light=normalize(vec3(-.35,1.,.35));
 vec3 color;
 if(uMode<.5){
  vec2 crest=vPosition.xz-vec2(-.90,-.75);
  vec2 basin=vPosition.xz-vec2(.50,.35);
  float hot=exp(-dot(crest,crest)/.49);
  float core=exp(-dot(crest,crest)/.095);
  float cool=exp(-dot(basin,basin)/.47);
  float inner=exp(-dot(basin,basin)/.19);
  float rim=pow(clamp(max(abs(vPosition.x),abs(vPosition.z))/1.8,0.,1.),5.);
  float diffuse=.84+.16*max(dot(n,light),0.);
  color=mix(vec3(.565,.585,.590),vec3(.87,.50,.425),rim*.57);
  color=mix(color,vec3(1.,.33,.105),hot*.94);
  color=mix(color,vec3(1.,.57,.17),core*.48);
  color=mix(color,vec3(.18,.88,.84),cool*.64);
  color=color*diffuse+inner*vec3(.035,.255,.23);
  vec2 grid=abs(fract((vPosition.xz+1.8)*17.)-.5);
  float line=1.-smoothstep(.012,.035,min(grid.x,grid.y));
  color+=line*vec3(.018)*(1.-hot*.65)*(1.-inner*.5);
  if(!gl_FrontFacing){
   color=mix(vec3(.08,.19,.195),vec3(.09,.39,.375),cool*.8);
   color+=inner*vec3(.005,.065,.06);
  }
 }else{
  float diffuse=.81+.19*max(dot(n,light),0.);
  float shine=pow(max(dot(n,normalize(vec3(-.35,.85,.55))),0.),20.);
  color=uColor*diffuse+vec3(.28)*shine;
  if(uColor.r>.9&&uColor.g>.9)color=mix(color,uColor,.52);
 }

}`;
function shader(type,source){
 const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);
 if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s;
}
const program=gl.createProgram();
gl.attachShader(program,shader(gl.VERTEX_SHADER,vertexSource));
gl.attachShader(program,shader(gl.FRAGMENT_SHADER,fragmentSource));
gl.linkProgram(program);
if(!gl.getProgramParameter(program,gl.LINK_STATUS))throw new Error(gl.getProgramInfoLog(program));
gl.useProgram(program);
const U={};
for(const name of ['Yaw','ScaleX','DepthScale','HeightScale','Perspective','Origin','Radius','Center','End','Mode','Color','Brightness','Opacity'])U[name]=gl.getUniformLocation(program,'u'+name);
const positionLocation=gl.getAttribLocation(program,'aPosition'),normalLocation=gl.getAttribLocation(program,'aNormal');
function geometry(positions,normals,indices){

}
function terrainGeometry(){
 const p=[],n=[],indices=[],N=160;
 for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){
  const x=-EXTENT+2*EXTENT*i/N,z=-EXTENT+2*EXTENT*j/N,e=.002;
  const dx=(heightAt(x+e,z)-heightAt(x-e,z))/(2*e),dz=(heightAt(x,z+e)-heightAt(x,z-e))/(2*e),length=Math.hypot(dx,1,dz);

  const k=j*(N+1)+i;

}
function sphereGeometry(){

  const a=Math.PI*j/rows,b=2*Math.PI*i/cols,x=Math.sin(a)*Math.cos(b),y=Math.cos(a),z=Math.sin(a)*Math.sin(b);
  p.push(x,y,z);n.push(x,y,z);

  const k=j*(cols+1)+i;indices.push(k,k+1,k+cols+1,k+1,k+cols+2,k+cols+1);

}
function arrowGeometry(){
 const p=[],n=[],indices=[],N=20;
 function rings(y0,r0,y1,r1,slope){
  const offset=p.length/3;
  for(let row=0;row<2;row++)for(let i=0;i<=N;i++){
   const a=i/N*Math.PI*2,c=Math.cos(a),s=Math.sin(a),r=row?r1:r0;
   p.push(c*r,row?y1:y0,s*r);

  }

const terrainMesh=terrainGeometry(),sphereMesh=sphereGeometry(),arrowMesh=arrowGeometry();
function bind(mesh){
 gl.bindBuffer(gl.ARRAY_BUFFER,mesh.positions);gl.enableVertexAttribArray(positionLocation);gl.vertexAttribPointer(positionLocation,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,mesh.normals);gl.enableVertexAttribArray(normalLocation);gl.vertexAttribPointer(normalLocation,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.indices);

const orangeRGB=[1,.34,.095],cyanRGB=[.16,.91,.87],whiteRGB=[.99,1,.975];
function sphere(p,r,color,opacity=1){
 if(opacity<=0)return;
 gl.uniform1f(U.Mode,1);gl.uniform1f(U.Radius,r);gl.uniform3fv(U.Center,p);gl.uniform3fv(U.Color,color);gl.uniform1f(U.Opacity,opacity);

}
function worldArrow(start,end,color,opacity=1,radius=.043){

 gl.drawElements(gl.TRIANGLES,arrowMesh.count,gl.UNSIGNED_SHORT,0);
}
const readouts=[
 [19.7,2,'2.48'],[21,4,'1.43'],[22,7,'1.09'],[23,10,'0.89'],[24,13,'0.62'],[25,16,'0.28'],[26,19,'0.07'],[27,22,'0.02'],[28,24,'0.00'],[28.67,26,'0.00'],[29,27,'0.00'],[30,30,'0.00']
];
function descentState(t){
 let index=0;for(let i=0;i<readouts.length;i++)if(t>=readouts[i][0])index=i;
 const a=readouts[index],b=readouts[Math.min(index+1,readouts.length-1)],p=a===b?0:clamp((t-a[0])/(b[0]-a[0]));

}

/* Screen-space sample constraints are converted into fresh surface geometry.
   These are inferred poses, not a recovered oscillation or numerical optimizer.
   No periodic motion is added to the cyan comparison. */
function surfacePointForScreen(target,camera,lift,hint){
 let best=hint.slice(),bestScore=Infinity;
 function score(x,z){const p=project(point(x,z,lift),camera);return (p[0]-target[0])**2+(p[1]-target[1])**2+.025*((x-hint[0])**2+(z-hint[1])**2)}
 for(let j=0;j<=28;j++)for(let i=0;i<=28;i++){
  const x=-1.72+3.44*i/28,z=-1.72+3.44*j/28,s=score(x,z);
  if(s<bestScore){bestScore=s;best=[x,z]}
 }
 let x=best[0],z=best[1];
 for(let iteration=0;iteration<14;iteration++){
  const p=project(point(x,z,lift),camera),e=.0005,px=project(point(x+e,z,lift),camera),pz=project(point(x,z+e,lift),camera);
  const a=(px[0]-p[0])/e,b=(pz[0]-p[0])/e,c=(px[1]-p[1])/e,d=(pz[1]-p[1])/e,det=a*d-b*c;
  if(Math.abs(det)<1e-6)break;
  const ex=p[0]-target[0],ey=p[1]-target[1];
  x=clamp(x-clamp((d*ex-b*ey)/det,-.15,.15),-1.74,1.74);
  z=clamp(z-clamp((-c*ex+a*ey)/det,-.15,.15),-1.74,1.74);
  const s=score(x,z);if(s<bestScore){bestScore=s;best=[x,z]}

}
const rateSpecs={
 white:{radius:.057,lift:.053,color:whiteRGB,hint:[-.82,1.1],samples:[[35,155,864],[36,160,866],[37,171,865],[38,182,865],[39,194,866],[40,202,864],[41,209,865],[42,215,862]]},
 orange:{radius:.087,lift:.080,color:orangeRGB,hint:[.52,.17],samples:[[34,151,842],[35,160,829],[36,274,811],[37,493,858],[38,492,858],[39,489,857],[40,487,858],[41,486,857],[42,486,857]]},
 cyan:{radius:.052,lift:.050,color:cyanRGB,hint:[.35,.04],samples:[[35.4,296,821],[36,404,715],[37,445,741],[38,426,658],[39,424,716],[40,410,690],[41,413,669],[42,403,710]]}
};
for(const spec of Object.values(rateSpecs)){
 spec.keys=spec.samples.map(s=>{
  const hint=spec===rateSpecs.orange&&s[0]<36.5?[-.80,1.0]:spec.hint;
  const p=surfacePointForScreen([s[1],s[2]],poseAt(s[0]),spec.lift,hint);
  return [s[0],p[0],p[1]];

}
function ratePoint(spec,t,lift=spec.lift){
 let a=spec.keys[0],b=a;
 for(let i=1;i<spec.keys.length;i++){b=spec.keys[i];if(t<=b[0])break;a=b}

}
function rateTrail(spec,t,from,interval,radius,opacity){

}
function completedRoute(opacity=1){for(let i=1;i<=30;i++)sphere(route(routeAmount(i/30),.026),.024,orangeRGB,opacity)}
function renderTerrain(t,camera){
 gl.viewport(0,0,WIDTH,HEIGHT);gl.clearColor(0,0,0,0);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);
 gl.enable(gl.DEPTH_TEST);gl.depthFunc(gl.LEQUAL);gl.depthMask(true);gl.disable(gl.CULL_FACE);
 gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.useProgram(program);
 gl.uniform1f(U.Yaw,camera.yaw);gl.uniform1f(U.ScaleX,camera.sx);gl.uniform1f(U.DepthScale,camera.depthScale);gl.uniform1f(U.HeightScale,camera.heightScale);gl.uniform1f(U.Perspective,camera.perspective);
 gl.uniform2f(U.Origin,camera.cx,camera.cy);gl.uniform1f(U.Brightness,camera.brightness);gl.uniform1f(U.Opacity,1);
 gl.uniform1f(U.Mode,0);bind(terrainMesh);gl.drawElements(gl.TRIANGLES,terrainMesh.count,gl.UNSIGNED_SHORT,0);

 else if(t<33.55){
  const state=descentState(t),p=routeAmount(state.progress);
  for(let i=1;i<=30;i++)if(i/30<=state.progress)sphere(route(routeAmount(i/30),.025),.024,orangeRGB);
  sphere(route(p,.061),.060,whiteRGB);

  const alpha=appear(t,33.6,.35)*(1-ramp(t,43.55,43.85));

  rateTrail(orange,t,34,.22,.023,alpha);sphere(ratePoint(orange,t),orange.radius,orange.color,alpha);
  if(t>=35){rateTrail(white,t,35,.8,.017,alpha);sphere(ratePoint(white,t),white.radius,white.color,alpha)}
  if(t>=35.4){rateTrail(cyan,t,Math.max(35.4,t-2.1),.29,.016,alpha);sphere(ratePoint(cyan,t),cyan.radius,cyan.color,alpha)}

 /* All arrows are actual depth-tested geometry, including the final arrow.
    The near wall and foreground rim naturally mask the endpoint and arrow. */

  const a=envelope(t,16.9,19.75,.2),p=route(0,.065);
  worldArrow([p[0]-.025,p[1]+.045,p[2]-.025],[p[0]-.10,p[1]+.36,p[2]-.22],cyanRGB,a,.040);
  worldArrow(route(.035,.055),route(.17,.045),orangeRGB,a*appear(t,18.5,.3),.042);
 }

  const state=descentState(t),p=routeAmount(state.progress);

}

function layer(alpha,fn){if(alpha<=0)return;ink.save();ink.globalAlpha*=clamp(alpha);fn();ink.restore()}
function roundedRect(x,y,w,h,r){ink.beginPath();ink.moveTo(x+r,y);ink.arcTo(x+w,y,x+w,y+h,r);ink.arcTo(x+w,y+h,x,y+h,r);ink.arcTo(x,y+h,x,y,r);ink.arcTo(x,y,x+w,y,r);ink.closePath()}
function pill(label,x,y,color,size=18){
 ink.font=`${size}px sans-serif`;const width=ink.measureText(label).width+20;
 roundedRect(x,y,width,32,12);ink.fillStyle='rgba(19,27,29,.85)';ink.fill();ink.strokeStyle=color;ink.lineWidth=1.2;ink.stroke();text(label,x+10,y+6,size,WHITE);return width;
}

 layer(envelope(t,10.55,16.85,.35),()=>{

 });

/* Shape-preserving cubic interpolation keeps the sampled loss values and
   removes angular joints without adding overshoot or a negative loss. */
const lossNodes=[[0,3.1],[2/30,2.48],[4/30,1.43],[7/30,1.09],[10/30,.89],[13/30,.62],[16/30,.28],[19/30,.07],[22/30,.02],[24/30,0],[1,0]];
const lossSecants=lossNodes.slice(0,-1).map((a,i)=>(lossNodes[i+1][1]-a[1])/(lossNodes[i+1][0]-a[0]));
const lossTangents=lossNodes.map((a,i)=>{
 if(i===0)return lossSecants[0];if(i===lossNodes.length-1)return 0;
 const left=lossSecants[i-1],right=lossSecants[i];if(left*right<=0)return 0;
 const h0=a[0]-lossNodes[i-1][0],h1=lossNodes[i+1][0]-a[0],w0=2*h1+h0,w1=h1+2*h0;
 return (w0+w1)/(w0/left+w1/right);
});
function lossValue(u){
 u=clamp(u);let i=0;while(i<lossNodes.length-2&&u>lossNodes[i+1][0])i++;
 const a=lossNodes[i],b=lossNodes[i+1],h=b[0]-a[0],s=clamp((u-a[0])/h),s2=s*s,s3=s2*s;
 return Math.max(0,(2*s3-3*s2+1)*a[1]+(s3-2*s2+s)*h*lossTangents[i]+(-2*s3+3*s2)*b[1]+(s3-s2)*h*lossTangents[i+1]);
}
function chart(progress){
 const x=73,y=953,w=574,h=90;
 ink.strokeStyle='rgba(172,186,185,.25)';ink.lineWidth=1;ink.beginPath();ink.moveTo(x,y+h);ink.lineTo(x+w,y+h);ink.stroke();
 const g=ink.createLinearGradient(x,0,x+w,0);g.addColorStop(0,ORANGE);g.addColorStop(.62,'#e68565');g.addColorStop(.86,'#b9bca9');g.addColorStop(1,CYAN);
 ink.strokeStyle=g;ink.lineWidth=3;ink.lineJoin='round';ink.lineCap='round';ink.beginPath();
 for(let i=0;i<=280;i++){const u=progress*i/280,px=x+w*u,py=y+h-h*lossValue(u)/3.1;i?ink.lineTo(px,py):ink.moveTo(px,py)}ink.stroke();
}
function descentText(t){
 layer(envelope(t,16.75,32.95,.3),()=>{
  fitted('Follow the slope downhill.',73,162,52,574);
  layer(appear(t,17.45),()=>text('θ ← θ − η ∇L(θ)',73,250,41,WHITE,'serif',48,'italic'));
  layer(envelope(t,16.9,19.75,.2),()=>{
   layer(appear(t,17.6),()=>{pill('Cyan arrow: + gradient, uphill',73,927,CYAN);text(['The gradient points uphill, toward more','error. So step the other way.'],73,1091,28,WHITE,'sans-serif',36)});
   layer(appear(t,18.5),()=>pill('Orange arrow: − gradient, downhill',73,983,ORANGE));
  });
  layer(appear(t,19.65,.25),()=>{
   const state=descentState(t);
   text('Step '+state.step+' of 30',73,913,25,GRAY);
   ink.font='500 25px sans-serif';ink.fillStyle=WHITE;ink.textAlign='right';ink.fillText('Loss '+state.loss,647,913);ink.textAlign='left';
   chart(state.progress);
   if(t<25.8)text(['Each step: measure the slope, move a little','downhill, repeat.'],73,1099,28,WHITE,'sans-serif',36);
   else if(t<30.7)text(['Steps shrink on their own as the ground','flattens out.'],73,1099,28,WHITE,'sans-serif',36);
   else text(['Trough reached. Lowest loss, trained','model.'],73,1099,28,ORANGE,'sans-serif',36);
  });
 });
}

function draw(t){

}

const time={value:0};
const timeline=gsap.timeline({paused:true});
timeline.to(time,{value:DURATION,duration:DURATION,ease:'none',onUpdate:()=>draw(time.value)},0);
