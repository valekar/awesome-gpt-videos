 {t:9.5,yaw:.43,elev:.55,scale:190,cx:360,cy:790,brightness:.20},

 {t:16.5,yaw:.04,elev:.55,scale:205,cx:360,cy:715,brightness:1},
 {t:17.1,yaw:-.10,elev:.55,scale:208,cx:360,cy:684,brightness:1},
 {t:20,yaw:-.18,elev:.55,scale:210,cx:360,cy:680,brightness:1},
 {t:30,yaw:-.36,elev:.54,scale:210,cx:360,cy:678,brightness:1},
 {t:33,yaw:-.40,elev:.54,scale:210,cx:360,cy:678,brightness:1},
 {t:34,yaw:-.25,elev:.48,scale:253,cx:280,cy:682,brightness:1},

 {t:43.4,yaw:-.58,elev:.43,scale:203,cx:352,cy:734,brightness:1},
 {t:44.3,yaw:-.59,elev:.43,scale:179,cx:360,cy:778,brightness:.19},

function poseAt(t){

 for(let i=1;i<poseKeys.length;i++){b=poseKeys[i];if(t<=b.t)break;a=b}

}
function project(p,camera){

const vertexSource=`
attribute vec3 aPosition;
attribute vec3 aNormal;
uniform float uYaw;
uniform float uElevation;
uniform float uScale;
uniform vec2 uOrigin;
uniform float uRadius;
uniform vec3 uCenter;
uniform float uMode;
varying vec3 vPosition;
varying vec3 vNormal;
void main(){
 vec3 p=aPosition;
 if(uMode>0.5)p=p*uRadius+uCenter;
 vPosition=p;vNormal=aNormal;
 float c=cos(uYaw),s=sin(uYaw),e=sin(uElevation),f=cos(uElevation);
 float lateral=c*p.x-s*p.z;
 float forward=s*p.x+c*p.z;
 float py=e*forward-f*p.y;
 float depth=f*forward+e*p.y;
 vec2 screen=uOrigin+uScale*vec2(lateral,py);
 gl_Position=vec4(screen.x/360.0-1.0,1.0-screen.y/640.0,-depth*.10,1.0);
}`;
const fragmentSource=`
precision highp float;
varying vec3 vPosition;
varying vec3 vNormal;
uniform float uMode;
uniform vec3 uColor;
uniform float uBrightness;
void main(){
 vec3 n=normalize(vNormal);
 vec3 light=normalize(vec3(-.35,1.0,.5));
 float diffuse=.66+.34*max(dot(n,light),0.0);
 vec3 color;
 if(uMode<.5){
  vec2 crest=vPosition.xz-vec2(-.90,-.75);
  vec2 trough=vPosition.xz-vec2(.60,.35);
  float hot=exp(-dot(crest,crest)/.47);
  float cool=exp(-dot(trough,trough)/.30);
  float rim=pow(clamp(max(abs(vPosition.x),abs(vPosition.z))/1.8,0.0,1.0),5.0);
  color=mix(vec3(.46,.49,.50),vec3(.77,.43,.36),rim*.65);
  color=mix(color,vec3(1.0,.30,.075),hot*.97);
  color=mix(color,vec3(.12,.95,.91),cool*.98);
  float gx=pow(abs(cos(vPosition.x*42.0)),28.0);
  float gz=pow(abs(cos(vPosition.z*42.0)),28.0);
  color*=diffuse;
  color+=vec3(.035)*max(gx,gz)*(1.0-hot*.65);
  color+=vec3(.0,.13,.12)*cool;
 }else{
  color=uColor*diffuse;

  color+=vec3(.30)*shine;

function shader(type,source){const s=gl.createShader(type);gl.shaderSource(s,source);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw new Error(gl.getShaderInfoLog(s));return s}

function geometry(positions,normals,indices){

}
function terrainGeometry(){
 const p=[],n=[],indices=[],N=140;
 for(let j=0;j<=N;j++)for(let i=0;i<=N;i++){
  const x=-1.8+3.6*i/N,z=-1.8+3.6*j/N,e=.002;
  const dx=(heightAt(x+e,z)-heightAt(x-e,z))/(2*e),dz=(heightAt(x,z+e)-heightAt(x,z-e))/(2*e),d=Math.hypot(dx,1,dz);

 }

}
function sphereGeometry(){
 const p=[],n=[],indices=[],rows=14,cols=24;
 for(let j=0;j<=rows;j++)for(let i=0;i<=cols;i++){
  const a=Math.PI*j/rows,b=2*Math.PI*i/cols,x=Math.sin(a)*Math.cos(b),y=Math.cos(a),z=Math.sin(a)*Math.sin(b);
  p.push(x,y,z);n.push(x,y,z);

}
const terrainMesh=terrainGeometry(),sphereMesh=sphereGeometry();
function bind(mesh){
 gl.bindBuffer(gl.ARRAY_BUFFER,mesh.positions);gl.enableVertexAttribArray(positionLocation);gl.vertexAttribPointer(positionLocation,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ARRAY_BUFFER,mesh.normals);gl.enableVertexAttribArray(normalLocation);gl.vertexAttribPointer(normalLocation,3,gl.FLOAT,false,0,0);
 gl.bindBuffer(gl.ELEMENT_ARRAY_BUFFER,mesh.indices);
}
function sphere(p,r,color){gl.uniform1f(U.Mode,1);gl.uniform1f(U.Radius,r);gl.uniform3fv(U.Center,p);gl.uniform3fv(U.Color,color);gl.drawElements(gl.TRIANGLES,sphereMesh.count,gl.UNSIGNED_SHORT,0)}
const orangeRGB=[1,.31,.07],cyanRGB=[.13,.92,.88],whiteRGB=[.98,1,.99];
function route(u,lift=.025){u=clamp(u);return point(mix(-.9,.60,u),mix(-.75,.35,u)+.13*Math.sin(Math.PI*u),lift)}
const readouts=[
 [19.7,2,'2.48'],[21,4,'1.43'],[22,7,'1.09'],[23,10,'0.89'],[24,13,'0.62'],[25,16,'0.28'],[26,19,'0.07'],[27,22,'0.02'],[28,24,'0.00'],[28.67,26,'0.00'],[29,27,'0.00'],[30,30,'0.00']
];
function descentState(t){
 let index=0;for(let i=0;i<readouts.length;i++)if(t>=readouts[i][0])index=i;
 const a=readouts[index],b=readouts[Math.min(index+1,readouts.length-1)];

function routeAmount(stepFraction){return 1-Math.pow(1-clamp(stepFraction),2.25)}

 [39,.57,.14,.16],[40,.55,.25,.31],[41,.51,.04,.40],[42,.54,.13,.17],[43.5,.56,.23,.11]
];
function cyanPosition(t){
 let a=cyanKeys[0],b=a;for(let i=1;i<cyanKeys.length;i++){b=cyanKeys[i];if(t<=b[0])break;a=b}

function renderTerrain(t,camera){

 gl.useProgram(program);gl.uniform1f(U.Yaw,camera.yaw);gl.uniform1f(U.Elevation,camera.elev);gl.uniform1f(U.Scale,camera.scale);gl.uniform2f(U.Origin,camera.cx,camera.cy);gl.uniform1f(U.Brightness,camera.brightness);

   const current=cyanPosition(t);

function background(){

 g=bg.createLinearGradient(0,0,650,1200);g.addColorStop(0,'rgba(0,0,0,0)');g.addColorStop(1,'rgba(0,0,0,.25)');bg.fillStyle=g;bg.fillRect(0,0,WIDTH,HEIGHT);

function text(lines,x,y,size=28,color=WHITE,family='sans-serif',lineHeight=size*1.28,style=''){

function fitted(line,x,y,size,maxWidth,color=WHITE,family='serif',style=''){

function layer(alpha,fn){if(alpha<=0)return;ctx.save();ctx.globalAlpha=clamp(alpha);fn();ctx.restore()}
function roundedRect(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}

 roundedRect(x,y,width,32,12);ctx.fillStyle='rgba(19,27,29,.88)';ctx.fill();ctx.strokeStyle=color;ctx.lineWidth=1.3;ctx.stroke();text(label,x+10,y+6,size,WHITE);return width;

function landscape(t,camera){

function lossValue(u){

function chart(progress){

 ctx.strokeStyle='rgba(172,186,185,.25)';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(x,y+h);ctx.lineTo(x+w,y+h);ctx.stroke();

function descent(t,camera){

  const peak=project(route(0,.07),camera);
  layer(envelope(t,16.9,19.75,.2),()=>{
   arrow(peak[0]-10,peak[1]-8,peak[0]-34,peak[1]-88,CYAN);
   layer(appear(t,17.6),()=>{pill('Cyan arrow: + gradient, uphill',73,927,CYAN);text(['The gradient points uphill, toward more','error. So step the other way.'],73,1091,28,WHITE,'sans-serif',36)});
   layer(appear(t,18.5),()=>{arrow(peak[0]+12,peak[1]+22,peak[0]+37,peak[1]+92,ORANGE);pill('Orange arrow: − gradient, downhill',73,983,ORANGE)});
  });
  layer(appear(t,19.65,.25),()=>{
   const state=descentState(t),p=routeAmount(state.progress),ball=project(route(p,.06),camera);
   if(p<.985){const next=project(route(Math.min(1,p+.07),.025),camera);const dx=next[0]-ball[0],dy=next[1]-ball[1],d=Math.hypot(dx,dy)||1;arrow(ball[0]+dx/d*26,ball[1]+dy/d*26,ball[0]+dx/d*61,ball[1]+dy/d*61,ORANGE)}
   text('Step '+state.step+' of 30',73,913,25,GRAY);
   ctx.font='bold 25px sans-serif';ctx.fillStyle=WHITE;ctx.textAlign='right';ctx.fillText('Loss '+state.loss,647,913);ctx.textAlign='left';
   chart(state.progress);
   if(t<25.8)text(['Each step: measure the slope, move a little','downhill, repeat.'],73,1099,28,WHITE,'sans-serif',36);
   else if(t<30.7)text(['Steps shrink on their own as the ground','flattens out.'],73,1099,28,WHITE,'sans-serif',36);
   else text(['Trough reached. Lowest loss, trained','model.'],73,1099,28,ORANGE,'sans-serif',36);
  });
 });
}
function learningRate(t){
 layer(envelope(t,33.65,43.85,.35),()=>{
  fitted('The learning rate, η',73,162,52,574);
  text('Same start. Only the step size changes.',73,247,27,GRAY);
  const rows=[['η = 0.05','too small: crawls',WHITE,34.65],['η = 1.30','too large: zig-zags',CYAN,35.05],['η = 0.60','just right',ORANGE,35.45]];
  for(let i=0;i<rows.length;i++){
   const row=rows[i];layer(appear(t,row[3]),()=>{const y=1002+i*51;ctx.fillStyle=row[2];ctx.beginPath();ctx.arc(84,y+12,10,0,Math.PI*2);ctx.fill();text(row[0],108,y,24,WHITE);text(row[1],260,y,24,i===0?GRAY:row[2])});
  }
  layer(appear(t,41.65),()=>text(['Tuning η is half the craft of training a','model.'],73,1180,28,WHITE,'sans-serif',35));
 });
}
const useCases=[
 ['Deep neural networks',['Backpropagation computes the gradient; SGD or Adam','takes the step.'],ORANGE,44.5],
 ['Large language models',['Billions of parameters, all tuned by the same descent.'],CYAN,44.8],
 ['Regression at scale',['Linear and logistic models on data too large for','closed-form solutions.'],ORANGE,45.35],
 ['Recommender systems',['Matrix factorisation learns user and item vectors.'],CYAN,45.7],
 ['Vision and speech',['Image classifiers, detectors and speech recognisers.'],ORANGE,46.05],
 ['Embeddings',['word2vec vectors and t-SNE maps.'],CYAN,46.45]
];
function uses(t){
 layer(envelope(t,43.85,50.8,.35),()=>{
  text('Where it runs',73,162,52,WHITE,'serif');
  for(let i=0;i<useCases.length;i++){let row=useCases[i];layer(appear(t,row[3]),()=>accentEntry(row[0],row[1],73,292+i*118,row[2],31,20))}
  layer(appear(t,46.9,.7),()=>text(['Common variants: batch, stochastic (SGD),','mini-batch, momentum, Adam.'],73,1092,25,GRAY,'sans-serif',34));
 });
}
function conclusion(t){
 layer(appear(t,50.8,.45),()=>{
  fitted('So why am I learning this?',73,162,52,574);
  layer(appear(t,51.55,.45),()=>{
   const g=ctx.createLinearGradient(73,0,637,0);g.addColorStop(0,ORANGE);g.addColorStop(.45,'#e18460');g.addColorStop(.7,'#a8b4a0');g.addColorStop(1,CYAN);
   fitted('Every model you train is a ball',73,262,41,574,g,'serif','italic');
   text('rolling downhill.',73,312,41,ORANGE,'serif',50,'italic');
  });
  layer(appear(t,52.55,.45),()=>text(['Loss is the hill. The gradient is the slope. η is','the stride.'],73,387,28,GRAY,'sans-serif',36));
 });
}
function progress(t){
 ctx.fillStyle='rgba(179,196,190,.21)';ctx.fillRect(0,1274,720,6);
 const g=ctx.createLinearGradient(0,0,720,0);g.addColorStop(0,ORANGE);g.addColorStop(.49,'#ed896a');g.addColorStop(.78,'#b5c6b6');g.addColorStop(1,CYAN);ctx.fillStyle=g;ctx.fillRect(0,1274,720*clamp(t/DURATION),6);
}
function draw(t){
 t=clamp(t,0,DURATION);const camera=poseAt(t);renderTerrain(t,camera);ctx.clearRect(0,0,WIDTH,HEIGHT);
 header(t);opening(t);classification(t);landscape(t,camera);descent(t,camera);learningRate(t);uses(t);conclusion(t);progress(t);
}
background();
const time={value:0};
const timeline=gsap.timeline({paused:true});
timeline.to(time,{value:DURATION,duration:DURATION,ease:'none',onUpdate:()=>draw(time.value)},0);
draw(0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
</script>
