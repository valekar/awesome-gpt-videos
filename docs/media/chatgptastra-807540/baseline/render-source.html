<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>让想象动起来</title>
<style>
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#edeae3}body{font-family:sans-serif}#root{position:relative;width:100%;height:100%;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="15">
<canvas id="art" class="clip" data-start="0" data-duration="15" width="1920" height="1080" aria-label="十五秒抽象动态图形：从秩序到自由，让节奏看得见，让想象动起来。"></canvas>
</div>
<script src="gsap.min.js"></script>
<script>
/* EDITABLE DIRECTION: colors, typography, copy, geometry and scene timing. */
const W=1920,H=1080,TAU=Math.PI*2;
const canvas=document.getElementById('art');
const ctx=canvas.getContext('2d');
const scenes=[
 {start:0,bg:'#edeae3',ink:'#202321',muted:'#72746c',accent:'#e95740',lines:['从秩序','到自由。'],caption:'形态有序，灵感无界。',material:[[35,40,36],[242,105,76]],radius:302},
 {start:4.65,bg:'#191d25',ink:'#efeee8',muted:'#a5a8b5',accent:'#c9b5ff',lines:['让节奏','看得见。'],caption:'每一次变化，都有自己的节拍。',material:[[106,96,189],[218,202,255]],radius:310},
 {start:9.65,bg:'#ed624c',ink:'#252823',muted:'#653e34',accent:'#faf0d9',lines:['让想象','动起来。'],caption:'把无限可能，变成此刻。',material:[[222,224,196],[255,248,222]],radius:318}
];
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const mix=(a,b,p)=>a+(b-a)*p;
const smooth=x=>{x=clamp(x);return x*x*(3-2*x)};
const out=x=>1-Math.pow(1-clamp(x),4);
const dot=(a,b)=>a[0]*b[0]+a[1]*b[1]+a[2]*b[2];
const cross=(a,b)=>[a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];
const norm=a=>{const l=Math.hypot(...a)||1;return a.map(v=>v/l)};
const light=norm([-0.65,-0.75,1.5]);
function rotate(p,ax,ay,az){
 let [x,y,z]=p;
 let c=Math.cos(ax),s=Math.sin(ax);[y,z]=[y*c-z*s,y*s+z*c];
 c=Math.cos(ay);s=Math.sin(ay);[x,z]=[x*c+z*s,-x*s+z*c];
 c=Math.cos(az);s=Math.sin(az);return [x*c-y*s,x*s+y*c,z];
}
function center(u,mode,local){
 if(mode===0){const r=.95+.28*Math.cos(3*u);return [r*Math.cos(2*u),r*Math.sin(2*u),.34*Math.sin(3*u)]}
 if(mode===1){const r=1+.10*Math.cos(3*u+local*.23);return [r*Math.cos(u),r*Math.sin(u),.35*Math.sin(3*u)]}
 return [1.02*Math.cos(u),1.02*Math.sin(u),.075*Math.sin(4*u)];
}
function surface(u,v,mode,local){
 const c=center(u,mode,local),a=center(u-.001,mode,local),b=center(u+.001,mode,local);
 const tangent=norm(b.map((x,i)=>x-a[i]));
 const radial=norm([c[0],c[1],0]);
 const binormal=norm(cross(tangent,radial));
 const normal=norm(cross(binormal,tangent));
 const twist=mode===2?u*2+local*.08:u*.5;
 const q=v+twist;
 const thickness=mode===0?.145:mode===1?.225:.29;
 const flatten=mode===2?.56:mode===1?.64:1;
 return c.map((x,i)=>x+thickness*(normal[i]*Math.cos(q)+binormal[i]*Math.sin(q)*flatten));
}
/* A fixed procedural grain texture; no network assets or random runtime state. */
const grain=document.createElement('canvas');grain.width=320;grain.height=180;
const gx=grain.getContext('2d'),pixels=gx.createImageData(320,180);
let seed=92761;
for(let i=0;i<pixels.data.length;i+=4){
 seed=(Math.imul(seed,1664525)+1013904223)>>>0;
 const value=(seed>>>24)>127?255:0;
 pixels.data[i]=pixels.data[i+1]=pixels.data[i+2]=value;pixels.data[i+3]=7;
}
gx.putImageData(pixels,0,0);
const grainPattern=ctx.createPattern(grain,'repeat');
function sculpture(mode,local,scene){
 const entrance=out(local/1.55);
 const ending=mode===2?smooth((local-3.4)/1.5):0;
 const ax=mode===0?.38+local*.11:mode===1?.62+local*.085:.56+local*.035*(1-ending);
 const ay=mode===0?-.48+local*.18:mode===1?-.38+local*.12:-.18+local*.04*(1-ending);
 const az=mode===0?-.3+local*.065:mode===1?-.48+local*.045:-.46;
 const size=scene.radius*mix(.76,1,entrance);
 const cx=1372+38*(1-entrance),cy=552+28*Math.sin(local*.48)*Math.sin(Math.PI*clamp(local/5));
 const N=168,M=16;
 const points=[];
 for(let i=0;i<N;i++){
  const row=[];
  for(let j=0;j<M;j++){
   const p=rotate(surface(TAU*i/N,TAU*j/M,mode,local),ax,ay,az);
   const perspective=5.8/(5.8-p[2]);
   row.push({p,x:cx+p[0]*size*perspective,y:cy+p[1]*size*perspective});
  }
  points.push(row);
 }
 ctx.save();
 ctx.globalAlpha=.15*entrance;
 ctx.filter='blur(25px)';ctx.fillStyle=mode===1?'#03050c':'#3c3527';
 ctx.beginPath();ctx.ellipse(cx,956,260,22,0,0,TAU);ctx.fill();ctx.filter='none';ctx.restore();
 const faces=[];
 for(let i=0;i<N;i++)for(let j=0;j<M;j++){
  const a=points[i][j],b=points[(i+1)%N][j],c=points[(i+1)%N][(j+1)%M],d=points[i][(j+1)%M];
  const ab=b.p.map((x,k)=>x-a.p[k]),ad=d.p.map((x,k)=>x-a.p[k]);
  const normal=norm(cross(ab,ad));
  const illumination=Math.abs(dot(normal,light));
  const specular=Math.pow(Math.max(0,Math.abs(dot(normal,norm([-.3,-.6,1])))),18);
  let stripe;
  if(mode===0)stripe=smooth((Math.sin(TAU*i/N*3+.8)-.12)/.25);
  else if(mode===1)stripe=.44+.44*Math.sin(TAU*j/M+TAU*i/N*2);
  else stripe=.6+.3*Math.sin(TAU*j/M+TAU*i/N*2);
  const shade=.44+.55*illumination;
  const rgb=scene.material[0].map((x,k)=>Math.round(clamp(mix(x,scene.material[1][k],stripe)*shade+specular*63,0,255)));
  faces.push({corners:[a,b,c,d],depth:(a.p[2]+b.p[2]+c.p[2]+d.p[2])/4,color:`rgb(${rgb.join(',')})`});
 }
 faces.sort((a,b)=>a.depth-b.depth);
 ctx.save();ctx.lineWidth=.65;ctx.lineJoin='round';
 for(const face of faces){
  const p=face.corners;ctx.beginPath();ctx.moveTo(p[0].x,p[0].y);
  for(let k=1;k<4;k++)ctx.lineTo(p[k].x,p[k].y);
  ctx.closePath();ctx.fillStyle=face.color;ctx.strokeStyle=face.color;ctx.fill();ctx.stroke();
 }
 ctx.restore();
}
function typeLine(text,x,y,size,color,p){
 ctx.save();ctx.beginPath();ctx.rect(x-3,y-size-22,760,size+58);ctx.clip();
 ctx.fillStyle=color;ctx.font=`700 ${size}px sans-serif`;ctx.textBaseline='alphabetic';
 ctx.fillText(text,x,y+(1-out(p))*(size+42));ctx.restore();
}
function scene(mode,t){
 const s=scenes[mode],local=Math.max(0,t-s.start);
 ctx.fillStyle=s.bg;ctx.fillRect(0,0,W,H);
 /* Sparse circular construction lines belong to the sculpture. */
 const emerge=out(local/1.6);
 ctx.save();ctx.strokeStyle=s.ink;ctx.globalAlpha=.10*emerge;ctx.lineWidth=1.2;
 ctx.beginPath();ctx.arc(1372,552,435,0,TAU);ctx.stroke();
 ctx.globalAlpha=.07*emerge;
 ctx.beginPath();ctx.ellipse(1372,552,470,178,-.52,0,TAU);ctx.stroke();
 ctx.restore();
 sculpture(mode,local,s);
 /* Opening mark and two independently masked text reveals. */
 const mark=out((local-.10)/.8);
 ctx.fillStyle=s.accent;ctx.fillRect(128,211,82*mark,9);
 ctx.beginPath();ctx.arc(239,215.5,4.5*mark,0,TAU);ctx.fill();
 typeLine(s.lines[0],118,440,166,s.ink,(local-.22)/1.05);
 typeLine(s.lines[1],118,636,166,s.ink,(local-.40)/1.05);
 ctx.save();ctx.globalAlpha=out((local-.95)/.8);ctx.fillStyle=s.muted;
 ctx.font='400 31px sans-serif';ctx.textBaseline='alphabetic';
 ctx.fillText(s.caption,128,756+18*(1-out((local-.95)/.8)));ctx.restore();
 /* A restrained rule expands from the same typographic origin. */
 ctx.save();ctx.globalAlpha=.22;ctx.fillStyle=s.ink;
 ctx.fillRect(128,842,556*out((local-1.05)/1.2),1.3);ctx.restore();
 /* One satellite traces the orbit; it settles during the final hold. */
 const settle=mode===2?smooth((local-3.1)/1.3):0;
 const angle=-1.15+local*.24*(1-settle)+1.02*settle;
 const px=1372+435*Math.cos(angle),py=552+435*Math.sin(angle);
 ctx.save();ctx.globalAlpha=emerge;ctx.fillStyle=s.accent;
 ctx.beginPath();ctx.arc(px,py,mode===1?10:8,0,TAU);ctx.fill();ctx.restore();
}
function revealScene(mode,t,progress){
 ctx.save();ctx.beginPath();ctx.rect(W*(1-progress),0,W*progress,H);ctx.clip();scene(mode,t);ctx.restore();
}
function draw(t){
 t=clamp(t,0,15);ctx.clearRect(0,0,W,H);
 if(t<4.65)scene(0,t);
 else if(t<5.42){scene(0,t);revealScene(1,t,smooth((t-4.65)/.77))}
 else if(t<9.65)scene(1,t);
 else if(t<10.42){scene(1,t);revealScene(2,t,smooth((t-9.65)/.77))}
 else scene(2,t);
 ctx.save();ctx.fillStyle=grainPattern;ctx.fillRect(0,0,W,H);ctx.restore();
}
const playhead={t:0};
const timeline=gsap.timeline({paused:true});
timeline.to(playhead,{t:15,duration:15,ease:'none',onUpdate:()=>draw(playhead.t)},0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
draw(0);
</script>
</body>
</html>
