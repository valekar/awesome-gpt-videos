<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Brieform — 30-second presentation</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f5f3eb}*{box-sizing:border-box}#root{position:relative;width:100%;height:100%;overflow:hidden;background:#f5f3eb}.clip{position:absolute;inset:0;width:100%;height:100%}svg{display:block;width:100%;height:100%;font-family:Arial,Helvetica,sans-serif}text{fill:#18292b}.muted{fill:#667571}.blue{fill:#2858ed}.white{fill:#fff}.headline{font-weight:700;letter-spacing:-6px}.small{font-size:27px}.label{font-size:30px;font-weight:600}.body{font-size:37px}.hairline{stroke:#d8dfd7;stroke-width:2}.scene{opacity:0}.card{fill:#fff;stroke:#dce1d9;stroke-width:2}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="30">
<div class="clip" data-start="0" data-duration="30">
<svg viewBox="0 0 1920 1080" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Brieform presentation: describe a form in your AI, share the published form, and read responses in the conversation.">
<defs>
 <pattern id="dots" width="34" height="34" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.3" fill="#b7c3b7" opacity=".42"/></pattern>
 <filter id="shadow" x="-30%" y="-30%" width="160%" height="180%"><feDropShadow dx="0" dy="22" stdDeviation="25" flood-color="#203932" flood-opacity=".09"/></filter>
 <clipPath id="prompt-mask"><rect id="prompt-reveal" x="154" y="492" width="0" height="120"/></clipPath>
 <clipPath id="hero-mask"><rect x="100" y="265" width="1110" height="360"/></clipPath>
 <marker id="arrow" markerWidth="12" markerHeight="12" refX="7" refY="5" orient="auto"><path d="M1 1 L7 5 L1 9" fill="none" stroke="#2858ed" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></marker>
</defs>
<rect width="1920" height="1080" fill="#f5f3eb"/>
<rect id="texture" x="1030" y="0" width="890" height="1080" fill="url(#dots)"/>
<circle id="ambient" cx="1770" cy="900" r="390" fill="#e5ebd9"/>
<path id="ambient-line" d="M1550 -120 C1100 150 1820 540 1450 1180" fill="none" stroke="#dce4d5" stroke-width="2"/>
<g id="brand"><text x="114" y="115" font-size="43" font-weight="700" letter-spacing="-2">Brieform<tspan fill="#2858ed">.</tspan></text></g>

<!-- Opening: a sentence becomes an organized form. -->
<g id="s1" class="scene">
 <g clip-path="url(#hero-mask)"><g id="hero-title"><text x="110" y="397" font-size="125" class="headline">Forms built</text><text x="110" y="540" font-size="125" class="headline">in conversation.</text></g></g>
 <text id="hero-sub" x="117" y="650" font-size="37" class="muted">Meet the form builder inside your AI.</text>
 <g id="hero-pill"><rect x="116" y="737" width="434" height="72" rx="36" fill="#e4e9dc"/><circle cx="151" cy="773" r="7" fill="#2858ed"/><text x="175" y="783" class="small">Describe. Share. Read.</text></g>
 <g id="hero-art">
  <rect x="1247" y="268" width="475" height="567" rx="35" fill="#dfe6d2" transform="rotate(9 1484 551)"/>
  <rect x="1224" y="257" width="475" height="567" rx="35" fill="#dce5ff" transform="rotate(-7 1461 540)"/>
  <g filter="url(#shadow)"><rect x="1207" y="244" width="475" height="567" rx="35" class="card"/></g>
  <rect x="1248" y="293" width="61" height="61" rx="17" fill="#2858ed"/>
  <path d="M1265 313 H1292 M1265 326 H1285 M1265 339 H1292" stroke="white" stroke-width="4" stroke-linecap="round"/>
  <text x="1249" y="420" font-size="38" font-weight="700">Your next form</text>
  <g id="hero-fields"><rect x="1249" y="460" width="387" height="65" rx="12" fill="#f1f3ed"/><rect x="1249" y="548" width="387" height="65" rx="12" fill="#f1f3ed"/><rect x="1249" y="636" width="387" height="65" rx="12" fill="#f1f3ed"/></g>
  <rect x="1249" y="735" width="163" height="29" rx="14" fill="#2858ed"/>
 </g>
</g>

<!-- Describe: conceptual workflow artwork, not a product screenshot. -->
<g id="s2" class="scene">
 <g id="describe-copy"><text x="114" y="290" font-size="84" class="headline" letter-spacing="-4">Describe the form.</text><text x="118" y="365" class="body muted">In Claude, ChatGPT or Cursor.</text></g>
 <g id="prompt-card"><rect x="115" y="447" width="810" height="245" rx="28" fill="#18292b"/><text x="155" y="492" font-size="24" fill="#a8b9ac" style="fill:#a8b9ac">YOUR REQUEST</text><g clip-path="url(#prompt-mask)"><text x="155" y="551" font-size="40" class="white">Create a client intake form</text><text x="155" y="609" font-size="40" class="white">with budget and timeline.</text></g><circle cx="870" cy="645" r="22" fill="#2858ed"/><path d="M870 654 V636 M862 644 L870 636 L878 644" fill="none" stroke="white" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></g>
 <path id="build-link" d="M943 567 H1065" fill="none" stroke="#2858ed" stroke-width="3" marker-end="url(#arrow)"/>
 <g id="build-card" filter="url(#shadow)"><rect x="1108" y="227" width="680" height="652" rx="32" class="card"/>
  <text x="1157" y="307" font-size="43" font-weight="700">Client intake</text><text x="1157" y="350" font-size="26" class="muted">Tell us about your project.</text>
  <g class="build-field"><text x="1157" y="420" class="small">Full name</text><rect x="1157" y="442" width="582" height="64" rx="11" fill="#f4f5f0" stroke="#dce1d9"/></g>
  <g class="build-field"><text x="1157" y="556" class="small">Budget</text><rect x="1157" y="578" width="582" height="64" rx="11" fill="#f4f5f0" stroke="#dce1d9"/><path d="M1699 603 L1708 612 L1717 603" fill="none" stroke="#667571" stroke-width="2"/></g>
  <g class="build-field"><text x="1157" y="692" class="small">Timeline</text><rect x="1157" y="714" width="582" height="64" rx="11" fill="#f4f5f0" stroke="#dce1d9"/></g>
  <g id="ready"><circle cx="1171" cy="827" r="12" fill="#e4ecd7"/><path d="M1165 827 L1169 831 L1177 823" stroke="#3b693a" stroke-width="2" fill="none"/><text x="1197" y="836" font-size="25" class="muted">Built from your description</text></g>
 </g>
 <text id="describe-footer" x="118" y="808" font-size="32" class="muted">Your words become fields.</text>
</g>

<!-- Share: a real hosted web form, presented as a diagram. -->
<g id="s3" class="scene">
 <g id="share-copy"><text x="114" y="290" font-size="89" class="headline">Share a real form.</text><text x="119" y="366" class="body muted">One link. Ready for people to fill in.</text></g>
 <g id="share-url"><rect x="117" y="450" width="705" height="128" rx="26" fill="#2858ed"/><g transform="translate(160 492)" stroke="white" stroke-width="4" fill="none" stroke-linecap="round"><path d="M18 7 L25 0 A12 12 0 0 1 42 17 L34 25 M25 34 L17 42 A12 12 0 0 1 0 25 L7 18 M13 29 L29 13"/></g><text x="234" y="529" font-size="44" class="white" font-weight="600">Your published form</text></g>
 <g id="share-options"><text x="120" y="663" font-size="31" class="muted">Send the link</text><circle cx="371" cy="653" r="4" fill="#a8b3a4"/><text x="406" y="663" font-size="31" class="muted">Embed it</text><circle cx="597" cy="653" r="4" fill="#a8b3a4"/><text x="632" y="663" font-size="31" class="muted">Share a QR</text></g>
 <path id="share-link" d="M840 514 C1000 514 973 388 1122 388" fill="none" stroke="#2858ed" stroke-width="3" marker-end="url(#arrow)"/>
 <g id="public-form" filter="url(#shadow)"><rect x="1150" y="229" width="604" height="655" rx="34" class="card"/><rect x="1150" y="229" width="604" height="13" rx="6" fill="#2858ed"/><text x="1197" y="325" font-size="43" font-weight="700">Client intake</text><text x="1198" y="396" class="small">Full name</text><rect x="1198" y="419" width="508" height="71" rx="10" fill="#f4f5f0" stroke="#dce1d9"/><text x="1198" y="552" class="small">Work email</text><rect x="1198" y="575" width="508" height="71" rx="10" fill="#f4f5f0" stroke="#dce1d9"/><g id="submit-button"><rect x="1198" y="704" width="508" height="81" rx="13" fill="#2858ed"/><text x="1452" y="755" font-size="30" font-weight="600" text-anchor="middle" class="white">Submit</text></g></g>
 <g id="respondent-note"><circle cx="131" cy="790" r="13" fill="#e1ead3"/><path d="M125 790 L130 795 L139 784" fill="none" stroke="#40613a" stroke-width="2.5"/><text x="158" y="801" font-size="31">No AI account needed to respond.</text></g>
</g>

<!-- Read: responses return to the AI conversation. -->
<g id="s4" class="scene">
 <g id="read-copy"><text x="114" y="290" font-size="87" class="headline">Keep the conversation going.</text><text x="119" y="366" class="body muted">Ask your AI to read the responses.</text></g>
 <g id="response-papers"><rect x="142" y="500" width="340" height="330" rx="24" fill="#dfe6d2" transform="rotate(-8 312 665)"/><rect x="170" y="471" width="340" height="330" rx="24" fill="#dce5ff" transform="rotate(6 340 636)"/><rect x="193" y="487" width="340" height="330" rx="24" class="card"/><text x="228" y="549" font-size="31" font-weight="600">Responses</text><path d="M229 593 H486 M229 646 H486 M229 699 H413" stroke="#c8d1c3" stroke-width="13" stroke-linecap="round"/><circle cx="479" cy="772" r="23" fill="#e4ecd7"/><path d="M469 772 L477 780 L491 764" stroke="#4a6c3c" stroke-width="3" fill="none"/></g>
 <path id="return-link" d="M574 649 H866" stroke="#2858ed" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
 <g id="read-conversation"><rect x="916" y="454" width="865" height="159" rx="27" fill="#18292b"/><text x="962" y="519" font-size="36" class="white">Summarize the responses</text><text x="962" y="568" font-size="36" class="white">to my client intake form.</text><g id="read-answer"><rect x="916" y="640" width="865" height="182" rx="27" fill="#e2e9d9"/><circle cx="968" cy="695" r="12" fill="#2858ed"/><text x="1002" y="705" font-size="34" font-weight="600">Your answers, in the same chat.</text><text x="962" y="766" font-size="29" class="muted">Read submissions. Export as CSV.</text></g></g>
</g>

<!-- Brand close with a readable hold. -->
<g id="s5" class="scene">
 <rect id="final-panel" x="74" y="197" width="1772" height="786" rx="49" fill="#2858ed"/>
 <g id="final-copy"><text x="150" y="384" font-size="101" class="headline white">Your next form,</text><text x="150" y="503" font-size="101" class="headline white">starts with a sentence.</text><text x="156" y="594" font-size="36" fill="#dce5ff" style="fill:#dce5ff">Build, publish and read responses in your AI.</text></g>
 <g id="final-steps"><text x="158" y="714" font-size="29" fill="#dce5ff" style="fill:#dce5ff">Describe</text><path d="M303 704 H363 M355 696 L364 704 L355 712" stroke="#a9bdff" stroke-width="2" fill="none"/><text x="398" y="714" font-size="29" fill="#dce5ff" style="fill:#dce5ff">Share</text><path d="M516 704 H576 M568 696 L577 704 L568 712" stroke="#a9bdff" stroke-width="2" fill="none"/><text x="611" y="714" font-size="29" fill="#dce5ff" style="fill:#dce5ff">Read</text></g>
 <g id="cta"><rect x="153" y="790" width="427" height="105" rx="22" fill="#f5f3eb"/><text x="194" y="855" font-size="41" font-weight="600">brieform.app</text><path d="M508 842 H537 M526 830 L538 842 L526 854" stroke="#2858ed" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>
 <g id="final-symbol" transform="translate(1440 690)"><rect x="-25" y="-25" width="235" height="235" rx="39" fill="#3e6cf3" transform="rotate(12 92 92)"/><rect width="185" height="210" rx="28" fill="#f5f3eb"/><path d="M40 58 H143 M40 94 H143 M40 130 H108" stroke="#2858ed" stroke-width="12" stroke-linecap="round"/><circle cx="161" cy="183" r="43" fill="#dfeacb"/><path d="M142 183 L155 196 L181 168" stroke="#36572d" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g>
</g>
</svg>
</div>
</div>
<script src="gsap.min.js"></script>
<script>
(function(){
 'use strict';
 const tl=gsap.timeline({paused:true});
 // Every initial state and motion lives on this single seekable timeline.
 tl.set('.scene',{opacity:0},0)
   .set('#s1',{opacity:1},0)
   .fromTo('#hero-title',{y:200},{y:0,duration:1.05,ease:'power3.out'},0.1)
   .fromTo('#hero-sub',{opacity:0,y:25},{opacity:1,y:0,duration:.65},.65)
   .fromTo('#hero-pill',{opacity:0,y:18},{opacity:1,y:0,duration:.6},1.05)
   .fromTo('#hero-art',{opacity:0,y:80,rotation:5,svgOrigin:'1450 540'},{opacity:1,y:0,rotation:0,duration:1.1,ease:'power3.out'},.2)
   .fromTo('#hero-fields rect',{scaleX:.25,transformOrigin:'left center'},{scaleX:1,stagger:.12,duration:.7,ease:'power2.out'},1.05)
   .to('#hero-art',{y:-14,duration:2.2,ease:'sine.inOut'},2)
   .to('#s1',{opacity:0,y:-28,duration:.4,ease:'power2.in'},4.75)
   .fromTo('#s2',{opacity:0,y:35},{opacity:1,y:0,duration:.5,ease:'power2.out'},5.05)
   .fromTo('#prompt-card',{x:-40},{x:0,duration:.65,ease:'power3.out'},5.3)
   .fromTo('#prompt-reveal',{attr:{width:0}},{attr:{width:720},duration:1.5,ease:'none'},5.6)
   .fromTo('#build-link',{strokeDasharray:150,strokeDashoffset:150},{strokeDashoffset:0,duration:.45},7)
   .fromTo('#build-card',{opacity:0,y:35},{opacity:1,y:0,duration:.65,ease:'power3.out'},7.25)
   .fromTo('.build-field',{opacity:0,y:14},{opacity:1,y:0,stagger:.24,duration:.45},7.6)
   .fromTo('#ready',{opacity:0},{opacity:1,duration:.35},8.7)
   .fromTo('#describe-footer',{opacity:0,y:10},{opacity:1,y:0,duration:.5},8.7)
   .to('#s2',{opacity:0,y:-28,duration:.4},11.05)
   .fromTo('#s3',{opacity:0,y:30},{opacity:1,y:0,duration:.5},11.35)
   .fromTo('#share-url',{opacity:0,x:-35},{opacity:1,x:0,duration:.6,ease:'power3.out'},11.8)
   .fromTo('#share-link',{strokeDasharray:360,strokeDashoffset:360},{strokeDashoffset:0,duration:.65},12.3)
   .fromTo('#public-form',{opacity:0,x:40},{opacity:1,x:0,duration:.7,ease:'power3.out'},12.7)
   .fromTo('#share-options',{opacity:0,y:15},{opacity:1,y:0,duration:.5},13.15)
   .fromTo('#respondent-note',{opacity:0,y:15},{opacity:1,y:0,duration:.6},13.6)
   .fromTo('#submit-button',{scale:.95,svgOrigin:'1452 744'},{scale:1,duration:.6,ease:'back.out(1.5)'},14)
   .to('#s3',{opacity:0,y:-28,duration:.4},17.05)
   .fromTo('#s4',{opacity:0,y:30},{opacity:1,y:0,duration:.5},17.35)
   .fromTo('#response-papers',{opacity:0,y:45,rotation:-4,svgOrigin:'340 650'},{opacity:1,y:0,rotation:0,duration:.75,ease:'power3.out'},17.7)
   .fromTo('#return-link',{strokeDasharray:300,strokeDashoffset:300},{strokeDashoffset:0,duration:.65},18.3)
   .fromTo('#read-conversation',{opacity:0,x:35},{opacity:1,x:0,duration:.65,ease:'power3.out'},18.8)
   .fromTo('#read-answer',{opacity:0,y:22},{opacity:1,y:0,duration:.65,ease:'power2.out'},20)
   .to('#s4',{opacity:0,y:-25,duration:.4},23.35)
   .fromTo('#s5',{opacity:0},{opacity:1,duration:.5},23.65)
   .fromTo('#final-panel',{scaleY:.1,svgOrigin:'960 590'},{scaleY:1,duration:.8,ease:'power3.inOut'},23.65)
   .fromTo('#final-copy',{opacity:0,y:38},{opacity:1,y:0,duration:.75,ease:'power3.out'},24.25)
   .fromTo('#final-steps',{opacity:0,y:16},{opacity:1,y:0,duration:.6},24.95)
   .fromTo('#cta',{opacity:0,y:22},{opacity:1,y:0,duration:.65,ease:'power3.out'},25.35)
   .fromTo('#final-symbol',{opacity:0,y:40},{opacity:1,y:0,duration:.8,ease:'power3.out'},25.4)
   .fromTo('#texture',{x:0},{x:-30,duration:30,ease:'none'},0)
   .fromTo('#ambient',{attr:{cx:1770,cy:900}},{attr:{cx:1690,cy:815},duration:30,ease:'none'},0)
   .to({}, {duration:3},27);
 window.__timelines=window.__timelines||{};
 window.__timelines['main']=tl;
})();
</script>
</body>
</html>
