<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AIsa — Motion Study</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f4f1e8}#root{position:relative;width:100%;height:100%;overflow:hidden}canvas{position:absolute;inset:0;width:100%;height:100%;display:block}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="15">
<canvas id="art" class="clip" data-start="0" data-duration="15" width="1920" height="1080" aria-label="AIsa kinetic typography with orbiting geometry and colorful transitions"></canvas>
</div>
<script src="gsap.min.js"></script>
<script>
/* EDITABLE ART DIRECTION: palette, scene timing, typography and geometry. */
const canvas=document.getElementById('art');
const ctx=canvas.getContext('2d');
const W=1920,H=1080;
const P={paper:'#f4f1e8',ink:'#141612',blue:'#244dff',acid:'#e6ff43'};
const FONT='Arial, Helvetica, sans-serif';
const clamp=(x,a=0,b=1)=>Math.max(a,Math.min(b,x));
const mix=(a,b,p)=>a+(b-a)*p;
const ease=p=>1-Math.pow(1-clamp(p),3);
const smooth=p=>{p=clamp(p);return p*p*(3-2*p)};
const outBack=p=>{p=clamp(p);const q=p-1;return 1+2.70158*q*q*q+1.70158*q*q};
const TAU=Math.PI*2;
function background(c){ctx.fillStyle=c;ctx.fillRect(0,0,W,H)}
function circle(x,y,r,c){if(r<=0)return;ctx.fillStyle=c;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fill()}
function line(x1,y1,x2,y2,c,w=2){ctx.strokeStyle=c;ctx.lineWidth=w;ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke()}
function font(size,weight=900){ctx.font=weight+' '+size+'px '+FONT;ctx.textBaseline='alphabetic';ctx.textAlign='left'}
function label(text,x,y,size,color,width=1500,outline=false){
 ctx.save();font(size);const m=ctx.measureText(text);const scale=Math.min(1,width/m.width);ctx.translate(x,y);ctx.scale(scale,1);ctx.textAlign='center';ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineWidth=2.5;if(outline)ctx.strokeText(text,0,0);else ctx.fillText(text,0,0);ctx.restore();
}
function star(x,y,r,rotation,color,arms=12){
 ctx.save();ctx.translate(x,y);ctx.rotate(rotation);ctx.fillStyle=color;ctx.beginPath();for(let i=0;i<arms*2;i++){const a=i*Math.PI/arms;const rr=i%2?r*.38:r;const px=Math.cos(a)*rr,py=Math.sin(a)*rr;if(i===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.closePath();ctx.fill();ctx.restore();
}
function ring(x,y,r,color,width=2){ctx.strokeStyle=color;ctx.lineWidth=width;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.stroke()}
function inFrame(fn){ctx.save();fn();ctx.restore()}
function opening(t){
 background(P.paper);
 const arrive=ease(t/1.15),exit=ease((t-2.18)/.65);
 const cx=960+Math.sin(t*1.8)*20;
 // A stretching highlight becomes a circular shape as the name assembles.
 inFrame(()=>{ctx.translate(cx,540);ctx.rotate(-.10*(1-arrive));ctx.fillStyle=P.acid;const bw=mix(26,660,arrive);ctx.fillRect(-bw/2,-400,bw,800)});
 const letters=['A','I','s','a'];
 font(610);const widths=letters.map(c=>ctx.measureText(c).width);const gap=-24;const total=widths.reduce((a,b)=>a+b,0)+gap*3;
 let x=(W-total)/2;
 for(let i=0;i<4;i++){
  const p=outBack((t-i*.11)/.92);const direction=i%2?-1:1;
  inFrame(()=>{ctx.beginPath();ctx.rect(x-60,110,widths[i]+120,850);ctx.clip();ctx.translate(x,770+direction*(1-p)*850-exit*110);ctx.rotate((1-p)*direction*.14);font(610);ctx.fillStyle=P.ink;ctx.fillText(letters[i],0,0)});
  x+=widths[i]+gap;
 }
 const e=ease((t-.6)/.7);
 line(160,160,160+310*e,160,P.ink,5);
 line(1760-310*e,920,1760,920,P.ink,5);
 star(1685,253,78*e,t*.7,P.blue,10);
 circle(237,837,27*e,P.blue);
 // An overshooting underline gives the first hold a decisive stop.
 ctx.fillStyle=P.ink;ctx.fillRect(435,846,1050*ease((t-1.1)/.7),10);
}
function orbital(t){
 background(P.blue);
 const p=ease(t/.8);
 const radius=330+28*Math.sin(t*2.2);
 inFrame(()=>{
  ctx.translate(960,540);ctx.rotate(-.27+t*.22);
  ctx.scale(1,.54);
  ring(0,0,650,P.paper,3);ring(0,0,795,'rgba(244,241,232,.28)',2);
  for(let i=0;i<36;i++){const a=i*TAU/36;const r=795;line(Math.cos(a)*r,Math.sin(a)*r,Math.cos(a)*(r+16),Math.sin(a)*(r+16),P.paper,2)}
 });
 circle(960,540,radius*p,P.acid);
 // The moving orbit remains behind the typography for a clear silhouette.
 const a=t*1.8+.45;
 const ox=960+Math.cos(a)*650,oy=540+Math.sin(a)*260;
 circle(ox,oy,44,P.paper);ring(ox,oy,61,P.paper,2);
 inFrame(()=>{ctx.translate(960,540);ctx.rotate(-.035+Math.sin(t*1.7)*.025);ctx.scale(mix(.85,1,p),mix(.85,1,p));label('AIsa',0,151,480,P.ink,1280)});
 star(1560,210,65,.5-t*.8,P.acid,12);
 const length=160*ease((t-.35)/.65);
 line(230,270,230+length,270,P.paper,4);
 line(230,270,230,270+length,P.paper,4);
 line(1690-length,810,1690,810,P.paper,4);
 line(1690,810-length,1690,810,P.paper,4);
}
function typography(t){
 background(P.ink);
 const rowHeight=265;
 for(let row=0;row<5;row++){
  const dir=row%2?1:-1;
  const offset=((t*180*dir)%670+670)%670;
  const y=-85+row*rowHeight;
  for(let j=-2;j<5;j++)label('AIsa',j*670+offset,y,262,row===2?P.acid:P.paper,625,row!==2);
 }
 // A single foreground band wipes across the moving typographic field.
 const e=ease((t-.23)/.62);
 inFrame(()=>{
  ctx.translate(960,540);ctx.rotate(-.065);
  ctx.beginPath();ctx.rect(-1100,-196,2200*e,392);ctx.clip();
  ctx.fillStyle=P.acid;ctx.fillRect(-1100,-196,2200,392);
  label('AIsa',0,137,386,P.ink,1110);
  circle(-755,0,45,P.blue);star(755,0,73,t*1.2,P.blue,10);
 });
}
function assembly(t){
 background(P.paper);
 const p=ease((t-.06)/1.02);
 const chars=['A','I','s','a'];
 const colors=[P.blue,P.acid,P.ink,P.blue];
 const starts=[[-320,-450],[480,1460],[1400,-400],[2280,1400]];
 const targets=[390,770,1150,1530];
 const twists=[-.5,.68,-.65,.5];
 // Four letter tiles converge through independent arcs and settle together.
 for(let i=0;i<4;i++){
  const q=outBack((t-i*.09)/1.05);
  const tx=mix(starts[i][0],targets[i],q);
  const ty=mix(starts[i][1],540,q)-Math.sin(clamp(q)*Math.PI)*100;
  inFrame(()=>{
   ctx.translate(tx,ty);ctx.rotate((1-clamp(q))*twists[i]);
   ctx.fillStyle='rgba(20,22,18,.12)';ctx.fillRect(-174+12,-224+16,348,448);
   ctx.fillStyle=colors[i];ctx.fillRect(-174,-224,348,448);
   label(chars[i],0,119,330,i===1?P.ink:P.paper,310);
  });
 }
 const spread=ease((t-1.25)/.5);
 line(216,870,216+1488*spread,870,P.ink,3);
 circle(216,870,8*spread,P.ink);circle(1704,870,8*spread,P.ink);
 // Matching small pulses tie the independent tiles into one lockup.
 const pulse=Math.sin(clamp((t-1.25)/.7)*Math.PI);
 star(960,186,54+18*pulse,t*.45,P.ink,12);
}
function finale(t){
 background(P.acid);
 const p=outBack(t/.95);
 // A large blue disc crosses the frame, then contracts to a graphic accent.
 const collapse=ease(t/1.05);
 const discX=mix(960,1545,collapse),discY=mix(540,250,collapse);
 circle(discX,discY,mix(1080,83,collapse),P.blue);
 inFrame(()=>{
  ctx.translate(960,615);ctx.scale(mix(.7,1,p),mix(.7,1,p));
  label('AIsa',0,117,540,P.ink,1430);
 });
 const accent=ease((t-.55)/.65);
 star(1545,250,61*accent,-.65+Math.min(t,1.8)*.6,P.paper,12);
 const underline=ease((t-.75)/.7);
 line(346,838,346+1228*underline,838,P.ink,9);
 // Motion resolves into a clean final hold for the last second.
 const settling=1-smooth((t-1.15)/.65);
 circle(282,300,23+8*settling*Math.sin(t*5),P.ink);
}
const scenes=[opening,orbital,typography,assembly,finale];
const starts=[0,3,6.2,9.5,12];
const transitionDuration=.56;
function draw(t){
 t=clamp(t,0,15);
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.setLineDash([]);ctx.clearRect(0,0,W,H);
 let scene=0;for(let i=1;i<starts.length;i++)if(t>=starts[i])scene=i;
 const local=t-starts[scene];
 if(scene===0||local>=transitionDuration){inFrame(()=>scenes[scene](local));return}
 inFrame(()=>scenes[scene-1](t-starts[scene-1]));
 const p=smooth(local/transitionDuration);
 inFrame(()=>{
  ctx.beginPath();
  if(scene===1){ctx.arc(960,540,Math.max(.01,1140*p),0,TAU)}
  else if(scene===2){ctx.moveTo(-500+2920*p,0);ctx.lineTo(-1100+2920*p,H);ctx.lineTo(-1200,H);ctx.lineTo(-1200,0);ctx.closePath()}
  else if(scene===3){ctx.rect(0,H*(1-p),W,H*p)}
  else{ctx.arc(1545,250,Math.max(.01,1900*p),0,TAU)}
  ctx.clip();scenes[scene](local);
 });
}
const playhead={t:0};
const timeline=gsap.timeline({paused:true});
timeline.to(playhead,{t:15,duration:15,ease:'none',onUpdate:()=>draw(playhead.t)},0);
draw(0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
</script>
</body>
</html>
