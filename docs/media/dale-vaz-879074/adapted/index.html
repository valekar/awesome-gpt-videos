'use strict';
/*
EDITABLE ADAPTED RECONSTRUCTION — 1280 × 720, 47 seconds, 30 fps.
Requested experiment target: gpt-6.1-sol / high. Execution logs and actual model
metadata are not embedded or independently verified by this source.

DEPENDENCY / ASSET LEDGER
Locally provided gsap.min.js; generic system sans-serif and monospace fonts.
All interface, candle, device, constellation and brand artwork is drawn anew.
No reference images, external media, font files, network requests or audio.
Market values and execution-time wording are reference artwork claims.
Unrecoverable node labels and order details are omitted.

TIMED RECONSTRUCTION / INFERRED CHOREOGRAPHY
00–04: centered blue-white point, halo and rings against black.
04–08: point stretches into line; header, watchlist/chart, chain, positions enter.
08–12: full desktop, then approach into the upper-center chart.
12–14: late recovery close-up, changing quote, newest-candle blue-white bloom.
14–17: coherent candle geometry resolves into fine RGB cells and white nodes.
17–21: return from microscopic view; inspect complete option-chain columns.
21–24: widen into positions/payoff, update table states, higher crop at 24s.
24–28: continuous retreat from the desktop into a tiny point.
28–35: sparse connected constellation, glints, haloed nodes, blue/purple haze.
35–39: approach into landscape phone with a distinct chart and option chain.
39–41: opaque order ticket, wide Buy region, one touch, confirmation.
41–43: persistent outlined option cell and confirmation as phone reduces.
43–47: supplied closing copy, glowing i dot, held composition, restrained fade.
All between-sample easing, microscopic material and star geometry are inferred.
No rendered output, poster, technical check or visual acceptance is claimed.
*/

const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const mix=(a,b,p)=>a+(b-a)*p;
const smooth=v=>{v=clamp(v);return v*v*(3-2*v);};
const enter=(t,a,b)=>smooth((t-a)/(b-a));
const fract=x=>x-Math.floor(x);
const hash=n=>fract(Math.sin(n*127.1+311.7)*43758.5453123);
const num=(v,d=2)=>v.toLocaleString('en-US',{minimumFractionDigits:d,maximumFractionDigits:d});
function sample(keys,t){
 if(t<=keys[0][0])return keys[0][1];
 for(let i=1;i<keys.length;i++)if(t<=keys[i][0])return mix(keys[i-1][1],keys[i][1],smooth((t-keys[i-1][0])/(keys[i][0]-keys[i-1][0])));

}
function label(str,x,y,size=10,color=C.white,align='left',weight=400,mono=false){
 ctx.fillStyle=color;ctx.font=weight+' '+size+'px '+(mono?'monospace':'sans-serif');ctx.textAlign=align;ctx.textBaseline='alphabetic';ctx.fillText(str,x,y);

function box(x,y,w,h,fill,stroke=null,r=0,lw=1){
 ctx.beginPath();if(r)ctx.roundRect(x,y,w,h,r);else ctx.rect(x,y,w,h);
 if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.lineWidth=lw;ctx.strokeStyle=stroke;ctx.stroke();}
}
function line(x1,y1,x2,y2,color=C.edge,width=1,dash=[]){
 ctx.beginPath();ctx.setLineDash(dash);ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke();ctx.setLineDash([]);
}
function circle(x,y,r,fill,stroke=null,width=1){
 ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);if(fill){ctx.fillStyle=fill;ctx.fill();}if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=width;ctx.stroke();}
}
function poly(points,stroke,fill=null,width=1,close=false){
 ctx.beginPath();points.forEach((p,i)=>i?ctx.lineTo(p[0],p[1]):ctx.moveTo(p[0],p[1]));if(close)ctx.closePath();

// Fine display cells live in chart coordinates and therefore enlarge with candles.
function candleMaterial(x,y,w,h,bull,scale){
 const base=bull?C.green:C.red;
 if(scale>9){ctx.save();ctx.shadowColor=bull?'rgba(58,255,196,.25)':'rgba(251,94,153,.20)';ctx.shadowBlur=11;box(x,y,w,h,base);ctx.restore();}else box(x,y,w,h,base);
 if(scale<12)return;
 ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();ctx.globalAlpha*=enter(scale,12,36)*.95;
 box(x,y,w,h,bull?'#13362f':'#411b2b');
 const cell=.185,row=.235;
 const colors=bull?['#a44d65','#4dffd0','#416dcc']:['#ff6a91','#646d48','#6966c1'];
 for(let px=Math.floor(x/cell)*cell;px<x+w;px+=cell){
  box(px+.014,y,cell*.23,h,colors[0]);box(px+cell*.36,y,cell*.235,h,colors[1]);box(px+cell*.70,y,cell*.22,h,colors[2]);
  line(px,y,px,y+h,'rgba(0,0,0,.85)',.019);
 }
 for(let py=Math.floor(y/row)*row;py<y+h;py+=row){
  line(x,py,x+w,py,'rgba(0,0,0,.82)',.026);
  line(x,py+.037,x+w,py+.037,'rgba(238,255,250,.10)',.011);
 }
 ctx.restore();
}
function screenLattice(cam){
 const amount=enter(cam.s,26,48)*.16;if(amount<=0)return;
 const l=Math.max(CHART.px,cam.x-W/(2*cam.s)),r=Math.min(CHART.px+CHART.pw,cam.x+W/(2*cam.s));
 const top=Math.max(CHART.py,cam.y-H/(2*cam.s)),bottom=Math.min(CHART.py+CHART.ph,cam.y+H/(2*cam.s));
 if(r<=l||bottom<=top)return;
 withAlpha(amount,()=>{
  const cell=.185,row=.235;
  for(let x=Math.floor(l/cell)*cell;x<r;x+=cell){
   line(x,top,x,bottom,'#000',.019);
   line(x+.052,top,x+.052,bottom,'#516390',.011);
  }
  for(let y=Math.floor(top/row)*row;y<bottom;y+=row)line(l,y,r,y,'#000',.026);
 });
}

const timeline=gsap.timeline({paused:true});
timeline.to(playhead,{t:DURATION,duration:DURATION,ease:'none',onUpdate:()=>draw(playhead.t)},0);
draw(0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
</script>
