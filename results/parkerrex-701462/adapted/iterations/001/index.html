<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Token bucket rate limiter</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#080f10}
#root{position:relative;width:100%;height:100%;overflow:hidden}
canvas{display:block;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1080" data-duration="18" data-fps="30">
<canvas id="art" class="clip" data-start="0" data-duration="18" width="1080" height="1080" aria-label="Animated explanation of a token bucket rate limiter with capacity ten and refill rate two tokens per second"></canvas>
</div>
<script src="gsap.min.js"></script>
<script>
'use strict';
/*
Inferred reconstruction of @ParkerRex's supplied reference, not recovered source.
Fixed camera and dashboard throughout, 1080 square, 18 seconds, silent.
0–2.40: steady traffic. 2.40–3.30: burst. 3.30–6.40: depletion.
6.40–11.70: recovery. 11.70–18: amber conclusion and completed graph.
Caption boundaries and requests 4 and 11–14 are inferred between samples.
Canvas alone draws the artwork; harness-provided GSAP only supplies seek time.
Generic monospace approximates the unknown typeface; large zero is drawn manually.
No reference images, external assets or supplied font files are used.
*/
const canvas=document.getElementById('art');
const ctx=canvas.getContext('2d');
const C={bg:'#080f10',text:'#c8d2d7',muted:'#626a6f',blue:'#55a2ff',green:'#4bb366',red:'#ef4f54',amber:'#cda92f',outline:'#777f82',slot:'#30393b'};
const CAPACITY=10, REFILL=2, SIMULATION_END=12;
// Inferred request times: #4=2.40, #11=3.02, #12=3.10, #13=3.15, #14=3.27.
const requests=[0.50,1.30,1.90,2.40,2.47,2.58,2.64,2.76,2.83,2.90,3.02,3.10,3.15,3.27,3.33,3.42,3.53,3.60,3.78,3.90,4.08,4.23,4.35,4.56,4.70,4.88,5.06,5.17,5.42,5.65,5.90,6.18,7.60];
const EPS=1e-8;
const whole=n=>Math.max(0,Math.min(CAPACITY,Math.floor(n+EPS)));

// Rebuild all balances, log rows and staircase vertices from time on every call.
function stateAt(time){
 const end=Math.max(0,Math.min(SIMULATION_END,time));
 let balance=CAPACITY,previous=0;
 const rows=[],points=[[0,CAPACITY]];
 function refillUntil(until){
  const initial=balance;
  for(let level=whole(initial)+1;level<=CAPACITY;level++){
   const crossing=previous+(level-initial)/REFILL;
   if(crossing>until+EPS)break;
   points.push([crossing,level-1],[crossing,level]);
  }
  balance=Math.min(CAPACITY,initial+REFILL*(until-previous));
  previous=until;
 }
 for(let i=0;i<requests.length;i++){
  const at=requests[i];
  if(at>end+EPS)break;
  refillUntil(at);
  const before=whole(balance),taken=balance+EPS>=1;
  if(taken)balance=Math.max(0,balance-1);
  const left=whole(balance);
  points.push([at,before],[at,left]);
  rows.push({at,id:i+1,taken,left});
 }
 refillUntil(end);
 points.push([end,whole(balance)]);
 return {time:end,balance,count:whole(balance),rows,points};
}
function text(str,x,y,size,color,align='left'){
 ctx.fillStyle=color;
 ctx.font=size+'px monospace';
 ctx.textAlign=align;
 ctx.textBaseline='alphabetic';
 ctx.fillText(str,x,y);
}
function line(x1,y1,x2,y2,color,width=1){
 ctx.strokeStyle=color;ctx.lineWidth=width;
 ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.stroke();
}
function zero(x,baseline,color){
 ctx.strokeStyle=color;ctx.lineWidth=11;ctx.lineCap='butt';
 ctx.beginPath();ctx.ellipse(x+45,baseline-55,31,51,0,0,Math.PI*2);ctx.stroke();
 ctx.beginPath();ctx.moveTo(x+20,baseline-14);ctx.lineTo(x+70,baseline-97);ctx.stroke();
}
function countLabel(value){
 const x=415,y=318,color=value===0?C.red:C.text;
 if(value===10){text('1',x,y,150,color);zero(x+90,y,color);}
 else if(value===0)zero(x,y,color);
 else text(String(value),x,y,150,color);
 text('/ 10 tokens',x+(value===10?180:90)+12,y,32,C.muted);
}
function captionAt(t){
 if(t<2.40)return ['steady traffic, refill keeps the bucket full',C.text];
 if(t<3.30)return ['a burst spends the saved tokens',C.text];
 if(t<6.40)return ['empty: requests refused until a token refills',C.text];
 if(t<11.70)return ['traffic eases, refill at 2/s catches up',C.text];
 return ['capacity sets the burst, refill rate sets the limit',C.amber];
}
function draw(t){
 ctx.setTransform(1,0,0,1,0,0);
 ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';
 ctx.setLineDash([]);ctx.lineWidth=1;ctx.lineCap='butt';ctx.lineJoin='miter';
 ctx.shadowBlur=0;ctx.shadowColor='transparent';
 ctx.clearRect(0,0,1080,1080);
 ctx.fillStyle=C.bg;ctx.fillRect(0,0,1080,1080);
 const endHold=t>=11.70;
 const s=stateAt(endHold?SIMULATION_END:t);
 const empty=s.count===0;

 // Open-topped vessel and ten bottom-up token slots.
 ctx.strokeStyle=empty?'#87474b':C.outline;
 ctx.lineWidth=1.5;ctx.beginPath();
 ctx.moveTo(95.5,176);ctx.lineTo(95.5,622);ctx.lineTo(324.5,622);ctx.lineTo(324.5,176);ctx.stroke();
 for(let bottom=0;bottom<10;bottom++){
  const y=572-bottom*42;
  ctx.strokeStyle=C.slot;ctx.lineWidth=0.8;ctx.strokeRect(112.5,y+0.5,195,33);
  if(bottom<s.count){ctx.fillStyle=C.blue;ctx.fillRect(112,y,196,34);}
 }
 // Small fractional boundary accent: inferred from the thin sampled slot fills.
 const fraction=s.balance-s.count;
 if(s.count<10&&fraction>EPS){
  const y=572-s.count*42;
  const h=Math.min(4,fraction*4);
  ctx.fillStyle=empty?'#214730':'#263c55';
  ctx.fillRect(112,y+34-h,196,h);
 }

 // Fixed twelve-second chart, integer staircase and accepted/refused ticks.
 const chart={x:112,y:700,w:908,h:200};
 const px=seconds=>chart.x+seconds/SIMULATION_END*chart.w;
 const py=value=>900-value*20;
 ctx.setLineDash([4,6]);
 line(chart.x,700,1020,700,'#283338',0.8);
 ctx.setLineDash([]);
 line(chart.x,900.5,1020,900.5,C.outline,1);
 ctx.strokeStyle=C.blue;ctx.lineWidth=1.7;ctx.beginPath();
 s.points.forEach((p,i)=>{if(i===0)ctx.moveTo(px(p[0]),py(p[1]));else ctx.lineTo(px(p[0]),py(p[1]));});
 ctx.stroke();
 for(const row of s.rows)line(px(row.at),922,px(row.at),952,row.taken?C.green:C.red,1.8);
 if(!endHold)line(px(s.time),688,px(s.time),952,'#828d92',0.8);

 // All typography stays stationary while its content updates.
 text('token bucket, capacity 10, refill 2/s',60,66,28,C.text);
 text('opus 5.5 drew this',1020,66,28,C.muted,'right');
 const caption=captionAt(t);text(caption[0],60,136,32,caption[1]);
 countLabel(s.count);
 const latest=s.rows.slice(-6);
 latest.forEach((row,i)=>{
  const y=404+i*42;
  text(row.at.toFixed(2)+'s',419,y,28,C.muted);
  text('req '+String(row.id).padStart(2,' '),548,y,28,C.text);
  text(row.taken?'taken':'refused',692,y,28,row.taken?C.green:C.red);
  text(row.left+' left',925,y,28,C.muted);
 });
 text('10',96,708,26,C.muted,'right');
 text('0',96,908,26,C.muted,'right');
 text('0s',112,994,26,C.muted);
 text('12s',1020,994,26,C.muted,'right');
 text('@ParkerRex midweek update',60,1047,28,C.muted);
}
const playhead={t:0};
const timeline=gsap.timeline({paused:true});
timeline.to(playhead,{t:18,duration:18,ease:'none',onUpdate:()=>draw(playhead.t)},0);
draw(0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
</script>
</body>
</html>
