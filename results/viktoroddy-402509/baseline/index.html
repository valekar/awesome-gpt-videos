<body>

<g id="m5"><rect x="1180" y="736" width="193" height="116" rx="58" fill="#171715"/><circle cx="1276" cy="794" r="13" fill="#f3f0e8"/></g>

<script src="gsap.min.js"></script>
<script>
(function(){
'use strict';
const canvas=document.getElementById('art');
const ctx=canvas.getContext('2d');
const TAU=Math.PI*2;
const clock={t:0};
const palette={paper:[243,240,232],ink:[23,23,21],orange:[255,100,61]};
const clamp=(x)=>Math.max(0,Math.min(1,x));
const smooth=(a,b,t)=>{let x=clamp((t-a)/(b-a));return x*x*(3-2*x)};
const mix=(a,b,p)=>a.map((v,i)=>Math.round(v+(b[i]-v)*p));
const color=(a)=>'rgb('+a.join(',')+')';
function draw(t){
 let bg=palette.paper;
 bg=mix(bg,palette.ink,smooth(8.45,9,t));
 bg=mix(bg,palette.paper,smooth(14.45,15,t));
 bg=mix(bg,palette.orange,smooth(19.65,20.25,t));
 ctx.globalAlpha=1;ctx.fillStyle=color(bg);ctx.fillRect(0,0,1920,1080);
 const intro=1-smooth(3.9,4.6,t);
 if(intro>0){
  ctx.save();ctx.globalAlpha=intro;
  const cx=1378,cy=520;
  ctx.strokeStyle='rgba(23,23,21,.10)';ctx.lineWidth=1;
  for(let j=0;j<4;j++){ctx.beginPath();ctx.ellipse(cx,cy,180+j*58,180+j*58,0,0,TAU);ctx.stroke()}
  const strands=[];
  for(let i=0;i<82;i++){
   const p=i/82*TAU+t*.25;
   strands.push({p:p,z:Math.sin(p)});
  }
  strands.sort((a,b)=>a.z-b.z);
  for(const s of strands){
   const p=s.p;
   ctx.beginPath();
   for(let j=0;j<=90;j++){
    const q=j/90*TAU;
    const radial=254+73*Math.cos(q);
    const x=radial*Math.cos(p),y=radial*Math.sin(p),z=73*Math.sin(q);
    const tilt=.64,yy=y*Math.cos(tilt)-z*Math.sin(tilt),zz=y*Math.sin(tilt)+z*Math.cos(tilt);
    const perspective=1000/(1000-zz);
    const px=cx+(x*.91+zz*.20)*perspective;
    const py=cy+(yy*.86-x*.17)*perspective;
    if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py);
   }
   ctx.strokeStyle=s.z>0?'#ff643d':'#c53b1b';ctx.lineWidth=s.z>0?3.2:1.9;ctx.stroke();
  }
  ctx.restore();
 }
 const monthArt=smooth(4.1,4.7,t)*(1-smooth(8.1,8.7,t));
 if(monthArt>0){ctx.save();ctx.globalAlpha=monthArt;ctx.translate(1510,405);ctx.rotate((t-4.2)*.12);for(let j=0;j<8;j++){const a=j*TAU/8;ctx.save();ctx.rotate(a);ctx.fillStyle='#ff643d';ctx.beginPath();ctx.roundRect(76,-20,152,40,20);ctx.fill();ctx.restore()}ctx.restore()}
 const burst=smooth(8.5,9.3,t)*(1-smooth(14.1,14.8,t));
 if(burst>0){
  ctx.save();ctx.globalAlpha=burst;
  for(let i=0;i<68;i++){
   const a=i*2.39996323;
   const base=420+(i%7)*41;
   const r=base+Math.sin(t*.65+i*.8)*17;
   const x=960+Math.cos(a)*r*1.64,y=530+Math.sin(a)*r*.82;
   ctx.fillStyle=i%4===0?'#ff643d':'rgba(243,240,232,.22)';
   ctx.save();ctx.translate(x,y);ctx.rotate(a+t*.08);ctx.beginPath();ctx.roundRect(-3,-7,6,14,3);ctx.fill();ctx.restore();
  }
  ctx.restore();
 }
 const finalArt=smooth(20,20.7,t);
 if(finalArt>0){
  ctx.save();ctx.globalAlpha=finalArt*.17;ctx.strokeStyle='#171715';ctx.lineWidth=2;
  for(let j=0;j<7;j++){const r=310+j*52+Math.sin(t*.3+j*.3)*6;ctx.beginPath();ctx.ellipse(-85,550,r,r*1.35,-.35,0,TAU);ctx.stroke();ctx.beginPath();ctx.ellipse(2005,550,r,r*1.35,.35,0,TAU);ctx.stroke()}
  ctx.restore();
 }
 ctx.globalAlpha=1;
}
const tl=gsap.timeline({paused:true});
tl.to(clock,{t:24,duration:24,ease:'none',onUpdate:function(){draw(clock.t)}},0);
const scenes=['#intro','#months','#million','#workflow','#ending'];
tl.set(scenes,{opacity:0,y:36},0);
function scene(id,start,end){
 tl.to(id,{opacity:1,y:0,duration:.65,ease:'power3.out'},start);
 if(end!==null)tl.to(id,{opacity:0,y:-24,duration:.4,ease:'power2.in'},end);
}
scene('#intro',.12,3.9);
scene('#months',4.4,8.15);
scene('#million',8.95,14.2);
scene('#workflow',14.95,19.4);
scene('#ending',20.15,null);
tl.set('#monthMarks>g',{opacity:0,y:28},0);
tl.to('#monthMarks>g',{opacity:1,y:0,duration:.36,stagger:.16,ease:'power3.out'},5.1);
tl.set('#millionNumber',{scale:.84,transformOrigin:'960px 500px'},0);
tl.to('#millionNumber',{scale:1,duration:1.1,ease:'power3.out'},8.95);
tl.set('#milestoneRule',{strokeDasharray:600,strokeDashoffset:600},0);
tl.to('#milestoneRule',{strokeDashoffset:0,duration:.8,ease:'power3.inOut'},10.1);
tl.set(['#stepA','#stepB','#stepC'],{opacity:0,x:45},0);
tl.to('#stepA',{opacity:1,x:0,duration:.55,ease:'power3.out'},15.2);
tl.to('#stepB',{opacity:1,x:0,duration:.55,ease:'power3.out'},16.1);
tl.to('#stepC',{opacity:1,x:0,duration:.55,ease:'power3.out'},17);
tl.set('#cta',{opacity:0,y:16},0);
tl.to('#cta',{opacity:1,y:0,duration:.6,ease:'power3.out'},21.15);
tl.seek(0);
draw(0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=tl;
})();
</script>
</body>
