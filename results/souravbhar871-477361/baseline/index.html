<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Opus 5.5 — A Mind in Motion</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#121212}#root{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1920" data-height="1080" data-duration="10">
<canvas id="art" class="clip" data-start="0" data-duration="10" width="1920" height="1080" aria-label="An abstract kinetic portrait of Opus 5.5, moving from a question through broken patterns into new possibilities."></canvas>
</div>
<script src="gsap.min.js"></script>
<script>
/* Editable creative controls. Every frame is computed exclusively from time. */
const DESIGN={paper:'#F3F0E7',ink:'#151515',orange:'#FF4C24',blue:'#254BFF',width:1920,height:1080};
const COPY={title:'OPUS',version:'5.5',question:['WHAT','IF?'],questionCaption:'FOLLOW THE QUESTION.',pattern:['BREAK','THE PATTERN.'],possibility:['FIND THE','POSSIBILITY.'],ending:'LET’S MAKE SOMETHING.'};
const STARTS=[0,1.9,3.8,5.9,8.0],WIPE=.28;
const canvas=document.getElementById('art'),ctx=canvas.getContext('2d');
const W=DESIGN.width,H=DESIGN.height,TAU=Math.PI*2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const out=p=>1-Math.pow(1-clamp(p),3);
const smooth=p=>{p=clamp(p);return p*p*(3-2*p)};
const pop=p=>{p=clamp(p);return 1+2.70158*Math.pow(p-1,3)+1.70158*Math.pow(p-1,2)};
function bg(color){ctx.fillStyle=color;ctx.fillRect(0,0,W,H)}
function circle(x,y,r,color){if(r<=0)return;ctx.beginPath();ctx.arc(x,y,r,0,TAU);ctx.fillStyle=color;ctx.fill()}
function text(s,x,y,size,color,options={}){ctx.save();ctx.font=`${options.weight||900} ${size}px ${options.family||'Arial, Helvetica, sans-serif'}`;ctx.textAlign=options.align||'center';ctx.textBaseline='middle';ctx.fillStyle=color;if(options.stroke){ctx.lineWidth=options.stroke;ctx.strokeStyle=color;ctx.strokeText(s,x,y)}else ctx.fillText(s,x,y);ctx.restore()}
function fit(s,size,maxWidth){ctx.save();ctx.font=`900 ${size}px Arial, Helvetica, sans-serif`;let n=size*Math.min(1,maxWidth/ctx.measureText(s).width);ctx.restore();return n}
function arc(x,y,r,a,b,color,width){ctx.beginPath();ctx.arc(x,y,r,a,b);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function line(x1,y1,x2,y2,color,width){ctx.beginPath();ctx.moveTo(x1,y1);ctx.lineTo(x2,y2);ctx.strokeStyle=color;ctx.lineWidth=width;ctx.stroke()}
function opening(t){
 bg(DESIGN.ink);
 const aperture=out(t/.48)*1220;
 ctx.save();ctx.beginPath();ctx.arc(960,540,Math.max(.01,aperture),0,TAU);ctx.clip();bg(DESIGN.paper);
 const ring=out((t-.1)/.65);
 ctx.save();ctx.translate(960,520);ctx.rotate(-.3+t*.3);
 for(let i=0;i<4;i++){let a=i*TAU/4;arc(0,0,430*ring,a,a+1.16,DESIGN.ink,2);circle(Math.cos(a+1.16)*430*ring,Math.sin(a+1.16)*430*ring,9,DESIGN.orange)}
 ctx.restore();
 const letters=COPY.title.split(''),positions=[641,852,1062,1273];
 letters.forEach((letter,i)=>{let e=pop((t-.16-i*.065)/.55);ctx.save();ctx.translate(positions[i],475+(1-e)*350);ctx.rotate((1-e)*(.16-i*.09));text(letter,0,0,300,DESIGN.ink);ctx.restore()});
 const v=out((t-.5)/.5);ctx.save();ctx.translate(960,730+(1-v)*90);ctx.scale(v||.001,v||.001);text(COPY.version,0,0,172,DESIGN.orange);ctx.restore();
 let a=t*2.4-.8;circle(960+Math.cos(a)*430,520+Math.sin(a)*430,19,DESIGN.orange);
 ctx.restore();
 if(t<.16)circle(960,540,9+out(t/.16)*12,DESIGN.orange);
}
function question(t){
 bg(DESIGN.orange);
 const enter=out(t/.52);
 ctx.save();ctx.translate(520,500);ctx.scale(enter||.001,enter||.001);ctx.rotate(-.12+.035*Math.sin(t*3));
 for(let i=0;i<5;i++)arc(0,0,205+i*40,-1.9+t*(.45+i*.035),1.8+t*(.45+i*.035),i%2?DESIGN.paper:DESIGN.ink,i===2?5:2);
 text('?',0,13,455,DESIGN.ink);
 ctx.restore();
 const size=238;
 COPY.question.forEach((s,i)=>{let e=out((t-.15-i*.10)/.45);ctx.save();ctx.beginPath();ctx.rect(935,230+i*230,850,250);ctx.clip();text(s,1308+(1-e)*550,360+i*230,size,DESIGN.paper);ctx.restore()});
 const reveal=out((t-.4)/.6);line(945,740,945+730*reveal,740,DESIGN.ink,5);
 ctx.save();ctx.globalAlpha=out((t-.55)/.35);text(COPY.questionCaption,960,903,60,DESIGN.ink);ctx.restore();
 const a=-2.2+t*2.7;circle(520+Math.cos(a)*325,500+Math.sin(a)*325,23,DESIGN.paper);
 for(let i=0;i<3;i++){let phase=t*1.1+i*.24;let x=810+((phase%1)*1100);let y=142+Math.sin(phase*TAU)*38;circle(x,y,6+i*2,DESIGN.ink)}
}
function slicedText(s,y,size,t,delay){
 let fs=fit(s,size,1680),e=out((t-delay)/.65),bands=10,top=y-fs*.64,bandH=fs*1.35/bands;
 for(let j=0;j<bands;j++){
 ctx.save();ctx.beginPath();ctx.rect(0,top+j*bandH,W,bandH+.8);ctx.clip();
 let shift=(1-e)*(j%2?1:-1)*(280+50*Math.sin(j*1.7));
 text(s,960+shift,y,fs,DESIGN.paper);ctx.restore();
 }
}
function pattern(t){
 bg(DESIGN.blue);
 const burst=out((t-.18)/1.25);
 for(let row=0;row<7;row++)for(let col=0;col<13;col++){
 const k=row*13+col,x=col*160,y=row*170;
 const vx=x-960,vy=y-540;
 ctx.save();ctx.translate(x+vx*burst*.13,y+vy*burst*.13);ctx.rotate(Math.sin(k*2.31)*burst*.75);
 ctx.globalAlpha=.22*(1-burst*.55);ctx.strokeStyle=DESIGN.paper;ctx.lineWidth=2;ctx.strokeRect(-48,-48,96,96);ctx.restore();
 }
 let impact=1+.045*Math.sin(t*17)*Math.exp(-t*3);
 ctx.save();ctx.translate(960,540);ctx.scale(impact,impact);ctx.translate(-960,-540);
 slicedText(COPY.pattern[0],386,300,t,.08);slicedText(COPY.pattern[1],674,222,t,.23);ctx.restore();
 let lineE=out((t-.65)/.45);
 ctx.save();ctx.translate(960,815);ctx.rotate(-.045);ctx.fillStyle=DESIGN.orange;ctx.fillRect(-790*lineE,-13,1580*lineE,26);ctx.restore();
 for(let i=0;i<8;i++){let a=i*TAU/8+.2,dist=260+burst*660;ctx.save();ctx.translate(960+Math.cos(a)*dist,540+Math.sin(a)*dist);ctx.rotate(a+t*(i%2?1:-1));ctx.fillStyle=DESIGN.orange;ctx.fillRect(-10,-35,20,70);ctx.restore()}
}
function possibility(t){
 bg(DESIGN.paper);
 const e=out(t/.55),spread=lerp(430,210,smooth((t-.25)/1.5));
 ctx.save();ctx.beginPath();ctx.rect(0,325,W,440);ctx.clip();
 for(let i=0;i<25;i++){
 let n=(i-12)/12,osc=Math.sin(t*1.8+i*.18)*24;
 ctx.beginPath();ctx.moveTo(-120,540+n*spread*1.6+osc);
 ctx.bezierCurveTo(500,540+n*spread,650,540-n*spread*.7,960,540+n*24);
 ctx.bezierCurveTo(1280,540+n*spread*.7,1420,540-n*spread,2040,540-n*spread*1.5-osc);
 ctx.lineWidth=i%6===0?13:3;ctx.strokeStyle=i%6===0?DESIGN.orange:(i%3===0?DESIGN.blue:DESIGN.ink);ctx.globalAlpha=e;ctx.stroke();
 }
 ctx.restore();
 ctx.save();ctx.translate(960,540);ctx.rotate(t*.22);let r=104*pop((t-.15)/.65);circle(0,0,r,DESIGN.orange);circle(0,0,r*.5,DESIGN.paper);ctx.fillStyle=DESIGN.ink;ctx.fillRect(-8,-r-21,16,42);ctx.fillRect(-8,r-21,16,42);ctx.restore();
 let titleE=out((t-.04)/.48);text(COPY.possibility[0],960,222+(1-titleE)*75,145,DESIGN.ink);
 let bottomE=out((t-.2)/.55);text(COPY.possibility[1],960,862+(1-bottomE)*110,fit(COPY.possibility[1],204,1660),DESIGN.ink);
 const u=clamp((t-.2)/1.8);circle(lerp(-100,2020,u),540+Math.sin(u*TAU)*100,17,DESIGN.blue);
}
function finale(t){
 bg(DESIGN.ink);
 const enter=out(t/.6),settle=smooth((t-.4)/1.3);
 ctx.save();ctx.translate(960,505);ctx.rotate(-.4+t*.2);
 for(let i=0;i<36;i++){
 const a=i*TAU/36,r=lerp(800,435,enter)+Math.sin(i*1.8+t*2)*lerp(40,4,settle);
 ctx.save();ctx.rotate(a);ctx.translate(r,0);ctx.rotate((1-enter)*i*.14);
 ctx.fillStyle=i%6===0?DESIGN.orange:(i%6===3?DESIGN.blue:DESIGN.paper);
 const length=i%3===0?56:25;ctx.fillRect(-length/2,-4,length,8);ctx.restore();
 }
 ctx.restore();
 ctx.save();ctx.translate(960,475);let s=lerp(.7,1,pop(t/.65));ctx.scale(s,s);ctx.globalAlpha=enter;text(COPY.title,0,-55,286,DESIGN.paper);text(COPY.version,0,164,168,DESIGN.orange);ctx.restore();
 const e=out((t-.55)/.55);ctx.save();ctx.beginPath();ctx.rect(150,847,1620,110);ctx.clip();text(COPY.ending,960,900+(1-e)*120,62,DESIGN.paper);ctx.restore();
 let a=-.6+t*1.1;circle(960+Math.cos(a)*435,505+Math.sin(a)*435,16,DESIGN.orange);
}
const SCENES=[opening,question,pattern,possibility,finale];
function renderScene(i,t){ctx.save();SCENES[i](Math.max(0,t-STARTS[i]+(i?WIPE:0)));ctx.restore()}
function draw(t){
 t=clamp(t,0,10);ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.globalCompositeOperation='source-over';ctx.clearRect(0,0,W,H);
 let i=0;for(let j=1;j<STARTS.length;j++)if(t>=STARTS[j])i=j;
 renderScene(i,t);
 if(i<SCENES.length-1&&t>STARTS[i+1]-WIPE){
 const p=smooth((t-(STARTS[i+1]-WIPE))/WIPE),edge=lerp(W+650,-650,p);
 ctx.save();ctx.beginPath();ctx.moveTo(edge+360,-10);ctx.lineTo(W+1000,-10);ctx.lineTo(W+1000,H+10);ctx.lineTo(edge-360,H+10);ctx.closePath();ctx.clip();renderScene(i+1,t);ctx.restore();
 }
}
const playhead={t:0};
const timeline=gsap.timeline({paused:true});
timeline.to(playhead,{t:10,duration:10,ease:'none',onUpdate:()=>draw(playhead.t)},0);
draw(0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
</script>
</body>
</html>
