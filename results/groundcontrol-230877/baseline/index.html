/* ORIGINAL JAVASCRIPT SYNTHESIZER.
   A deterministic 80 BPM score: 20 beats per scene, 12 scenes, exactly 180 s.

   No AudioContext playback clock, timers, live sequencer or playback loop.
   Edit motif/chords/timbre here to change the score.

function synthesizeScore(){
 const sr=16000,seconds=180,samples=new Float32Array(sr*seconds),beat=.75;
 const hz=m=>440*Math.pow(2,(m-69)/12);
 function note(at,midi,duration,gain,voice=0){
  const start=Math.floor(at*sr),len=Math.floor(duration*sr),f=hz(midi);
  for(let j=0;j<len&&start+j<samples.length;j++){
   const u=j/sr,attack=Math.min(1,u/.012),release=Math.min(1,(duration-u)/.12);
   const env=attack*release*Math.exp(-u/(voice===1?1.9:.68));
   const ph=TAU*f*u;
   const timbre=voice===1?Math.sin(ph)*.78+Math.sin(ph*2.001)*.13:Math.sin(ph)*.72+Math.sin(ph*2)*.19+Math.sin(ph*3)*.06+Math.sin(ph*4)*.03;
   samples[start+j]+=timbre*env*gain;
  }
 }
