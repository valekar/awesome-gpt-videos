<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AI Superpowers — reference reconstruction</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#edf6fa}
#root{position:relative;width:100%;height:100%;overflow:hidden}
.artwork{position:absolute;inset:0;width:100%;height:100%;display:flex;align-items:center;justify-content:center}
canvas{display:block;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1280" data-height="720" data-duration="34.5" data-fps="30">
<div class="clip artwork" data-start="0" data-duration="34.5" data-track-index="0">
<canvas id="art" width="1280" height="720" aria-label="AI Superpowers animated explainer"></canvas>
</div>
</div>
<script src="gsap.min.js"></script>
<script>
/* Independently authored from supplied sampled visual evidence.
   All artwork is code-drawn. No external media or custom fonts are used.
   Fade timing, typing cadence, counter interpolation and pill drift are inferred.
   This source has not been rendered or visually validated. */
(function(){
'use strict';
const canvas=document.getElementById('art');
const ctx=canvas.getContext('2d');
const W=1280,H=720,DURATION=34.5;
const C={bg:'#EDF6FA',ink:'#1D2935',blue:'#488CB8',icon:'#82B7DD',yellow:'#F2C800',gold:'#E9B91C',white:'#FFFFFF',warm:'#FAF9F5',terra:'#B45B43',gray:'#606A72'};
const promptText="Adopt the role of an expert motion designer. Build a 30-second animated explainer for my business as a single HTML page. 5 scenes. The customer's problem, what I do, how it works in 3 steps, one proof point, and my name at the end. Bold text, smooth transitions, my brand colours. My business is AI Superpowers, a free weekly newsletter with one AI prompt or workflow for your work and business. Over 2,000 subscribers. I built God of Prompt from $0 to $500K. Light blue and yellow.";
const partial="Adopt the role of an expert motion designer. Build a 30-second animated";
const twoSecondLength=promptText.indexOf('$0')+2;
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const smooth=v=>{v=clamp(v);return v*v*(3-2*v);};
const fade=(t,start,length=.55)=>smooth((t-start)/length);
function envelope(t,start,end,entry=.55,exit=.45){return fade(t,start,entry)*(1-fade(t,end-exit,exit));}
function group(alpha,fn){if(alpha<=0)return;ctx.save();ctx.globalAlpha*=alpha;fn();ctx.restore();}
function font(size,weight=700,family='sans-serif'){ctx.font=weight+' '+size+'px '+family;}
function text(str,x,y,size,color=C.ink,weight=700,align='center',maxWidth){
 ctx.save();font(size,weight);ctx.fillStyle=color;ctx.textAlign=align;ctx.textBaseline='alphabetic';
 if(maxWidth&&ctx.measureText(str).width>maxWidth){const scale=maxWidth/ctx.measureText(str).width;ctx.translate(x,y);ctx.scale(scale,1);ctx.fillText(str,0,0);}else ctx.fillText(str,x,y);
 ctx.restore();
}
function roundedPath(x,y,w,h,r){
 r=Math.min(r,w/2,h/2);ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath();
}
function box(x,y,w,h,r,fill,shadow=false,stroke){
 ctx.save();if(shadow){ctx.shadowColor='rgba(40,55,66,0.055)';ctx.shadowBlur=17;ctx.shadowOffsetY=7;}roundedPath(x,y,w,h,r);ctx.fillStyle=fill;ctx.fill();ctx.shadowColor='transparent';if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=1;ctx.stroke();}ctx.restore();
}
function lightning(x,y,size){
 box(x,y,size,size,size*.225,C.icon);
 const points=[[.63,.18],[.30,.53],[.48,.53],[.33,.80],[.70,.44],[.51,.44]];
 ctx.save();ctx.beginPath();points.forEach((p,i)=>{if(i===0)ctx.moveTo(x+p[0]*size,y+p[1]*size);else ctx.lineTo(x+p[0]*size,y+p[1]*size);});ctx.closePath();ctx.fillStyle='#FFF0A3';ctx.fill();ctx.lineWidth=size*.022;ctx.strokeStyle=C.gold;ctx.lineJoin='miter';ctx.stroke();ctx.restore();
}
function spacedText(str,cx,y,size,spacing,color){
 ctx.save();font(size,700);ctx.fillStyle=color;ctx.textAlign='left';const letters=Array.from(str);const width=letters.reduce((sum,c)=>sum+ctx.measureText(c).width,0)+(letters.length-1)*spacing;let x=cx-width/2;letters.forEach(c=>{ctx.fillText(c,x,y);x+=ctx.measureText(c).width+spacing;});ctx.restore();
}
function wrappedLines(str,maxWidth){
 const words=str.split(' '),lines=[];let line='';
 words.forEach(word=>{const next=line?line+' '+word:word;if(line&&ctx.measureText(next).width>maxWidth){lines.push(line);line=word;}else line=next;});lines.push(line);return lines;
}
function typedLength(t){
 if(t<=1)return Math.floor(partial.length*clamp(t));
 if(t<=2)return Math.floor(partial.length+(twoSecondLength-partial.length)*(t-1));
 return Math.floor(twoSecondLength+(promptText.length-twoSecondLength)*clamp((t-2)/.85));
}
function drawIntro(t){
 const a=1-fade(t,3.55,.4);
 group(a,()=>{
 ctx.fillStyle=C.warm;ctx.fillRect(0,0,W,H);
 // Warm footer sits behind the composer.
 box(164,503,952,71,23,'#F0EEE7');
 text('Connect your tools to Claude',185,557,18,'#393A35',400,'left');
 ctx.save();ctx.translate(356,116);ctx.strokeStyle='#C87861';ctx.lineWidth=2.7;
 for(let i=0;i<20;i++){const angle=i*Math.PI/10;ctx.beginPath();ctx.moveTo(Math.cos(angle)*6,Math.sin(angle)*6);ctx.lineTo(Math.cos(angle)*19,Math.sin(angle)*19);ctx.stroke();}ctx.restore();
 ctx.save();font(56,400,'serif');ctx.fillStyle='#303126';ctx.textAlign='left';ctx.fillText('Evening, Alex Prompter',389,134);ctx.restore();
 box(153,181,974,345,26,C.white,true,'#E7E6E1');
 ctx.save();font(24,400);ctx.fillStyle='#111312';ctx.textAlign='left';ctx.textBaseline='alphabetic';
 const shown=promptText.slice(0,typedLength(t));const lines=wrappedLines(shown,904);
 lines.forEach((line,i)=>ctx.fillText(line,185,234+i*36));
 if(t<3.4){const last=lines[lines.length-1]||'';const cx=185+ctx.measureText(last).width+2;const cy=234+(lines.length-1)*36;ctx.fillRect(cx,cy-25,1.5,28);}ctx.restore();
 ctx.save();ctx.strokeStyle='#62635C';ctx.lineWidth=1.6;ctx.beginPath();ctx.moveTo(187,493);ctx.lineTo(203,493);ctx.moveTo(195,485);ctx.lineTo(195,502);ctx.stroke();ctx.restore();
 text('Opus 5.5 Extended',1027,494,18,'#42433E',400,'right');
 box(1063,466,43,43,9,C.terra);
 ctx.save();ctx.strokeStyle='white';ctx.lineWidth=2.6;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(1084.5,498);ctx.lineTo(1084.5,477);ctx.moveTo(1076,486);ctx.lineTo(1084.5,477);ctx.lineTo(1093,486);ctx.stroke();ctx.restore();
 });
}
const pills=[
 {label:'New model',x:190,y:139,r:-.12,w:194,phase:.2},
 {label:'New app',x:550,y:80,r:.07,w:164,phase:1.2},
 {label:'New agent',x:1055,y:115,r:.08,w:184,phase:2.2},
 {label:'New plugin',x:180,y:565,r:.08,w:196,phase:3.2},
 {label:'New update',x:655,y:632,r:-.045,w:204,phase:4.2},
 {label:'New feature',x:1050,y:580,r:-.10,w:208,phase:5.2}
];
function drawProblem(t){
 const scene=envelope(t,4.15,9.96,.65,.5);
 group(scene,()=>{
 pills.forEach(p=>{ctx.save();ctx.translate(p.x+5*Math.sin((t-4)*.58+p.phase),p.y+5*Math.sin((t-4)*.47+p.phase));ctx.rotate(p.r+.012*Math.sin((t-4)*.7+p.phase));box(-p.w/2,-32,p.w,64,32,'#FFFFFF',false,'#DFEAF0');text(p.label,0,9,27,C.blue,600);ctx.restore();});
 text('A new AI tool drops every day.',640,320,72,C.ink,700,'center',1140);
 group(fade(t,5.3,.55),()=>text('Nobody has time to test them all.',640,428,72,C.blue,700,'center',1150));
 });
}
function drawIntroduction(t){
 group(envelope(t,10.15,15.96,.65,.5),()=>{
 lightning(573,160,134);
 text('Meet AI Superpowers.',640,411,80,C.ink,700,'center',1100);
 group(fade(t,11.25,.6),()=>text('One AI superpower, every week.',640,491,44,C.blue,700,'center',1120));
 });
}
function envelopeIcon(cx,cy){
 ctx.save();ctx.strokeStyle='#222C32';ctx.lineWidth=3.5;ctx.lineJoin='round';roundedPath(cx-49,cy-34,98,69,7);ctx.stroke();ctx.beginPath();ctx.moveTo(cx-31,cy-20);ctx.lineTo(cx+3,cy+15);ctx.lineTo(cx+32,cy-11);ctx.stroke();ctx.restore();
}
function checkIcon(cx,cy){
 ctx.save();ctx.strokeStyle='#222C32';ctx.lineWidth=5.5;ctx.beginPath();ctx.arc(cx,cy,43,0,Math.PI*2);ctx.stroke();ctx.strokeStyle=C.yellow;ctx.lineWidth=8;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(cx-22,cy+4);ctx.lineTo(cx-7,cy+20);ctx.lineTo(cx+23,cy-18);ctx.stroke();ctx.restore();
}
function stepCard(index){
 const x=129+(index-1)*354,cx=x+157;
 box(x,241,314,287,21,C.white,true);
 ctx.save();ctx.fillStyle=C.yellow;ctx.beginPath();ctx.arc(cx,286,21,0,Math.PI*2);ctx.fill();ctx.restore();text(String(index),cx,294,25,C.ink,700);
 if(index===1){envelopeIcon(cx,370);text('Subscribe for free',cx,458,26,C.ink,700,'center',286);}
 if(index===2){lightning(cx-43,327,86);text('Get one tested prompt',cx,458,26,C.ink,700,'center',292);text('or workflow',cx,490,26,C.ink,700);}
 if(index===3){checkIcon(cx,371);text('Use it in your work that',cx,458,26,C.ink,700,'center',293);text('week',cx,490,26,C.ink,700);}
}
function drawSteps(t){
 const out=1-fade(t,23.45,.5);
 group(out,()=>{
 group(fade(t,16.3,.65),()=>spacedText('HOW IT WORKS',640,162,31,3,C.blue));
 group(fade(t,16.55,1.05),()=>stepCard(1));
 group(fade(t,18.3,.7),()=>stepCard(2));
 group(fade(t,20.3,.7),()=>stepCard(3));
 });
}
function countAt(t){
 const p=clamp((t-24.25)/1.5);
 const exponent=Math.log(1-1697/2000)/Math.log(.5);
 return Math.round(2000*(1-Math.pow(1-p,exponent)));
}
function drawProof(t){
 group(envelope(t,24.15,28.96,.55,.5),()=>{
 const number=countAt(t).toLocaleString('en-US')+'+';
 text(number,640,330,144,C.ink,700,'center',1100);
 text('subscribers.',640,418,54,C.ink,700);
 group(fade(t,26.3,.6),()=>text('From the founder who built God of Prompt from $0 to $500K.',640,496,34,C.blue,700,'center',1120));
 });
}
function drawClosing(t){
 group(fade(t,29.15,.65),()=>{
 lightning(573,147,134);
 text('AI Superpowers',640,402,80,C.ink,700,'center',1100);
 group(fade(t,30.25,.6),()=>text('Free newsletter, every week.',640,476,44,C.blue,700,'center',1100));
 group(fade(t,31.25,.6),()=>text('by Alex Prompter',640,534,28,C.gray,700));
 });
}
function draw(t){
 // Every visible state is recomputed from absolute composition time.
 ctx.setTransform(1,0,0,1,0,0);ctx.globalAlpha=1;ctx.clearRect(0,0,W,H);ctx.fillStyle=C.bg;ctx.fillRect(0,0,W,H);
 if(t<4)drawIntro(t);
 if(t>=4&&t<10)drawProblem(t);
 if(t>=10&&t<16)drawIntroduction(t);
 if(t>=16&&t<24)drawSteps(t);
 if(t>=24&&t<29)drawProof(t);
 if(t>=29)drawClosing(t);
}
const clock={t:0};
const timeline=gsap.timeline({paused:true});
timeline.to(clock,{t:DURATION,duration:DURATION,ease:'none',onUpdate:function(){draw(clock.t);}},0);
draw(0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
})();
</script>
</body>
</html>
