<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Negroni — a 30 second recipe</title>
<style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#faf9f4}body{position:relative}#root{position:relative;width:100%;height:100%;overflow:hidden;background:#faf9f4}canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
</style>
</head>
<body>
<div id="root" data-composition-id="main" data-width="1080" data-height="1080" data-duration="30">
<canvas id="art" class="clip" data-start="0" data-duration="30" width="1080" height="1080" aria-label="A silent, illustrated Negroni recipe: ice, one ounce gin, one ounce Campari, one ounce sweet vermouth, stir, and garnish with orange peel."></canvas>
</div>
<script src="gsap.min.js"></script>
<script>
/*
Editable procedural reconstruction from the supplied contact sheet and brief.
Asset ledger: original Canvas drawings; generic sans-serif; harness-provided gsap.min.js.
No reference frames, raster assets, downloaded fonts, audio, or network requests.
Timing is inferred. This source has not been rendered or visually validated.
*/
(function(){
'use strict';
const canvas=document.getElementById('art');
const c=canvas.getContext('2d');
const P={paper:'#faf9f4',ink:'#454442',muted:'#777770',pink:'#ed7d89',palePink:'#f4c7ca',blue:'#dcf0f2',orange:'#efad42'};
const STEP_START=[3,6,11,16,21,25];
const STEP_END=[5.75,10.65,15.65,20.65,24.85,27.25];
const LABELS=['ICE','GIN','CAMPARI','VERMOUTH','STIR','PEEL'];
const RECIPES=[
 {big:'FILL',name:'ICE',note:'big cubes · rocks glass'},
 {big:'1 OZ',name:'GIN',note:'London dry · 30 ml'},
 {big:'1 OZ',name:'CAMPARI',note:'the bitter one · 30 ml'},
 {big:'1 OZ',name:'SWEET VERMOUTH',note:'sweet red · 30 ml'},
 {big:'20 SEC',name:'STIR',note:'until nice and cold'},
 {big:'1',name:'ORANGE PEEL',note:'express the oils, drop it in'}
];
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,p)=>a+(b-a)*p;
const smooth=p=>{p=clamp(p);return p*p*(3-2*p)};
const phase=(t,a,b)=>clamp((t-a)/(b-a));
const easeOut=p=>1-Math.pow(1-clamp(p),3);
const mix=(a,b,p)=>{const A=a.match(/\w\w/g).map(x=>parseInt(x,16));const B=b.match(/\w\w/g).map(x=>parseInt(x,16));return 'rgb('+A.map((v,i)=>Math.round(lerp(v,B[i],p))).join(',')+')'};
function line(x1,y1,x2,y2,color=P.ink,width=2){c.beginPath();c.moveTo(x1,y1);c.lineTo(x2,y2);c.strokeStyle=color;c.lineWidth=width;c.lineCap='round';c.stroke()}
function ellipse(x,y,rx,ry,fill,stroke=P.ink,width=2){c.beginPath();c.ellipse(x,y,rx,ry,0,0,Math.PI*2);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function sketch(path,fill,stroke=P.ink,width=2){const p=new Path2D(path);if(fill){c.fillStyle=fill;c.fill(p)}if(stroke){c.lineWidth=width;c.strokeStyle=stroke;c.lineJoin='round';c.lineCap='round';c.stroke(p);c.save();c.translate(.8,-.6);c.globalAlpha*=.25;c.lineWidth=.8;c.stroke(p);c.restore()}}
function text(str,x,y,size=20,color=P.ink,weight=400,align='left',maxWidth){c.save();c.font=weight+' '+size+'px sans-serif';c.fillStyle=color;c.textAlign=align;c.textBaseline='alphabetic';if(maxWidth)c.fillText(str,x,y,maxWidth);else c.fillText(str,x,y);c.restore()}
function comic(str,x,y,size,width,alpha=1,reveal=1,center=false){
 c.save();c.globalAlpha*=alpha;c.font='900 '+size+'px sans-serif';
 const total=c.measureText(str).width;const sx=width/total;
 c.translate(x-(center?width/2:0),y);c.scale(sx,1);
 c.beginPath();c.rect(-8,-size*1.25,(total+18)*clamp(reveal),size*1.6);c.clip();
 let cursor=0;
 for(let i=0;i<str.length;i++){
  const char=str[i],w=c.measureText(char).width;
  c.save();c.translate(cursor+w/2,Math.sin(i*2.3)*1.5);c.rotate(Math.sin(i*3.7)*.022);c.transform(1,0,-.055,1,0,0);
  c.textAlign='center';c.lineJoin='round';c.lineWidth=size*.078;c.strokeStyle=P.ink;c.strokeText(char,1,2);c.fillStyle=P.pink;c.fillText(char,0,0);
  c.lineWidth=.85;c.strokeStyle='rgba(69,68,66,.55)';c.strokeText(char,-.6,-.4);c.restore();cursor+=w;
 }
 c.restore();
}
function header(t){
 const settle=smooth(phase(t,2.35,3.2));
 const y=lerp(506,126,settle),size=lerp(112,78,settle),width=lerp(654,402,settle);
 const reveal=phase(t,.12,1.85);
 comic('NEGRONI',540,y,size,width,1,reveal,true);
 const introAlpha=smooth(phase(t,1.45,2.1))*(1-settle);
 text('a 30 second recipe',540,y+49,23,'#96968d',400,'center');
 if(introAlpha<1){c.save();c.globalAlpha=1-introAlpha;c.fillStyle=P.paper;c.fillRect(280,y+25,520,34);c.restore()}
 if(settle>0){c.save();c.globalAlpha=settle;text('equal parts · stirred · on the rocks',540,168,18,P.muted,400,'center');c.restore()}
}
const GLASS='M220 434 C226 531 234 666 247 764 Q363 797 483 764 C495 666 503 531 510 434 C434 453 298 453 220 434 Z';
const INTERIOR='M225 437 C231 533 240 669 251 760 Q365 790 479 760 C490 668 498 532 505 437 Z';
function volumeAt(t){return phase(t,7.05,10.15)+phase(t,12.05,15.15)+phase(t,17.05,20.15)}
function liquidColor(t){const cam=phase(t,12.05,15.15),ver=phase(t,17.05,20.15);return ver>0?mix('ed7f8b','a82c43',ver):mix('d5edf1','ed7f8b',cam)}
function stirState(t){const entry=smooth(phase(t,21.05,21.6));const exit=smooth(phase(t,24.55,25));const q=phase(t,21.55,24.55);return {entry,exit,q,weight:Math.sin(Math.PI*q),angle:q*Math.PI*10}}
function spoon(t,surface){
 const st=stirState(t);if(t<21.05||t>=25)return;
 const x=365+19*Math.cos(st.angle)*st.weight;
 const dy=-470*(1-st.entry)-470*st.exit;
 c.save();c.translate(0,dy);
 const topX=x+26+10*Math.sin(st.angle)*st.weight;
 line(topX+2,347,x+1,705,'rgba(255,255,255,.75)',7);
 line(topX,347,x,705,'#777b78',4);
 line(topX-2,350,x-2,696,'#c9ccc7',1.3);
 ellipse(topX,343,8,6,'#b9beb8','#737873',1.8);
 c.save();c.translate(x,706);c.rotate(-.1);ellipse(0,0,8,18,'#a9b2ad','#747d77',1.5);c.restore();
 c.restore();
}
function cube(x,y,size,angle,alpha){
 c.save();c.globalAlpha*=alpha;c.translate(x,y);c.rotate(angle);
 const a=size/2;
 const path='M'+(-a+5)+' '+(-a+1)+' L'+(a-8)+' '+(-a-2)+' Q'+(a+1)+' '+(-a)+' '+a+' '+(-a+8)+' L'+(a-2)+' '+(a-6)+' Q'+(a-4)+' '+(a+2)+' '+(a-10)+' '+a+' L'+(-a+4)+' '+(a-2)+' Q'+(-a-3)+' '+a+' '+(-a-2)+' '+(a-8)+' L'+(-a)+' '+(-a+8)+' Q'+(-a)+' '+(-a)+' '+(-a+5)+' '+(-a+1)+' Z';
 sketch(path,'rgba(255,255,255,.39)','#7f8f90',1.9);
 line(-a+9,-a+8,a-11,-a+7,'rgba(255,255,255,.88)',2.4);
 line(-a+8,-a+8,-a+7,a-12,'rgba(255,255,255,.78)',2.3);
 line(-a+9,a-9,a-9,a-9,'rgba(255,255,255,.45)',1.1);
 c.restore();
}
function ice(t,volume){
 const st=stirState(t);
 const cubes=[{x:314,y:721,s:68,r:.3,a:3.4},{x:369,y:675,s:70,r:.58,a:4.08},{x:425,y:716,s:68,r:-.23,a:4.76}];
 cubes.forEach((b,i)=>{
  const p=phase(t,b.a,b.a+.57);if(p<=0)return;
  const fall=easeOut(p);const bounce=p<.76?0:Math.sin((p-.76)/.24*Math.PI)*8;
  const movement=st.weight*st.entry*(1-st.exit);
  const x=b.x+Math.sin(st.angle+i*2.1)*10*movement;
  const y=lerp(253-i*29,b.y-volume*34,fall)-bounce+Math.cos(st.angle+i*2)*6*movement;
  cube(x,y,b.s,b.r+(1-fall)*.8+Math.sin(st.angle+i)*.08*movement,smooth(phase(t,b.a,b.a+.1)));
 });
}
function glass(t){
 const volume=volumeAt(t),surface=758-volume*61;
 sketch(GLASS,'rgba(218,239,242,.24)',null);
 c.save();c.clip(new Path2D(INTERIOR));
 c.fillStyle='rgba(191,223,232,.36)';c.fillRect(215,749,305,44);
 if(volume>.001){
  const color=liquidColor(t);c.globalAlpha=.86;c.fillStyle=color;
  c.fillRect(218,surface,298,245);ellipse(365,surface,143,15,color,null);
  c.globalAlpha=1;
  ellipse(365,surface,143,15,'rgba(255,255,255,.10)','rgba(90,73,76,.48)',1.3);
  c.save();c.globalAlpha=.34;line(250,surface+17,251,749,'#ffffff',3);c.restore();
 }
 const stir=stirState(t);
 if(t>21.5&&t<24.7){
  c.save();c.globalAlpha=stir.weight*.55;
  for(let k=0;k<3;k++)ellipse(365,surface+4+k*4,58+k*30,6+k*3,null,'#f4bac0',1.3);
  c.restore();
 }
 spoon(t,surface);
 ice(t,volume);
 c.restore();
 // Each cube is drawn outside the clipping region only while falling above the rim.
 if(t<5.4){
  c.save();c.beginPath();c.rect(150,150,430,284);c.clip();ice(t,volume);c.restore();
 }
 // The upper handle remains visible above the glass.
 if(t>=21.05&&t<25){c.save();c.beginPath();c.rect(200,-200,330,635);c.clip();spoon(t,surface);c.restore()}
 sketch('M220 434 C226 531 234 666 247 764 Q363 797 483 764 C495 666 503 531 510 434',null,P.ink,2.4);
 ellipse(365,434,145,22,'rgba(232,247,248,.28)',P.ink,2.1);
 c.save();c.globalAlpha=.33;ellipse(365.8,434.8,144,22,null,P.ink,.8);c.restore();
 sketch('M230 467 C236 554 245 675 253 739',null,'rgba(255,255,255,.88)',4);
 sketch('M249 765 Q365 786 482 763',null,'#6f9097',1.5);
 // Ounce marks are added as the recipe reaches them.
 for(let n=1;n<=3;n++){
  const a=smooth(phase(volume,n-.08,n+.03));if(a<=0)continue;
  const y=758-n*61;c.save();c.globalAlpha=a;
  line(514,y,530,y,n===1?'#a77d87':'#98747d',1.4);
  text(n+' oz',540,y+5,16,'#8b6874',400);c.restore();
 }
}
function bottleShape(type){
 const palette=[{body:'#d9eef0',edge:'#63868c',label:'#fbfaf4',name:'GIN',small:'LONDON DRY'},{body:'#ce344d',edge:'#81283a',label:'#fff4dd',name:'CAMPARI',small:''},{body:'#642d37',edge:'#43262b',label:'#f1e1be',name:'SWEET',small:'VERMOUTH'}][type];
 sketch('M-12 -125 L12 -125 L12 -67 Q12 -58 24 -49 Q36 -43 36 -26 L34 105 Q0 112 -34 105 L-36 -26 Q-36 -43 -24 -49 Q-12 -58 -12 -67 Z',palette.body,palette.edge,2.5);
 sketch('M-13 -126 Q0 -131 13 -126 L13 -119 Q0 -116 -13 -120 Z',palette.body,palette.edge,1.6);
 sketch('M-25 -20 L25 -20 L25 64 L-25 64 Z',palette.label,palette.edge,1.3);
 text(palette.name,0,18,type===2?13:16,palette.edge,900,'center',45);
 if(palette.small)text(palette.small,0,35,type===2?10:7,palette.edge,700,'center',45);
 line(-24,-35,-23,86,'rgba(255,255,255,.5)',3);
 line(-6,-111,-6,-65,'rgba(255,255,255,.55)',2);
 line(-23,78,23,78,'rgba(255,255,255,.2)',1);
}
function bottle(t,start,type){
 const local=t-start;if(local<0||local>=5)return;
 let x,y,angle,alpha=1;
 if(local<.7){const p=easeOut(local/.7);x=lerp(1125,174,p);y=lerp(235,310,p);angle=0;alpha=smooth(local/.16)}
 else if(local<1.05){const p=smooth((local-.7)/.35);x=174;y=310;angle=1.96*p}
 else if(local<4.15){x=174;y=310;angle=1.96}
 else if(local<4.6){const p=smooth((local-4.15)/.45);x=lerp(174,87,p);y=310;angle=1.96*(1-p)}
 else{const p=easeOut((local-4.6)/.4);x=lerp(87,-90,p);y=310;angle=0;alpha=1-p}
 const pouring=local>=1.05&&local<4.15;
 if(pouring){
  const mouth={x:x+125*Math.sin(angle),y:y-125*Math.cos(angle)};
  const surface=758-volumeAt(t)*61;
  const impactX=342+2*Math.sin(t*9);
  const impactY=surface+12;
  const flow=Math.min(smooth((local-1.05)/.1),smooth((4.15-local)/.1));
  c.save();c.globalAlpha=alpha*flow;
  const path='M'+mouth.x+' '+mouth.y+' C'+(mouth.x+33)+' '+(mouth.y+24)+' '+(impactX-13)+' '+(mouth.y+82)+' '+impactX+' '+impactY;
  sketch(path,null,type===0?'#759ba1':type===1?'#a52640':'#642737',8);
  sketch(path,null,type===0?'#d7f1f4':type===1?'#e65e73':'#a64a58',4.6);
  ellipse(impactX,impactY,13+3*Math.sin(t*11),3,null,type===0?'#8eb7bd':'#edb3bd',1.6);
  for(let j=0;j<3;j++){
   const q=(t*2+j*.31)%1;
   const dx=(j-1)*16*q;
   const dy=-Math.sin(q*Math.PI)*16;
   ellipse(impactX+dx,impactY+dy,1.8,3,type===0?'#b9dce2':'#df8897',null);
  }
  c.restore();
 }
 c.save();c.globalAlpha=alpha;c.translate(x,y);c.rotate(angle);bottleShape(type);c.restore();
}
function peel(t){
 if(t<25.15)return;
 const entry=easeOut(phase(t,25.15,25.75));
 const drop=smooth(phase(t,26.15,26.9));
 const y=lerp(329,424,drop);
 const x=lerp(275,334,entry);
 const expression=Math.sin(Math.PI*phase(t,25.65,26.4));
 c.save();c.globalAlpha=entry;
 if(expression>0){
  c.save();c.globalAlpha*=expression;
  for(let j=0;j<5;j++){const px=356+j*20;line(px,421+(j%2)*5,px+(j-2)*3,435+(j%2)*5,'#e9b450',1.9)}
  c.restore();
 }
 c.translate(x,y);c.rotate(lerp(-.2,.025,drop));
 c.beginPath();
 for(let i=0;i<=150;i++){
  const u=i/150,px=132*u+15*Math.sin(u*Math.PI*6),py=-17*Math.cos(u*Math.PI*6);
  if(i===0)c.moveTo(px,py);else c.lineTo(px,py);
 }
 c.lineCap='round';c.lineJoin='round';c.strokeStyle='#8d683b';c.lineWidth=9;c.stroke();c.strokeStyle=P.orange;c.lineWidth=6;c.stroke();
 c.save();c.translate(-.5,-1);c.globalAlpha*=.7;c.strokeStyle='#ffe3a0';c.lineWidth=1.5;c.stroke();c.restore();c.restore();
}
function stageIndex(t){if(t>=27.5)return 6;let n=0;for(let i=0;i<STEP_START.length;i++)if(t>=STEP_START[i])n=i;return n}
function cardProgress(t,index){
 if(index===0)return Math.min(3,[3.97,4.65,5.33].filter(v=>t>=v).length)/3;
 if(index<=3)return phase(t,STEP_START[index]+1.05,STEP_START[index]+4.15);
 if(index===4)return phase(t,21.55,24.55);
 return phase(t,25.3,27.15);
}
function card(t){
 const index=stageIndex(t),final=index===6;
 const since=t-(final?27.5:STEP_START[index]);
 const entrance=easeOut(phase(since,0,.28));
 c.save();c.translate(0,(1-entrance)*10);c.globalAlpha=.78+.22*entrance;
 c.translate(645,500);c.rotate(-.009);
 const shape='M13 2 L368 0 Q382 1 382 15 L384 228 Q383 244 367 243 L13 244 Q0 244 0 230 L0 17 Q0 3 13 2 Z';
 c.save();c.translate(4,5);sketch(shape,'#f2cace',null);c.restore();
 sketch(shape,'#fffefa',P.ink,2.1);
 if(final){
  text('THAT’S A NEGRONI',24,37,16,'#9d6b75',700);
  comic('CIN CIN!',24,111,61,261);
  text('1:1:1',24,159,44,P.ink,900);
  text('gin · Campari · sweet vermouth',24,200,17,P.muted,400,'left',337);
 }else{
  const r=RECIPES[index],p=cardProgress(t,index);
  text('STEP '+(index+1)+' OF 6',24,35,16,'#9d6b75',700);
  comic(r.big,24,103,index===4?58:64,index===0?132:index===4?225:index===5?45:135);
  text(r.name,24,147,index===3?29:34,P.ink,900,'left',337);
  text(r.note,24,179,index===5?17:18,P.muted,400,'left',337);
  sketch('M26 202 L257 202 Q264 202 264 208 Q264 214 257 214 L26 214 Q20 214 20 208 Q20 202 26 202 Z','#faf9f4','#8d8d85',1.4);
  if(p>0){c.save();c.beginPath();c.rect(23,203,238*p,10);c.clip();sketch('M27 205 L257 205 Q261 205 261 208 Q261 211 257 211 L27 211 Q23 211 23 208 Q23 205 27 205 Z',P.pink,null);c.restore()}
  let amount='';
  if(index===0)amount=Math.round(p*3)+' / 3';
  else if(index<=3)amount=p.toFixed(1)+' / 1 oz';
  else if(index===4)amount=Math.round(p*20)+' / 20 s';
  else amount=p>=1?'done':Math.round(p*100)+'%';
  text(amount,360,213,index<=3&&index!==0?14:16,P.ink,500,'right',88);
 }
 c.restore();
}
function progress(t){
 const nodes=LABELS.map((label,i)=>({x:150+i*160,y:925,label}));
 const active=Math.min(5,stageIndex(t));
 for(let i=0;i<5;i++){
  const a=nodes[i],b=nodes[i+1];
  line(a.x+14,a.y,b.x-14,b.y,'#deded5',2.6);
  const p=smooth(phase(t,STEP_END[i]-.13,STEP_START[i+1]+.18));
  if(p>0)line(a.x+14,a.y,lerp(a.x+14,b.x-14,p),b.y,P.pink,3.1);
 }
 nodes.forEach((n,i)=>{
  const done=t>=STEP_END[i];
  const current=i===active&&!done;
  if(current){c.save();c.globalAlpha=.3;ellipse(n.x,n.y,16,16,null,P.pink,1.6);c.restore()}
  ellipse(n.x,n.y,11.8,11.8,done?P.pink:P.paper,done?'#b35e6c':current?'#b96a77':'#bcbfb5',1.9);
  if(done){sketch('M'+(n.x-5)+' '+n.y+' L'+(n.x-1)+' '+(n.y+4)+' L'+(n.x+6)+' '+(n.y-5),null,'#fffaf4',2.5)}
  else text(String(i+1),n.x,n.y+4.4,12,current?P.ink:'#a4a79d',700,'center');
  text(n.label,n.x,960,i===3?13:14,done||current?(current?'#a86372':P.ink):'#92958b',600,'center');
 });
}
function celebration(t){
 if(t<27.5)return;
 const enter=smooth(phase(t,27.5,27.85));
 const fade=1-smooth(phase(t,28.8,29.55));
 const a=enter*fade;
 c.save();c.globalAlpha=a;
 const marks=[[188,566,170,558],[190,626,169,631],[201,691,184,702],[526,548,543,536],[536,616,557,613],[526,681,543,693],[298,390,294,370],[470,384,478,367]];
 marks.forEach((m,i)=>line(m[0],m[1],lerp(m[0],m[2],enter),lerp(m[1],m[3],enter),i%3===0?'#e9b850':P.palePink,3));
 c.restore();
}
function draw(time){
 const t=clamp(time,0,30);
 c.setTransform(1,0,0,1,0,0);c.globalAlpha=1;c.globalCompositeOperation='source-over';c.setLineDash([]);c.shadowBlur=0;c.lineCap='round';c.lineJoin='round';
 c.clearRect(0,0,1080,1080);c.fillStyle=P.paper;c.fillRect(0,0,1080,1080);
 const ui=smooth(phase(t,2.85,3.35));
 if(ui>0){
  c.save();c.globalAlpha=ui;c.translate(0,(1-ui)*20);
  glass(t);
  bottle(t,6,0);bottle(t,11,1);bottle(t,16,2);
  peel(t);card(t);progress(t);celebration(t);
  c.restore();
 }
 header(t);
}
const playhead={t:0};
const timeline=gsap.timeline({paused:true});
timeline.to(playhead,{t:30,duration:30,ease:'none',onUpdate:function(){draw(playhead.t)}},0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=timeline;
draw(0);
})();
</script>
</body>
