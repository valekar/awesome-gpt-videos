<body>

<script>
(()=>{
'use strict';
const W=1920,H=1080,D=42,cv=document.getElementById('game'),g=cv.getContext('2d');
const clock={t:0},events=[];
const C={cyan:'#76edff',orange:'#ffb779',red:'#ff7864',white:'#e6f2ff',muted:'#839aad'};
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const mix=(a,b,p)=>a+(b-a)*p;
const smooth=(a,b,t)=>{const p=clamp((t-a)/(b-a),0,1);return p*p*(3-2*p)};
const hash=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453;return v-Math.floor(v)};
const V=(x,y,z)=>({x,y,z});
const add=(a,b)=>V(a.x+b.x,a.y+b.y,a.z+b.z);
const sub=(a,b)=>V(a.x-b.x,a.y-b.y,a.z-b.z);
const mul=(a,s)=>V(a.x*s,a.y*s,a.z*s);
const dot=(a,b)=>a.x*b.x+a.y*b.y+a.z*b.z;
const cross=(a,b)=>V(a.y*b.z-a.z*b.y,a.z*b.x-a.x*b.z,a.x*b.y-a.y*b.x);
const norm=a=>mul(a,1/(Math.hypot(a.x,a.y,a.z)||1));
const lerp3=(a,b,p)=>add(a,mul(sub(b,a),p));
function camera(t){
 const p=smooth(0,36,t),escape=smooth(36,42,t);
 const pos=V(480-250*p+480*escape,570-190*p+200*escape,-650+600*p-100*escape);
 const f=norm(sub(V(0,30,1550),pos)),r=norm(cross(f,V(0,1,0))),u=norm(cross(r,f));

}
function project(p,c){const v=sub(p,c.pos),z=dot(v,c.f);return {x:W/2+dot(v,c.r)*1070/Math.max(z,1),y:H/2-dot(v,c.u)*1070/Math.max(z,1),z};}
function local(c,x,y,z){return add(c.pos,add(mul(c.r,x),add(mul(c.u,y),mul(c.f,z))))}
const components=[
 {name:'PORT SHIELD',short:'SHIELD 01',p:V(-205,240,2030),unlock:6},
 {name:'STARBOARD SHIELD',short:'SHIELD 02',p:V(205,240,2030),unlock:14},
 {name:'COMMAND BRIDGE',short:'BRIDGE',p:V(0,175,2030),unlock:22},
 {name:'REACTOR ARRAY',short:'REACTOR',p:V(0,26,1300),unlock:30}
];
const enemies=Array.from({length:24},(_,id)=>({id,spawn:3+Math.floor(id/8)*10+(id%8)*.47,side:id%2?1:-1,phase:hash(id+40)*6.28}));
function enemyPosition(e,t,c){const age=t-e.spawn;return local(c,e.side*(280+110*Math.sin(age*.7+e.phase)),100+140*Math.sin(age*.95+e.phase),2050-age*300)}
function shipPosition(i,p,c,t){return local(c,(i?108:-108)+p.x*80,-112-p.y*52+Math.sin(t*1.4+i)*3,390)}
function simulate(t){
 const hp=[36,36,36,36],dead=[null,null,null,null],killed={},kills=[],shots=[],sparks=[];
 const pilots=[{x:0,y:0,manual:false,hull:100,aim:null},{x:0,y:0,manual:false,hull:100,aim:null}];

 for(let n=0;n<=steps;n++){
  const ts=n/30,c=camera(ts);let active=hp.findIndex(v=>v>0);
  while(ei<events.length&&events[ei].t<=ts){const e=events[ei++];held[e.k]=e.d;if(e.d){const ix=['KeyI','KeyJ','KeyK','KeyL','ShiftRight'].includes(e.k)?1:0;pilots[ix].manual=true;}}
  for(let i=0;i<2;i++){

   else {p.x=Math.sin(ts*.6+i)*.15;p.y=Math.cos(ts*.7+i)*.12;}
   let aim;
   if(!p.manual&&active>=0){const q=project(components[active].p,c);aim={x:q.x+(i?8:-8),y:q.y};}
   else aim={x:W*.5+p.x*W*.32,y:H*.48+p.y*H*.29};
   p.aim=aim;
   if(n%14!==i*7||ts<3||active<0||p.hull<=0)continue;
   if(p.manual&&!held[keys[4]])continue;
   const from=shipPosition(i,p,c,ts);let to=local(c,(aim.x-W/2)*1.8,-(aim.y-H/2)*1.8,1926),hit=-1,enemyHit=null;
   if(!p.manual&&ts>=components[active].unlock){hit=active;to=components[active].p;}
   if(p.manual){
    for(const e of enemies){const age=ts-e.spawn;if(age<0||age>5.2||killed[e.id]!=null)continue;const wp=enemyPosition(e,ts,c),q=project(wp,c);if(Math.hypot(q.x-aim.x,q.y-aim.y)<58){enemyHit=e;to=wp;break;}}
    if(!enemyHit)for(let j=0;j<4;j++){const q=project(components[j].p,c);if(hp[j]>0&&ts>=components[j].unlock&&Math.hypot(q.x-aim.x,q.y-aim.y)<75){hit=j;to=components[j].p;break;}}
   }
   if(enemyHit){killed[enemyHit.id]=ts;kills.push({t:ts,p:to,small:true});}
   if(hit>=0){hp[hit]=Math.max(0,hp[hit]-1.5);if(hp[hit]===0){dead[hit]=ts;kills.push({t:ts,p:to,small:false});}else if(ts>t-.3)sparks.push({t:ts,p:to});}

 }

}
let faces=[];
function face(v,color,stroke='#60788b',alpha=1){faces.push({v,color,stroke,alpha})}
function box(x,y,z,w,h,d,color='#334653'){
 const a=V(x-w/2,y,z-d/2),b=V(x+w/2,y,z-d/2),c=V(x+w/2,y,z+d/2),d0=V(x-w/2,y,z+d/2);
 const A=add(a,V(0,h,0)),B=add(b,V(0,h,0)),C0=add(c,V(0,h,0)),E=add(d0,V(0,h,0));
 face([a,b,B,A],'#182936');face([b,c,C0,B],'#263c4b');face([c,d0,E,C0],'#20313e');face([d0,a,A,E],'#3e5360');face([A,B,C0,E],color);
}
function dome(x,y,z,r,broken){
 for(let lat=0;lat<4;lat++)for(let k=0;k<12;k++){
  const a=lat*Math.PI/8,b=(lat+1)*Math.PI/8,q=k*Math.PI/6,s=(k+1)*Math.PI/6;
  const p=(u,v)=>V(x+Math.cos(u)*Math.cos(v)*r,y+Math.sin(u)*r,z+Math.cos(u)*Math.sin(v)*r);
  face([p(a,q),p(a,s),p(b,s),p(b,q)],broken?'#192731':(k%3?'#6e8998':'#a4bdc7'),broken?'#293844':'#b0c9d3');
 }
}

function xwing(pos,c,scale,roll,color){

function tie(pos,c,phase){

function paintFaces(c){
 const list=faces.map(f=>({...f,q:f.v.map(v=>project(v,c))})).filter(f=>f.q.every(p=>p.z>15));
 list.sort((a,b)=>b.q.reduce((s,p)=>s+p.z,0)/b.q.length-a.q.reduce((s,p)=>s+p.z,0)/a.q.length);
 for(const f of list){g.globalAlpha=f.alpha;g.beginPath();f.q.forEach((p,i)=>i?g.lineTo(p.x,p.y):g.moveTo(p.x,p.y));g.closePath();g.fillStyle=f.color;g.fill();g.lineWidth=.9;g.strokeStyle=f.stroke;g.stroke();}g.globalAlpha=1;

function line(a,b,col,width=2,alpha=1){g.globalAlpha=alpha;g.strokeStyle=col;g.lineWidth=width;g.beginPath();g.moveTo(a.x,a.y);g.lineTo(b.x,b.y);g.stroke();g.globalAlpha=1;}
function glow(x,y,r,col,alpha=1){g.save();g.globalAlpha=alpha;const d=g.createRadialGradient(x,y,0,x,y,r);d.addColorStop(0,col);d.addColorStop(.16,col);d.addColorStop(1,'transparent');g.fillStyle=d;g.fillRect(x-r,y-r,r*2,r*2);g.restore();}

 glow(1420,280,740,'#172549',.7);glow(210,650,620,'#0b3045',.55);
 for(let i=0;i<460;i++){const z=.25+hash(i+900)*.75,x=(hash(i+12)*2200-t*(1+z*3)+2200)%2200-140,y=hash(i+510)*1080;g.globalAlpha=.25+hash(i+71)*.6;g.fillStyle=i%9?'#c0d6ea':'#85c5fa';g.fillRect(x,y,z*2.3,z*2.3);}g.globalAlpha=1;

function explosion(p,age,c,small=false){
 if(age<0||age>3.5)return;const q=project(p,c);if(q.z<10)return;const k=1070/q.z,fade=1-smooth(.35,3.5,age),size=(small?32:100)*k;

 text('ENTER  PLAY / RESTART',960,1051,16,'#7892a5','center');
 if(t<3.7){const opacity=smooth(.15,.8,t)*(1-smooth(2.8,3.7,t));g.save();g.globalAlpha=opacity;text('BREAK THE SHIELD.',960,345,72,C.white,'center',700);text('Four critical targets. One squadron.',960,407,29,'#a7c7db','center');text('AUTOPILOT DEMO  ·  USE EITHER PILOT’S CONTROLS TO JOIN',960,454,19,C.cyan,'center');g.restore();}
 if(s.won){const last=Math.max(...s.dead),a=smooth(last+.4,last+1.3,t);g.save();g.globalAlpha=a;panel(475,345,970,245);g.fillStyle=C.cyan;g.fillRect(475,345,970,3);text('MISSION COMPLETE',960,393,22,C.cyan,'center',700);text('DESTROYER DISABLED',960,455,55,C.white,'center',700);text('4 / 4 COMPONENTS  ·  SQUADRON EXTRACTING',960,516,23,'#a9c8d9','center');g.restore();}
 else if(t>40){g.save();g.globalAlpha=smooth(40,41,t);panel(575,360,770,180);text('ASSAULT WINDOW CLOSED',960,415,42,C.white,'center',700);text(complete+' / 4 COMPONENTS DISABLED  ·  ENTER TO RETRY',960,478,22,C.cyan,'center');g.restore();}
}
function render(t){
 const s=simulate(t),c=camera(t);g.setTransform(1,0,0,1,0,0);g.globalAlpha=1;g.globalCompositeOperation='source-over';background(t);faces=[];destroyer(s,t);
 for(const e of enemies){const age=t-e.spawn;if(age<0||age>5.2||s.killed[e.id]!=null)continue;tie(enemyPosition(e,t,c),c,Math.sin(age*.8+e.phase)*.22);}
 const engines=[];
 for(let i=0;i<2;i++)engines.push(...xwing(shipPosition(i,s.pilots[i],c,t),c,.84,-s.pilots[i].x*.24,i?'#d39a58':'#b84e4b'));
 for(let i=0;i<2;i++)engines.push(...xwing(local(c,(i?1:-1)*(330+20*Math.sin(t)),50+20*Math.sin(t*.6+i),920+40*Math.cos(t*.6+i)),c,.75,Math.sin(t*.5+i)*.13,i?'#d39a58':'#b84e4b'));
 paintFaces(c);
 for(const p of engines){const q=project(p,c);glow(q.x,q.y,Math.max(7,1070/q.z*8),'#ff8dba',.85);}
 // Shield energy is removed by the first two objective hits.
 for(let i=0;i<2;i++)if(s.hp[i]>0){const q=project(components[i].p,c),r=55*1070/q.z;glow(q.x,q.y,r*1.7,'#3cc5f0',.25);g.strokeStyle='rgba(125,228,255,.45)';g.lineWidth=1.5;g.beginPath();g.ellipse(q.x,q.y,r,r*.65,-.13,0,6.283);g.stroke();}
 for(const b of s.shots){const age=t-b.t,p=clamp(age/.23,0,1),a=project(lerp3(b.from,b.to,Math.max(0,p-.18)),c),z=project(lerp3(b.from,b.to,p),c);if(p<1){line(a,z,b.i?'#ffc58d':'#ff756a',5,1);line(a,z,'#fff3db',1.6,1);glow(z.x,z.y,15,b.i?'#ffb275':'#ff5c67',.7);}}
 // Destroyer batteries launch deterministic green bolts toward the squadron.
 for(let j=0;j<8;j++){
  const period=2.25,phase=t-j*.27,cycle=Math.floor(phase/period),age=phase-cycle*period;if(phase<0||age>.85||s.won)continue;
  const z=1000+(j%4)*240,w=(z-300)/2000*720,origin=V((j%2?1:-1)*w*.76,42,z),dest=local(c,Math.sin(cycle*2.1+j)*270,-100,150);
  const p=age/.85,a=project(lerp3(origin,dest,Math.max(0,p-.09)),c),b=project(lerp3(origin,dest,p),c);if(a.z>10&&b.z>10){line(a,b,'#8cff88',3,1);glow(b.x,b.y,8,'#7aff80',.7);}
 }
 for(const e of enemies){const age=t-e.spawn;if(age>=2&&age<4.5&&s.killed[e.id]==null){const f=(age-2)%1.1;if(f<.35){const origin=enemyPosition(e,t-f,c),dest=local(c,e.side*80,-100,260),p=f/.35;line(project(lerp3(origin,dest,Math.max(0,p-.12)),c),project(lerp3(origin,dest,p),c),'#92ff9a',3,.9);}}
  if(age>5.2&&age<6.7&&s.killed[e.id]==null)explosion(enemyPosition(e,e.spawn+5.2,camera(e.spawn+5.2)),age-5.2,c,true);
 }
 for(const k of s.kills)explosion(k.p,t-k.t,c,k.small);
 for(const p of s.sparks){const q=project(p.p,c);glow(q.x,q.y,25,'#fff1b2',1-(t-p.t)/.3);}
 for(let i=0;i<4;i++)if(s.dead[i]!=null){const age=t-s.dead[i],q=project(components[i].p,c);if(age>.3){glow(q.x,q.y,34,'#ff6c38',.45+.15*Math.sin(age*7));for(let j=0;j<7;j++){const drift=(age*.13+j*.19)%1;g.fillStyle='rgba(18,25,34,'+(.32*(1-drift))+')';g.beginPath();g.arc(q.x+Math.sin(j*4)*14+drift*30,q.y-drift*140,14+drift*42,0,6.283);g.fill();}}}
 const vignette=g.createRadialGradient(960,520,300,960,520,1110);vignette.addColorStop(0,'transparent');vignette.addColorStop(1,'rgba(0,3,11,.64)');g.fillStyle=vignette;g.fillRect(0,0,W,H);
 hud(s,t,c);
}
const tl=gsap.timeline({paused:true});
tl.to(clock,{t:D,duration:D,ease:'none',onUpdate:()=>render(clock.t)},0);
window.__timelines=window.__timelines||{};
window.__timelines['main']=tl;
const controls=new Set(['KeyW','KeyA','KeyS','KeyD','Space','KeyI','KeyJ','KeyK','KeyL','ShiftRight']);
const physical=new Set();
function input(e,down){
 if(e.code==='Enter'&&down&&!e.repeat){e.preventDefault();events.length=0;physical.clear();tl.restart();return;}
 if(!controls.has(e.code))return;e.preventDefault();
 if(down&&physical.has(e.code))return;
 if(down)physical.add(e.code);else physical.delete(e.code);
 // An edit after seeking replaces subsequent input history.
 while(events.length&&events[events.length-1].t>clock.t)events.pop();
 events.push({t:clock.t,k:e.code,d:down});render(clock.t);
}
window.addEventListener('keydown',e=>input(e,true));window.addEventListener('keyup',e=>input(e,false));
window.addEventListener('blur',()=>{for(const k of physical)events.push({t:clock.t,k,d:false});physical.clear();});
render(0);
})();
