<!doctype html>
<html lang='en'>
<head>

<meta name='viewport' content='width=device-width,initial-scale=1'>
<title>Pelican's Golden Hour</title>
<style>
html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#e9d4ae}*{box-sizing:border-box}#root{position:relative;width:100%;height:100%;overflow:hidden}canvas{display:block;width:100%;height:100%}
</style>
</head>
<body>
<div id='root' data-composition-id='main' data-width='1920' data-height='1080' data-duration='24'>
<canvas id='art' class='clip' data-start='0' data-duration='24' width='1920' height='1080' role='img' aria-label='An intricately illustrated white pelican pedals a teal touring bicycle along a sunlit coastal wetland. Its scarf streams in the breeze, its webbed feet follow the pedals, and flowers sway in the woven front basket.'></canvas>
</div>
<script src='gsap.min.js'></script>
<script>
'use strict';
/* EDITABLE ART DIRECTION --------------------------------------------------
   One continuous tracking shot. All coordinates are in a 1920 × 1080 stage.
   The bicycle is built around its actual hubs, bottom bracket and pedals.
   Both legs use two-link inverse kinematics; feet remain on their pedals.
   Wheel rotation, chain motion and ground translation share one gear model.
   Every moving value is a pure function of the timeline time.
------------------------------------------------------------------------ */
const canvas=document.getElementById('art');
const c=canvas.getContext('2d');
const W=1920,H=1080,DURATION=24,TAU=Math.PI*2;
const ART={
  ink:'#354b49',deep:'#284e50',teal:'#377f7b',tealLight:'#89b9a3',
  cream:'#fff5d8',paper:'#ead9b7',gold:'#d8a24e',orange:'#d98b41',
  coral:'#bd6250',water:'#8db6aa',reeds:'#607d62',wheelRadius:142,
  wheelSpeed:4.2,gearRatio:2,heroX:945,heroY:790
};
const mod=(a,b)=>(a%b+b)%b;
const wrap=(v,a,b)=>a+mod(v-a,b-a);
const clamp=(v,a=0,b=1)=>Math.max(a,Math.min(b,v));
const lerp=(a,b,t)=>a+(b-a)*t;
const smooth=t=>{t=clamp(t);return t*t*(3-2*t)};
const hash=n=>{const v=Math.sin(n*127.1+311.7)*43758.5453123;return v-Math.floor(v)};
function grad(x1,y1,x2,y2,stops){const g=c.createLinearGradient(x1,y1,x2,y2);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function radial(x,y,r,stops){const g=c.createRadialGradient(x,y,0,x,y,r);stops.forEach(s=>g.addColorStop(s[0],s[1]));return g}
function path(d,fill,stroke,width=1){const p=new Path2D(d);if(fill){c.fillStyle=fill;c.fill(p)}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke(p)}return p}
function ellipse(x,y,rx,ry,fill,stroke,width=1,rotation=0){c.beginPath();c.ellipse(x,y,rx,ry,rotation,0,TAU);if(fill){c.fillStyle=fill;c.fill()}if(stroke){c.strokeStyle=stroke;c.lineWidth=width;c.stroke()}}
function stroke(points,color,width=1){c.beginPath();points.forEach((p,i)=>i?c.lineTo(p[0],p[1]):c.moveTo(p[0],p[1]));c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function arc(x,y,r,a,b,color,width){c.beginPath();c.arc(x,y,r,a,b);c.strokeStyle=color;c.lineWidth=width;c.stroke()}
function tube(points,width=15){stroke(points,ART.ink,width+5);stroke(points,ART.teal,width);stroke(points.map(p=>[p[0]-1,p[1]-2]),'#9cc7ad',2.6)}
function flower(x,y,r,color,phase=0){
  c.save();c.translate(x,y);c.rotate(phase);
  for(let k=0;k<9;k++){const a=k*TAU/9;ellipse(Math.cos(a)*r*.69,Math.sin(a)*r*.69,r*.57,r*.27,color,null,1,a)}
  ellipse(0,0,r*.36,r*.36,'#dfae4d','#a17a40',.8);
  for(let k=0;k<9;k++){const a=k*2.4;ellipse(Math.cos(a)*r*.2,Math.sin(a)*r*.2,.9,.9,'#9c753b')}
  c.restore();
}
function leaf(x,y,len,width,angle,color){
  c.save();c.translate(x,y);c.rotate(angle);
  path('M0 0 Q '+(-width)+' '+(-len*.55)+' 0 '+(-len)+' Q '+width+' '+(-len*.55)+' 0 0Z',color);
  path('M0 0 L0 '+(-len),'', '#b6bc83',.75);c.restore();
}
function feather(x,y,len,width,angle,color,detail=true){
  c.save();c.translate(x,y);c.rotate(angle);
  path('M0 0 C '+(-width*.58)+' '+(len*.19)+' '+(-width*.63)+' '+(len*.72)+' 0 '+len+' C '+(width*.65)+' '+(len*.76)+' '+(width*.59)+' '+(len*.19)+' 0 0Z',color,'#a7b4a5',.8);
  if(detail){path('M0 5 Q-2 '+(len*.5)+' 0 '+(len*.94),null,'#a7b3a0',.8);for(let j=2;j<8;j++){const yj=len*j/9;const w=width*.42*Math.sin(Math.PI*j/9);stroke([[0,yj+5],[-w,yj-4]],'rgba(111,135,123,.21)',.65);stroke([[0,yj+5],[w,yj-4]],'rgba(111,135,123,.21)',.65)}}
  c.restore();
}
/* Fixed, seeded paper texture. It never changes between frames. */
const paper=document.createElement('canvas');paper.width=W;paper.height=H;
const pc=paper.getContext('2d');
for(let i=0;i<26000;i++){pc.fillStyle=i%3?'rgba(73,68,42,.18)':'rgba(255,255,233,.5)';const s=.3+hash(i+4)*1.5;pc.fillRect(hash(i+17)*W,hash(i+39)*H,s,s*.6)}

/* LANDSCAPE ------------------------------------------------------------- */
function sky(t){
  c.fillStyle=grad(0,-120,0,690,[[0,'#91b8b8'],[.35,'#cad2b9'],[.7,'#f1d4a5'],[1,'#f5dfb6']]);c.fillRect(-500,-500,2920,1800);
  c.fillStyle=radial(1465,246,590,[[0,'rgba(255,243,194,.83)'],[.32,'rgba(255,225,163,.31)'],[1,'rgba(255,220,153,0)']]);c.fillRect(700,-400,1600,1300);
  ellipse(1465,246,71,71,'#fff0c0');
  ellipse(1465,246,83,83,null,'rgba(255,243,199,.3)',1.2);
  for(let k=0;k<9;k++){
    const x=wrap(k*347+hash(k+4)*100-t*(2+k%3),-500,2450),y=150+hash(k+81)*210;
    c.save();c.translate(x,y);c.scale(.8+hash(k+20)*.7,.7);c.globalAlpha=.17;
    for(let j=0;j<6;j++)ellipse(j*49,Math.sin(j*1.8)*12,76-j*4,19+hash(k*10+j)*13,'#fff6d9');
    c.restore();
  }
  c.save();c.globalAlpha=.055;
  for(let k=0;k<6;k++)path('M1400 130 L'+(-700+k*470)+' 1200 L'+(-450+k*520)+' 1200 L1510 170Z','#fff9d9');
  c.restore();
}
function hill(t,base,amp,speed,color,seed){
  c.beginPath();c.moveTo(-500,base);
  for(let x=-500;x<=2450;x+=24){const u=x+t*speed;const y=base-amp*(.47+.25*Math.sin(u*.0031+seed)+.18*Math.sin(u*.0067+seed*2)+.1*Math.sin(u*.012));c.lineTo(x,y)}
  c.lineTo(2450,850);c.lineTo(-500,850);c.closePath();c.fillStyle=color;c.fill();
}
function lighthouse(t){
  const x=wrap(1630-t*9,-400,2550);

  path('M-72 18 Q-36 -21 18 -9 Q81 -11 106 22Z','#9ba68a');
  path('M-16 0 L-9 -109 L13 -109 L24 0Z','#f6e7be','#879a89',1.5);
  path('M-12 -75 L17 -75 L18 -61 L-13 -61Z','#b98268');
  path('M-10 -109 L14 -109 L18 -116 L-14 -116Z','#657f77');
  path('M-9 -116 L-9 -132 L13 -132 L13 -116Z','#f3daa2','#6f8c82',1);
  path('M-17 -132 L2 -145 L21 -132Z','#a27660');
  stroke([[2,-132],[2,-117]],'#6f8c82',1.2);
  path('M-55 5 L-55 -29 L-19 -29 L-19 5Z','#e4d8ac','#8b9b83',1);
  path('M-61 -29 L-38 -47 L-14 -29Z','#ae8971');
  path('M-43 -13 L-34 -13 L-34 5 L-43 5Z','#849787');
  c.restore();
}
function coast(t){
  c.fillStyle=grad(0,420,0,765,[[0,'#b4c5ac'],[.35,'#a8bfaa'],[1,'#7da698']]);c.fillRect(-500,430,2920,430);
  hill(t,478,91,5,'#a5b7a4',.8);hill(t,495,62,11,'#98ae96',3.2);
  lighthouse(t);
  for(let i=0;i<8;i++){
    const x=wrap(i*391+90-t*17,-500,2600),y=483+Math.sin(i*1.8)*12;
    c.save();c.translate(x,y);c.globalAlpha=.65;
    path('M-39 0 L-39 -35 L33 -35 L33 0Z',i%2?'#d6c9a1':'#ded5b0','#9ca88e',1);
    path('M-47 -35 L-4 -63 L41 -35Z',i%2?'#af8c6e':'#bf9d7c');
    path('M-18 -35 L-18 -49 L-11 -49 L-11 -39Z','#a88970');
    for(let j=0;j<3;j++)path('M'+(-25+j*20)+' -23 h10 v12 h-10Z','#8daca0');
    c.restore();
  }
  hill(t,549,32,23,'#aab392',7);
  c.fillStyle=grad(0,550,0,790,[[0,'#b6c6ab'],[.6,'#87ad9c'],[1,'#739c88']]);c.fillRect(-500,550,2920,265);
  for(let i=0;i<115;i++){
    const y=558+hash(i+93)*226,x=wrap(hash(i+127)*3200-t*(17+(y-550)*.13),-500,2600);
    const length=18+hash(i+441)*102;
    stroke([[x,y],[x+length,y+Math.sin(t*.8+i)*.8]],i%4?'rgba(237,231,188,.27)':'rgba(75,123,108,.2)',.8+hash(i+9));
  }
  for(let i=0;i<42;i++){
    const x=wrap(hash(i+300)*3300-t*59,-500,2600),y=629+hash(i+8)*98;
    ellipse(x,y,20+hash(i+1)*53,3+hash(i+2)*7,'#809d7f');
    for(let j=0;j<5;j++){
      const len=20+hash(i*7+j+10)*46,bend=Math.sin(t*1.25+i+j*.6)*5;
      path('M'+(x+j*5)+' '+y+' q'+(-9+bend)+' '+(-len*.6)+' '+(-4+bend)+' '+(-len),null,'#788e68',1.3);
    }
  }
  // Small flying silhouettes beyond the rider.
  for(let i=0;i<7;i++){
    const x=wrap(170+i*70-t*14,-300,2300),y=290+i%3*28+Math.sin(t*.7+i)*9,flap=Math.sin(t*2.6+i*.8)*5;
    path('M'+(x-11)+' '+(y-flap)+' Q'+(x-5)+' '+(y-6)+' '+x+' '+y+' Q'+(x+5)+' '+(y-6)+' '+(x+13)+' '+(y-flap),null,'#728f85',1.6);
  }
}
function grassClump(x,y,height,seed,t,foreground=false){
  c.save();c.translate(x,y);
  const count=foreground?12:7;
  for(let j=0;j<count;j++){
    const f=hash(seed*31+j),h=height*(.4+f*.6),sx=(hash(seed*13+j)-.5)*39;
    const wind=Math.sin(t*1.8+seed*.7+j*.21)*(foreground?10:5);
    const ex=sx+(f-.5)*h*.6+wind;
    path('M'+sx+' 0 Q'+(sx+ex*.25)+' '+(-h*.52)+' '+ex+' '+(-h),null,j%3===0?'#a3a46a':foreground?'#60765a':'#899266',foreground?2.4:1.5);
    if(j%4===0){c.save();c.translate(ex,-h);c.rotate((ex-sx)/h);ellipse(0,-5,2.4,10,foreground?'#a77d49':'#aa9d64');c.restore()}
  }
  c.restore();
}
function road(t){
  hill(t,759,35,74,'#8e9f76',2);
  for(let i=0;i<49;i++)grassClump(wrap(hash(i+667)*3300-t*111,-500,2600),760+hash(i+38)*30,30+hash(i+74)*65,i+4,t);
  path('M-500 819 Q540 729 1090 772 Q1790 762 2450 825 L2450 1400 L-500 1400Z',grad(0,770,0,1160,[[0,'#b0ac82'],[.23,'#cfbe94'],[.65,'#dfcfaa'],[1,'#b7a480']]));
  path('M-500 821 Q550 733 1090 776 Q1790 766 2450 829',null,'#d9cf9d',8);
  path('M-500 833 Q550 745 1090 788 Q1790 778 2450 841',null,'rgba(96,111,78,.17)',2);
  for(let row=0;row<4;row++){
    const y=829+row*67;
    path('M-500 '+y+' Q480 '+(y-19)+' 1060 '+(y+7)+' Q1720 '+(y+21)+' 2450 '+(y-11),null,'rgba(126,118,85,.1)',row===2?7:2);
  }
  const speed=ART.wheelRadius*ART.wheelSpeed;
  for(let i=0;i<220;i++){
    const x=wrap(hash(i+905)*3600-t*speed,-500,2600),y=805+hash(i+85)*334;
    const r=1+hash(i+65)*4.5;
    ellipse(x,y,r*1.8,r*.43,i%3?'rgba(130,119,83,.21)':'rgba(255,242,201,.43)',null,1,hash(i+1)*.6);
    if(i%12===0)stroke([[x-7,y+3],[x+2,y+4]],'rgba(112,108,75,.12)',1);
  }
  // Occasional fern-shaped roadside leaves.
  for(let i=0;i<9;i++){
    const x=wrap(hash(i+777)*3300-t*speed,-500,2600),y=841+hash(i+343)*140;
    c.save();c.translate(x,y);c.rotate(hash(i)*TAU);c.globalAlpha=.36;
    stroke([[-13,0],[15,0]],'#8a9068',1);
    for(let j=0;j<5;j++){leaf(-10+j*5,0,8,2.7,-.8,'#a4a47a');leaf(-10+j*5,0,8,2.7,2.4,'#a4a47a')}
    c.restore();
  }
}

/* BICYCLE --------------------------------------------------------------- */
function wheel(x,y,t){
  const r=ART.wheelRadius,a=t*ART.wheelSpeed;
  c.save();c.translate(x,y);
  ellipse(0,0,r,r,null,'#344944',23);
  ellipse(0,0,r-1,r-1,null,'#c8b88e',13);
  ellipse(0,0,r-6,r-6,null,'#eee2b7',3);
  ellipse(0,0,r-13,r-13,null,'#768e83',4);
  ellipse(0,0,r-16,r-16,null,'#e8d9ae',1.8);
  // Fine diagonal tire cuts are attached to the rotating tire.
  c.save();c.rotate(a);
  for(let i=0;i<72;i++){
    const q=i*TAU/72;
    stroke([[Math.cos(q)*(r+7),Math.sin(q)*(r+7)],[Math.cos(q+.019)*(r+10),Math.sin(q+.019)*(r+10)]],'#63705b',1.4);
  }
  for(let i=0;i<32;i++){
    const q=i*TAU/32,offset=i%2?.24:-.24;
    stroke([[Math.cos(q+offset)*12,Math.sin(q+offset)*12],[Math.cos(q)*(r-17),Math.sin(q)*(r-17)]],i%2?'rgba(62,88,82,.55)':'rgba(249,238,203,.88)',1.15);
    if(i%4===0)ellipse(Math.cos(q)*(r-19),Math.sin(q)*(r-19),1.8,1.8,'#b0b99d');
  }
  // Amber spoke reflector and brass valve.
  c.save();c.rotate(.7);path('M-4 -104 h8 l3 34 h-14Z','#d6ac56','#a18b52',1);stroke([[0,-101],[0,-73]],'#f7d99a',2);c.restore();
  stroke([[0,-r+14],[0,-r+25]],'#536a61',3);
  c.restore();
  ellipse(0,0,13,13,'#567b70','#314e47',2);
  ellipse(-1,-1,7,7,'#d8bf7f','#738b77',1);
  ellipse(-2,-3,2,2,'#fff0bc');
  c.restore();
}
function fender(x){
  arc(x,0,ART.wheelRadius+13,Math.PI+.1,TAU-.08,'#3e5a50',13);
  arc(x,0,ART.wheelRadius+13,Math.PI+.1,TAU-.08,'#6f9c85',8);
  arc(x,0,ART.wheelRadius+17,Math.PI+.15,TAU-.13,'#b2c7a0',1.8);
  stroke([[x,0],[x-96,-122]],'#6c7d68',3);stroke([[x,0],[x+91,-126]],'#6c7d68',3);
}
function basket(t){
  c.save();c.translate(318,-227);c.rotate(Math.sin(t*2.1)*.008);
  // Stems and foliage emerge behind the basket's rim.
  for(let i=0;i<11;i++){
    const bx=-53+i*10,top=-65-hash(i+99)*61,sway=Math.sin(t*1.8+i*.61)*5;
    path('M'+(bx*.5)+' 15 Q'+(bx+sway)+' -28 '+(bx+sway)+' '+top,null,'#5c8865',2.4);
    leaf(bx*.7,-32,25,7,-.7+(i%2)*1.4,'#6f956c');
    leaf(bx*.65,-13,27,8,.7-(i%2)*1.5,'#87a474');
    if(i%2===0)flower(bx+sway,top,10+hash(i+7)*5,i%4?'#e9b58b':'#fff1cf',t*.06+i);
  }
  for(let i=0;i<4;i++){
    const x=-28+i*21,top=-95-hash(i+12)*50,sw=Math.sin(t*1.7+i)*4;
    path('M'+x+' 0 Q'+(x+sw-16)+' -50 '+(x+sw)+' '+top,null,'#6d8c65',2);
    for(let j=0;j<5;j++)ellipse(x+sw+Math.sin(j*2)*4,top+j*8,3.2,5.4,'#b19b9f',null,1,-.3);
  }
  path('M-75 -42 Q0 -54 75 -42 L61 57 Q0 72 -61 57Z',grad(-80,-30,75,70,[[0,'#bf914f'],[.4,'#e1be79'],[1,'#ac7e45']]),'#775e3c',3);
  c.save();const basketMask=new Path2D('M-75 -42 Q0 -54 75 -42 L61 57 Q0 72 -61 57Z');c.clip(basketMask);
  for(let i=-12;i<17;i++){
    path('M'+(i*11)+' -55 Q'+(i*9-7)+' 5 '+(i*9-1)+' 80',null,'#997040',2.4);
    path('M'+(i*11+3)+' -55 Q'+(i*9-4)+' 5 '+(i*9+2)+' 80',null,'#efd198',1.1);
  }
  for(let j=0;j<14;j++){
    const yy=-43+j*8;
    path('M-90 '+yy+' Q0 '+(yy+13)+' 90 '+yy,null,j%2?'#ae8047':'#f0cf8e',2.7);
    for(let i=0;i<15;i++){const xx=-72+i*10;stroke([[xx,yy+5+(1-(xx*xx/6000))*4],[xx+5,yy+6+(1-(xx*xx/6000))*4]],'#805e37',.8)}
  }
  c.restore();
  ellipse(0,-42,75,10,null,'#735d3b',6);ellipse(0,-44,75,10,null,'#e5c181',3);
  path('M-60 56 Q0 70 61 56',null,'#86673d',5);
  stroke([[-51,-47],[-44,48]],'#ac7b42',4);stroke([[51,-47],[44,48]],'#ac7b42',4);
  // Small leather retaining straps.
  for(const x of [-40,40]){path('M'+x+' -49 h12 v40 h-12Z','#956d46','#725c3c',1);path('M'+(x+2)+' -27 h8 v8 h-8Z',null,'#d8b974',2)}
  c.restore();
}
function saddlebag(t){
  c.save();c.translate(-235,-186);c.rotate(Math.sin(t*2.1-.4)*.024);
  path('M-49 -19 Q0 -30 47 -18 L43 59 Q0 72 -45 59Z',grad(-50,-20,50,70,[[0,'#a27b53'],[.45,'#bb9465'],[1,'#805e43']]),'#614e39',2.5);
  path('M-51 -24 Q0 -39 50 -24 L45 8 Q0 23 -47 8Z','#a47a4f','#6f553b',2);
  for(const x of [-28,22]){path('M'+x+' -29 h11 v68 h-11Z','#75563b');path('M'+(x-1)+' 10 h13 v13 h-13Z',null,'#d4b97c',2);ellipse(x+5,32,1.6,1.6,'#d7bc86')}
  path('M-43 51 Q0 65 42 52',null,'#d0ab79',1);c.setLineDash([2,4]);path('M-44 -17 Q0 -29 44 -17 L40 3 Q0 17 -41 3Z',null,'#dcc08d',1);c.setLineDash([]);
  c.restore();
}
function bicycle(t,theta){
  wheel(-224,0,t);wheel(222,0,t);fender(-224);fender(222);
  // Rear rack and stays.
  stroke([[-295,-184],[-152,-184]],'#3d5a50',8);stroke([[-291,-189],[-153,-189]],'#b0b99a',2);
  stroke([[-224,-4],[-284,-184]],'#5e7f6d',5);stroke([[-224,-4],[-163,-184]],'#5e7f6d',5);
  saddlebag(t);
  tube([[-224,0],[-88,-235],[-4,-23],[-224,0]],11);
  tube([[-88,-235],[141,-215],[151,-157],[-4,-23]],16);
  tube([[-4,-23],[-88,-235]],17);
  tube([[141,-215],[151,-157]],19);
  tube([[151,-164],[177,-111],[222,0]],11);
  tube([[166,-166],[190,-106],[222,0]],6);
  // Cream tube panels, pinstripes and ornamental lugs.
  stroke([[-75,-234],[118,-218]],'#d9d4a6',5);
  stroke([[15,-41],[132,-145]],'#c8cda2',5);
  for(const p of [[-88,-235],[141,-215],[151,-157],[-4,-23]]){
    ellipse(p[0],p[1],8,8,'#b7b891','#466b5b',1.5);ellipse(p[0]-2,p[1]-2,2.5,2.5,'#f1dfac');
  }
  // Tiny leaf ornament, intentionally no lettering.
  c.save();c.translate(49,-226);c.rotate(-.06);stroke([[-18,0],[19,0]],'#527f68',1);for(let i=0;i<4;i++){leaf(-13+i*8,0,6,2.3,-.8,'#668f74');leaf(-10+i*8,0,6,2.3,.8,'#668f74')}c.restore();
  // Bottle cage and enamel flask.
  path('M37 -120 L61 -155 L76 -145 L53 -108Z','#607b66','#354f46',2);
  c.save();c.translate(47,-127);c.rotate(.62);path('M-10 -26 Q-10 -33 -6 -33 L6 -33 Q10 -33 10 -26 L11 19 Q0 26 -11 19Z','#d9d4a7','#587666',2);path('M-6 -36 h12 v7 h-12Z','#9c8d5e');stroke([[-8,-10],[8,-10]],'#b77a55',6);c.restore();

  stroke([[-25,0],[10,0]],'#527d74',2.8);ellipse(11,0,3,3,'#456d63');c.restore();

  for(let i=0;i<13;i++){
    const x=wrap(hash(i+600)*2900-t*(23+hash(i)*18),-400,2350);

function finish(t){

function draw(t){
  c.setTransform(1,0,0,1,0,0);c.clearRect(0,0,W,H);
  c.lineCap='round';c.lineJoin='round';c.setLineDash([]);c.lineDashOffset=0;c.globalAlpha=1;c.globalCompositeOperation='source-over';
  // Gentle approach, a long intimate portrait, then a graceful wider farewell.
  const approach=smooth(t/7.5),depart=smooth((t-16)/8);
  const zoom=.955+.145*approach-.145*depart;
  const panX=10*Math.sin(t*.16),panY=8*Math.sin(t*.2);
  c.save();c.translate(960+panX,540+panY);c.scale(zoom,zoom);c.translate(-960,-540);

}
