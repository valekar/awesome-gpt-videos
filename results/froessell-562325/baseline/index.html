 for(const e of beats){const d=t-e.t;if(d<0||d>2.1)continue;const a=ease(d/.12)*(1-ease((d-1.5)/.6)),s=1+.12*Math.exp(-d*8)*Math.sin(d*24);g.save();g.globalAlpha=a;g.translate(540,433-d*15);g.scale(s,s);text(e.label,3,4,e.n>=3?68:53,'#26343b','center');text(e.label,0,0,e.n>=3?68:53,e.n>=3?C.yellow:C.cream,'center');text('+'+e.score.toLocaleString('en-US'),0,69,58,C.cream,'center');g.restore()}

function render(t){
 t=clamp(t,0,CONFIG.duration);
 /* A short, seek-safe freeze on major impacts. */
 let visual=t;for(const e of beats)if(e.n&&t>=e.t&&t<e.t+.075)visual=e.t;
 const p=player(visual),ahead=pose(Math.min(visual+.6,170));
 const targetZ=.91-.06*(level(t)-1)/4;let shake=0,sx=0,sy=0,zoom=0;
 for(const e of [...beats.filter(e=>e.n),...damage]){const d=t-e.t;if(d>=0&&d<.65){const amp=(e.n>=3?20:e.d===30?24:9)*Math.exp(-d*8);sx+=Math.sin(d*103+e.t)*amp;sy+=Math.sin(d*87)*amp;zoom+=.028*Math.exp(-d*11);shake+=amp}}
 camera={x:mix(p.x,ahead.x,.5),y:mix(p.y,ahead.y,.5),z:targetZ+zoom,sx,sy};

 const drawables=[];

 for(const e of beats)if(e.n)burst(e.x,e.y,t-e.t,e.i,e.n>=3?65:32);
 if(t>=170)burst(pose(170).x,pose(170).y,t-170,99,55);
 for(const v of cops)if(!v.wreck)edgeArrow(v,t);
 /* Approaching final roadblock makes the failure legible. */
 if(t>166&&t<172){const q=pose(170),b=screen(q.x+Math.sin(q.a)*92,q.y-Math.cos(q.a)*92);g.save();g.translate(b.x,b.y);g.scale(camera.z,camera.z*.82);g.rotate(q.a);rr(-137,-18,274,39,7,'#c97840');rr(-137,-32,274,32,5,'#fff0cc');g.save();g.beginPath();g.rect(-137,-32,274,32);g.clip();for(let k=0;k<9;k++)poly([[-155+k*45,-33],[-132+k*45,-33],[-102+k*45,1],[-125+k*45,1]],'#c5553e');g.restore();rr(-117,0,14,32,3,'#87634c');rr(103,0,14,32,3,'#87634c');g.restore()}

}
/* Original synthesized audio, encoded to a WAV clip once at construction.
   Audio playback and seeking remain owned by HyperFrames; no AudioContext,
   playback loop, timer, requestAnimationFrame or extra animation clock. */
function makeSoundtrack(){
 const rate=CONFIG.audioSampleRate,count=rate*CONFIG.duration,buffer=new ArrayBuffer(44+count*2),view=new DataView(buffer);
 const write=(at,s)=>{for(let i=0;i<s.length;i++)view.setUint8(at+i,s.charCodeAt(i))};
 write(0,'RIFF');view.setUint32(4,36+count*2,true);write(8,'WAVE');write(12,'fmt ');view.setUint32(16,16,true);view.setUint16(20,1,true);view.setUint16(22,1,true);view.setUint32(24,rate,true);view.setUint32(28,rate*2,true);view.setUint16(32,2,true);view.setUint16(34,16,true);write(36,'data');view.setUint32(40,count*2,true);
 for(let i=0;i<count;i++){
  const t=i/rate,active=ease(t/1.5)*(1-ease((t-170)/1.2));
  const enginePhase=TAU*(58*t+10*Math.sin(t*.7)/.7);
  let s=(Math.sin(enginePhase)*.062+Math.sin(enginePhase*2)*.026+Math.sin(enginePhase*3)*.013)*active;
  const sirenPhase=TAU*(680*t-130*Math.cos(t*3.1)/3.1);
  s+=Math.sin(sirenPhase)*(.022+.003*level(t))*active;
  if(t>96)s+=Math.sin(TAU*(810*t+95*Math.sin(t*4.3)/4.3))*.022*active;
  const drift=Math.max(0,Math.abs(Math.sin(t*1.8))-.76)*active;
  s+=Math.sin(TAU*(1250*t+12*Math.sin(t*25)))*drift*.08;
  for(const e of beats){const d=t-e.t;if(d>=0&&d<.65){if(e.n){const noise=(fract(Math.sin(i*12.9898+e.i*78.233)*43758.5453)*2-1);s+=(noise*.23+Math.sin(d*TAU*(95-50*d))*.15)*Math.exp(-d*10)*Math.min(1,e.n*.55)}s+=Math.sin(TAU*(880*d+220*d*d))*.07*Math.exp(-d*7)}}
  if(t>=170&&t<171){const d=t-170;s+=(fract(Math.sin(i*17.71)*23817.12)*2-1)*.36*Math.exp(-d*6)}
  for(let k=1;k<5;k++){const d=t-CONFIG.wantedTimes[k];if(d>=0&&d<.5)s+=Math.sin(TAU*(440+Math.floor(d/.12)*110)*d)*.06*Math.exp(-d*3)}
  s*=1-ease((t-178)/2);view.setInt16(44+i*2,Math.round(clamp(s,-.9,.9)*32767),true);
 }
 const bytes=new Uint8Array(buffer);let binary='';for(let i=0;i<bytes.length;i+=16384)binary+=String.fromCharCode(...bytes.subarray(i,i+16384));

}
makeSoundtrack();
